function monthGrid(c,tz){
  const first={y:c.y,m:c.m,d:1},start=addDays(first,-cdow(first));
  const evs=calScopeEvents(),today=ckey(civil(Date.now(),tz));
  const dim=new Date(Date.UTC(c.y,c.m,0)).getUTCDate();
  const weeks=Math.ceil((cdow({y:c.y,m:c.m,d:1})+dim)/7);
  let html=`<div class="mgrid" style="--weeks:${weeks}"><div class="hd">`+DOWJA.map(d=>`<div>${d}</div>`).join('')+'</div>';
  for(let w=0;w<weeks;w++){
    html+='<div class="wk">';
    for(let i=0;i<7;i++){
      const day=addDays(start,w*7+i),k=ckey(day);
      const ds=zToUTC(day.y,day.m,day.d,0,0,tz),de=ds+86400000;
      const list=evs.filter(e=>e.end>ds&&e.start<de).sort((a,b)=>a.start-b.start);
      const hols=list.filter(e=>e.kind==='holiday');
      const rest=list.filter(e=>e.kind!=='holiday');
      const tgt=(S.scope==='all'||S.scope==='mine'||!S.scope)?me().id:S.scope;
      const mine=hols.some(e=>e.who.includes(tgt));
      html+=`<div class="cell ${day.m!==c.m?'out':''} ${k===today?'today':''} ${mine?'hol':''}" data-newday="${k}" title="${mine?'休暇':'クリックで予定を追加'}">
        <button class="n" data-jumpday="${k}" title="この日を開く">${day.d===1?day.m+'/':''}${day.d}</button>
        <span class="evdots">${rest.slice(0,4).map(e=>kindMark(e.kind,'dotic')).join('')}${rest.length>4?`<i class="more">+${rest.length-4}</i>`:''}</span>
        ${hols.map(e=>`<button class="ev holchip" data-ev="${e.id}" title="${esc(e.title)}">${kindMark(e.kind)}<span class="n">${esc(e.who.map(i=>(person(i)||{}).name||'').join('・'))} 休暇</span></button>`).join('')}
        ${rest.slice(0,hols.length?2:3).map(e=>`<button class="ev ${evClass(e)}" data-ev="${e.id}" title="${esc(hhmm(e.start,tz)+'–'+hhmm(e.end,tz)+' '+e.title)}">${kindMark(e.kind)}<span class="n">${esc(e.title)}</span></button>`).join('')}
        ${rest.length>(hols.length?2:3)?`<button class="ev more-ev" data-jumpday="${k}"><span class="n">ほか ${rest.length-(hols.length?2:3)} 件</span></button>`:''}
        <span class="addhint" aria-hidden="true">＋</span>
      </div>`;
    }
    html+='</div>';
  }
  return html+'</div>';
}
function lanes(list){
  const sorted=list.slice().sort((a,b)=>a.start-b.start||a.end-b.end);
  const res=[];let group=[],gEnd=-Infinity;
  const flush=()=>{
    if(!group.length)return;
    const cols=[],placed=[];
    group.forEach(e=>{let ci=0;while(ci<cols.length&&cols[ci]>e.start)ci++;cols[ci]=e.end;placed.push({e,i:ci});});
    placed.forEach(p=>res.push({e:p.e,i:p.i,n:cols.length}));
    group=[];gEnd=-Infinity;
  };
  sorted.forEach(e=>{if(e.start>=gEnd)flush();group.push(e);gEnd=Math.max(gEnd,e.end);});
  flush();
  return res;
}
function dayGrid(c,tz,days){
  const start=days===7?weekStart(c):c;
  const evs=calScopeEvents(),today=ckey(civil(Date.now(),tz));
  const cols=[];for(let i=0;i<days;i++)cols.push(addDays(start,i));
  const gt=`grid-template-columns:48px repeat(${days},minmax(0,1fr))`;
  let hd=`<div class="whd" style="${gt}"><div class="c"></div>`+
    cols.map(d=>`<button class="c ${ckey(d)===today?'today':''}" data-jumpday="${ckey(d)}">
      <span class="dw">${DOWJA[cdow(d)]}</span><span class="dn">${d.d}</span></button>`).join('')+'</div>';
  let body=`<div class="wbody"><div class="inner" style="${gt}"><div class="gut">`+
    Array.from({length:24},(_,h)=>`<div class="h">${h?pad2(h)+':00':''}</div>`).join('')+'</div>';
  const nowMs=Date.now();
  cols.forEach(d=>{
    const ds=zToUTC(d.y,d.m,d.d,0,0,tz),de=ds+86400000;
    const lay=lanes(evs.filter(e=>e.end>ds&&e.start<de));
    const dw=dayWork(me(),cdow(d)); const wk=!dw.off;
    const hol=holidayFor(me().id,ds,de);
    body+=`<div class="col dow-${cdow(d)} ${ckey(d)===today?'today':''} ${hol?'holcol':''}">`+
      Array.from({length:24},(_,h)=>`<div class="h ${!wk||h<T(dw.s)/60||h>=T(dw.e)/60?'off':''}"${hol?'':` data-newslot="${ckey(d)}|${pad2(h)}:00"`}></div>`).join('')+
      (hol?`<div class="holmask"><span>休暇</span></div>`:'');
    lay.forEach(o=>{
      const e=o.e,s2=Math.max(e.start,ds),en=Math.min(e.end,de);
      const top=(s2-ds)/3600000*46,h=Math.max((en-s2)/3600000*46,16);
      const w=100/o.n,left=w*o.i;
      body+=`<button class="evb ${evClass(e)}" data-ev="${e.id}" style="top:${top}px;height:${h-1}px;left:calc(${left}% + 2px);width:calc(${w}% - 4px)">
        <span class="n ell" style="display:block">${esc(e.title)}</span><span class="t">${hhmm(e.start,tz)}</span></button>`;
    });
    if(ckey(d)===today)body+=`<div class="nowline" data-day="${ds}" style="top:${(nowMs-ds)/3600000*46}px"></div>`;
    body+='</div>';
  });
  return `<div class="wgrid">${hd}${body}</div></div></div>`;
}

function mapSection(counts,now){
  return `<div class="mapwrap">
    <div class="mapinner"><canvas id="worldmap"></canvas>
      ${(()=>{
        /* 近い都市どうしでラベルが重ならないように少しずらし、
           端の都市は札が地図からはみ出さないように寄せる */
        const put=[];
        return Object.entries(counts).map(([c,n])=>{
          const C=CITIES[c];
          const x=(C.lon+180)/360*100;
          let y=(LANDMASK.top-C.lat)/(LANDMASK.top-LANDMASK.bot)*100;
          let k=0;
          while(put.some(q=>Math.abs(q.x-x)<13&&Math.abs(q.y-(y+k*20))<18)&&k<3) k++;
          y=Math.max(12,Math.min(88,y+k*20));
          put.push({x,y});
          const tr = x>76 ? 'translate(calc(-100% + 12px),-50%)'
                   : x<24 ? 'translate(-12px,-50%)'
                          : 'translate(-50%,-50%)';
          return `<button class="pinb" data-city="${c}" aria-pressed="${S.city===c}" style="left:${x}%;top:${y}%;transform:${tr}">
            <span class="fl">${C.flag}</span><span>${C.en}</span><span class="cnt">${n}</span><span class="tt" data-tz="${C.tz}">${hhmm(now,C.tz)}</span></button>`;
        }).join('');
      })()}
    </div>
  </div>`;
}
function drawMap(){
  const cv=$('#worldmap');if(!cv)return;
  const wrap=cv.parentElement,W=wrap.clientWidth,H=wrap.clientHeight;
  if(!W||!H)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=W*dpr;cv.height=H*dpr;
  const g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,W,H);
  const bin=atob(LANDMASK.b64);
  const cs=getComputedStyle(document.body);
  const col=cs.getPropertyValue('--ink-2').trim()||'#33373E';
  const cw=W/LANDMASK.cols,ch=H/LANDMASK.rows,r=Math.max(Math.min(cw,ch)*0.42,1);
  const now=new Date(),utcH=now.getUTCHours()+now.getUTCMinutes()/60,sunLon=(12-utcH)*15;
  for(let row=0;row<LANDMASK.rows;row++){
    for(let c2=0;c2<LANDMASK.cols;c2++){
      const i=row*LANDMASK.cols+c2;
      if(!((bin.charCodeAt(i>>3)>>(7-(i&7)))&1))continue;
      const lon=-180+360*(c2+.5)/LANDMASK.cols;
      const dl=Math.abs(((lon-sunLon+540)%360)-180);
      g.globalAlpha=dl<80?0.92:0.3;g.fillStyle=col;
      g.beginPath();g.arc(cw*(c2+.5),ch*(row+.5),r,0,6.284);g.fill();
    }
  }
  g.globalAlpha=1;
}

function diffLabel(a,b,now){
  const d=(tzOffMin(now,effTz(a))-tzOffMin(now,effTz(b)))/60;
  return d===0?'なし':(d>0?'+':'')+(Number.isInteger(d)?d:d.toFixed(1))+' 時間';
}
function freeGaps(p,from,to){
  if(p.location==='holiday')return [];
  const tz=effTz(p),c=civil(from,tz);
  const dw=dayWork(p,P(from,tz).dow);
  if(dw.off)return [];
  const ws=zToUTC(c.y,c.m,c.d,+dw.s.split(':')[0],+dw.s.split(':')[1],tz);
  const we=zToUTC(c.y,c.m,c.d,+dw.e.split(':')[0],+dw.e.split(':')[1],tz);
  let cur=Math.max(from,ws);const out=[];
  DB.events.filter(e=>e.who.includes(p.id)&&e.end>cur&&e.start<we).sort((a,b)=>a.start-b.start)
    .forEach(e=>{if(e.start-cur>=15*60000)out.push([cur,e.start]);cur=Math.max(cur,e.end);});
  if(we-cur>=15*60000)out.push([cur,we]);
  return out.slice(0,4);
}

function findSlots(){
  const ids=S.ft.sel,dur=S.ft.dur*60000,step=15*60000;
  const now=Date.now(),from=Math.ceil(now/step)*step,to=from+S.ft.span*86400000;
  const ps=ids.map(person).filter(Boolean);
  const res=[],perDay={};
  for(let t=from;t<to&&res.length<8;t+=step){
    const e=t+dur;let ok=true;
    for(const p of ps){
      if(p.location==='holiday'){ok=false;break;}
      const tz=effTz(p),a=P(t,tz),b=P(e-1,tz);
      const dwa=dayWork(p,a.dow);
      if(dwa.off||a.h*60+a.mi<T(dwa.s)){ok=false;break;}
      if(b.h*60+b.mi>=T(dwa.e)||b.dow!==a.dow){ok=false;break;}
      if(DB.events.some(ev=>ev.who.includes(p.id)&&ev.start<e&&ev.end>t)){ok=false;break;}
    }
    if(ok){
      const k=dkey(t,effTz(me()));perDay[k]=(perDay[k]||0)+1;
      if(perDay[k]<=3){res.push({s:t,e});t+=Math.max(dur,3600000)-step;}
      else{const c=civil(t,effTz(me()));t=zToUTC(c.y,c.m,c.d+1,0,0,effTz(me()))-step;}
    }
  }
  return res;
}

function workSegs(p,ds){
  const out=[];
  for(let i=0;i<48;i++){
    const t=ds+i*1800000;
    if(isWorking(p,t)){
      const a=i/48*100,b=(i+1)/48*100,last=out[out.length-1];
      if(last&&Math.abs(last[1]-a)<0.001)last[1]=b;else out.push([a,b]);
    }
  }
  return out;
}
function bandBlock(title,note){
  const now=Date.now(),tz=effTz(me()),c=civil(now,tz),ds=zToUTC(c.y,c.m,c.d,0,0,tz);
  const nowX=(now-ds)/86400000*100;
  return `<div class="block">

    ${DB.people.map(p=>{
      const segs=workSegs(p,ds);

        <div class="track">
          ${[6,12,18].map(h=>`<span class="tick" style="left:${h/24*100}%"></span>`).join('')}
          ${segs.map(g=>`<span class="fill" style="left:${g[0]}%;width:${g[1]-g[0]}%"></span>`).join('')}
          ${nowX>=0&&nowX<=100?`<span class="now" style="left:${nowX}%"></span>`:''}
        </div></div>`;}).join('')}
    <div class="bandx"><div></div><div class="sc">${[0,6,12,18,24].map(h=>`<span style="left:${h/24*100}%">${pad2(h%24)}</span>`).join('')}</div></div>
    ${(()=>{const ov=overlapSegs(ds);
      return `<div class="bandov">${ov.length
        ? `<span class="ol">全員が重なる時間</span>`+ov.map(g=>`<span class="ov">${pctTime(g[0])}–${pctTime(g[1])}</span>`).join('')
        : '<span class="ol">全員が重なる時間</span><span class="ov none">今日はありません</span>'}</div>`;})()}
  </div>`;
}
function overlapSegs(ds){
  const ps=DB.people.filter(p=>p.location!=='holiday');
  if(!ps.length)return [];
  let acc=[[0,100]];
  ps.forEach(p=>{
    const segs=workSegs(p,ds),out=[];
    acc.forEach(a=>segs.forEach(b=>{const s=Math.max(a[0],b[0]),e=Math.min(a[1],b[1]);if(e-s>0.4)out.push([s,e]);}));
    acc=out;
  });
  return acc;
}
function pctTime(x){const m=Math.round(x/100*1440/5)*5;return pad2(Math.floor(m/60)%24)+':'+pad2(m%60);}

function iapPlugin(){
  try{
    const C=window.Capacitor; if(!C) return null;
    if(C.Plugins&&C.Plugins.NativePurchases) return C.Plugins.NativePurchases;
    if(typeof C.registerPlugin==='function') return C.registerPlugin('NativePurchases');
  }catch(e){}
  return null;
}
/* App Store の実価格を取ってきて、画面の値段を差し替える */
async function syncStorePrices(){
  if(!SELL || !IS_APP) return;      /* 無料版では App Store の価格を見にいかない */
  const NP=iapPlugin(); if(!NP||!NP.getProducts) return;
  if(STORE_PRICE) return;
  const ids=[];
  DB.plans.forEach(p=>{ if(p.price){ ids.push(IAP_ID(p.id,'month'),IAP_ID(p.id,'year')); } });
  if(!ids.length) return;
  try{
    const res=await NP.getProducts({productIdentifiers:ids,productType:'subs'});
    const list=(res&&res.products)||[];
    if(!list.length) return;
    STORE_PRICE={};
    list.forEach(p=>{
      const id=p.identifier||p.productIdentifier||p.planIdentifier;
      const label=p.priceString||p.displayPrice||'';
      if(id&&label) STORE_PRICE[id]=label;
    });
    softRender();
  }catch(e){ console.warn('[Koyomi] App Store の価格を取れませんでした', e); }
}
/* 画面に出す値段。App Store から取れていればそれを、無ければ計算した税込を使う */
function priceLabel(plan,cyc,yen){
  if(IS_APP&&STORE_PRICE){
    const v=STORE_PRICE[IAP_ID(plan,cyc)];
    if(v) return v;
  }
  return YEN(INTAX(yen));
}

/* ---- Apple のアプリ内課金：購入と復元 ---- */
let iapBusy=false;
async function doApplePurchase(planId,cyc){
  if(iapBusy)return; 
  const NP=iapPlugin();
  if(!NP){ toast('この端末では購入できません'); return; }
  iapBusy=true; toast('App Store をひらいています…');
  try{
    const r=await NP.purchaseProduct({productIdentifier:IAP_ID(planId,cyc),productType:'subs'});
    const tx=(r&&r.transaction)?r.transaction:r;      // プラグインの版による違いを吸収
    const jws=tx&&(tx.jwsRepresentation||tx.jws);
    if(!jws) throw new Error('レシートを受け取れませんでした');
    await sendReceipt(jws,'お申し込みが完了しました');
  }catch(e){
    const m=String((e&&(e.message||e.code))||'');
    if(/cancel/i.test(m)){ iapBusy=false; return; }     // やめただけ
    iapErr('購入に失敗しました',m);
  }finally{ iapBusy=false; }
}
async function doAppleRestore(){
  if(iapBusy)return;
  const NP=iapPlugin();
  if(!NP){ toast('この端末では利用できません'); return; }
  iapBusy=true; toast('購入を確認しています…');
  try{
    if(NP.restorePurchases) await NP.restorePurchases();
    const res=await NP.getPurchases({productType:'subs',onlyCurrentEntitlements:true});
    const list=((res&&res.purchases)||[]).filter(p=>p&&p.isActive!==false);
    if(!list.length){ toast('有効なお支払いが見つかりませんでした'); return; }
    const ours=list.find(p=>/^com\.shiraume\.koyomi\.sub\./.test(p.productIdentifier||''))||list[0];
    const jws=ours&&(ours.jwsRepresentation||ours.jws);
    if(!jws) throw new Error('レシートを読み取れませんでした');
    await sendReceipt(jws,'お支払いを復元しました');
  }catch(e){ iapErr('復元に失敗しました',String((e&&(e.message||e.code))||'')); }
  finally{ iapBusy=false; }
}
/* レシートをサーバへ送り、Apple の署名を確かめてもらう。
   「買えた」というアプリの言葉ではなく、Apple の署名だけを信じる作りにしてある。 */
async function sendReceipt(jws,okMsg){
  const r=await Store.billing.verifyApple(jws);
  if(!r||!r.ok) throw new Error((r&&r.error)||'お支払いを確認できませんでした');
  const fresh=await Store.pull();
  if(fresh&&!fresh.needsCompany){const v=S.view,a=S.adm;DB=fresh;S.view=v;S.adm=a;}
  render(); toast(okMsg);
}

/* ================= layer / modals ================= */
function layer(html){$('#layer').innerHTML=html;if(html)afterLayer();}
const closeLayer=()=>layer('');
function afterLayer(){
  const f=$('#layer input,#layer select,#layer textarea');
  if(f&&window.innerWidth>900)f.focus();
}
function modal(title,body,footer,wide){
  return `<div class="scrim" data-scrim="1"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="mh"><h3>${esc(title)}</h3><div class="sp"></div><button class="x" data-act="close-layer" aria-label="閉じる">${icon('x')}</button></div>
    <div class="mb">${body}</div>${footer?`<div class="mf">${footer}</div>`:''}</div></div>`;
}
function tzRows(e){
  const u=me(),cities=[...new Set(e.who.map(i=>effCity(person(i))).concat([effCity(u)]))];
  const base=P(e.start,effTz(u));
  cities.sort((a,b)=>tzOffMin(e.start,CITIES[b].tz)-tzOffMin(e.start,CITIES[a].tz));
  return `<div class="tzlist">`+cities.map(c=>{
    const C=CITIES[c],tz=C.tz,p=P(e.start,tz),pe=P(e.end,tz);
    const dd=Math.round((zToUTC(p.y,p.m,p.d,0,0,tz)-zToUTC(base.y,base.m,base.d,0,0,effTz(u)))/86400000);
    const mem=e.who.map(person).filter(x=>x&&effCity(x)===c);
    const a=p.h*60+p.mi;
    const out=mem.filter(pp=>{const w=dayWork(pp,p.dow);return w.off||a<T(w.s)||a>=T(w.e);});
    const night=p.h<7||p.h>=21;
    return `<div class="tzr ${c===effCity(u)?'self':''} ${out.length?'warn':''}">
      <span class="fl">${C.flag}</span>
      <span class="cy"><b>${C.en}</b><small>${C.ja}</small></span>
      <span class="who">${mem.length?mem.map(pp=>`<span class="w">${avatar(pp,'s')}<em>${esc(pp.name)}</em></span>`).join(''):'<span class="w none">—</span>'}</span>
      <span class="tt"><b>${pad2(p.h)}:${pad2(p.mi)}</b><i>–</i><span>${pad2(pe.h)}:${pad2(pe.mi)}</span>
        ${dd?`<em class="nd">${dd>0?'翌日':'前日'}</em>`:''}</span>
      <span class="flag">${out.length?'<span class="wb">勤務時間外</span>':night?'<span class="wb nt">夜</span>':'<span class="wb ok">勤務時間内</span>'}</span>
    </div>`;
  }).join('')+`</div>`;
}

    `<button class="btn pri" data-act="save-event" data-id="${id||''}">${e?'保存':'作成'}</button>
     <button class="btn q" data-act="close-layer">キャンセル</button>
     <div class="sp"></div><span class="muted" style="font-size:13px">保存すると各メンバーの現地時間に自動変換されます</span>`,true));

function saveEvent(id){
  const title=$('#e-title').value.trim()||'（無題の予定）';
  const tz=$('#e-tz').value,d=$('#e-date').value.split('-').map(Number);
  const s=$('#e-start').value.split(':').map(Number),en=$('#e-end').value.split(':').map(Number);
  const kind=$('#e-kind').value;
  let start=zToUTC(d[0],d[1],d[2],s[0],s[1],tz),end=zToUTC(d[0],d[1],d[2],en[0],en[1],tz);
  if(kind==='holiday'){start=zToUTC(d[0],d[1],d[2],0,0,tz);end=zToUTC(d[0],d[1],d[2]+1,0,0,tz);}
  if(end<=start)end=start+30*60000;
  const who=S._who.length?S._who:[me().id];
  if(kind!=='holiday'){
    for(const pid of who){
      const h=DB.events.find(x=>x.kind==='holiday'&&x.id!==id&&x.who.includes(pid)&&x.end>start&&x.start<end);
      if(h){toast((person(pid)||{}).name+' さんはこの日は休暇です。日付を変えてください。');return;}
    }
  }
  const ev={id:id||uid(),title,kind,start,end,tz,place:$('#e-place').value.trim(),
    url:$('#e-url').value.trim(),who,note:$('#e-note').value.trim(),vis:$('#e-vis').value,
    rem:+$('#e-rem').value,owner:id?DB.events.find(x=>x.id===id).owner:me().id,seed:false};
  const i=DB.events.findIndex(x=>x.id===id);
  if(i>=0)DB.events[i]=ev;else DB.events.push(ev);
  audit(id?'予定を更新':'予定を作成',title);
  const when=`${P(start,effTz(me())).m}/${P(start,effTz(me())).d} ${hhmm(start,effTz(me()))}`;
  if(DB.company.notify.change||!id)notify(who,'event',`${me().name}さんが「${title}」を${id?'更新':'追加'}しました（${when}）`,ev.id);
  save();closeLayer();render();toast(id?'予定を更新しました':'予定を作成しました');
}

async function doDeleteAccount(){
  const err=(t)=>{const el=$('#del-err'); if(el){el.textContent=t; el.style.color='var(--k-sales)';}};
  const w=(($('#del-word')||{}).value||'').trim();
  if(w!=='削除') return err('「削除」と入力してください。');
  const btn=$('[data-act="del-account-go"]');
  if(btn){btn.disabled=true; btn.textContent='削除しています…';}
  try{
    if(window.Store && Store.auth && Store.auth.deleteAccount) await Store.auth.deleteAccount();
    closeLayer();
    await logout();
    toast('アカウントを削除しました');
  }catch(e){
    if(btn){btn.disabled=false; btn.textContent='アカウントを削除する';}
    err((e&&e.message)||'削除できませんでした。時間をおいてお試しください。');
  }
}

<script>
/* ================= wiring ================= */
function softRender(){

}
function curTheme(){try{return localStorage.getItem('koyomi.theme')==='dark'?'dark':'light';}catch(e){return 'light';}}
function applyTheme(v){
  v=(v==='dark')?'dark':'light';

  try{localStorage.setItem('koyomi.theme',v);}catch(e){}

}
function go(v){S.view=v;if(v!=='map')S.city=S.city;render();window.scrollTo(0,0);}

document.addEventListener('click',ev=>{
  const t=ev.target;
  const scrim=t.closest?.('[data-scrim]');
  if(scrim&&t===scrim){closeLayer();return;}
  const el=t.closest?.('[data-act],[data-go],[data-city],[data-person],[data-ev],[data-newday],[data-newslot],[data-jumpday],[data-cal],[data-calmode],[data-pmode],[data-thread],[data-adm],[data-ftp],[data-ftpick],[data-who],[data-dow],[data-dowtog],[data-dowmore],[data-setstatus],[data-login],[data-setui],[data-authtab],[data-onb]');
  if(!el)return;
  const d=el.dataset;
  if(d.act){
    switch(d.act){
      case 'close-layer':closeLayer();return;
      case 'notif-perm':askNotifPerm();return;
      case 'demo-login':demoLogin();return;
      case 'notifs':notifCenter();return;
      case 'read-all':{markRead();closeLayer();render();return;}
      case 'savelog':{const el=$('#daylog');if(el){setLog(el.value.trim());toast('今日の記録を保存しました');softRender();}return;}
      case 'logout':logout();return;
      case 'save-dow-me':{
        me().work=dowCollect('me-dw');
        audit('働きかたを変更',me().work.days.map(d=>DOWJA[d]).join('')||'休みのみ');
        save();softRender();toast('働きかたを保存しました');return;}
      case 'save-dow-co':{
        DB.company.defaultWork=dowCollect('co-dw');
        audit('既定の働きかたを変更',DB.company.defaultWork.days.map(d=>DOWJA[d]).join('')||'休みのみ');
        save();softRender();toast('既定の働きかたを保存しました');return;}
      case 'del-account':delAccountModal();return;
      case 'del-account-go':doDeleteAccount();return;
      case 'newcode':{
        Store.auth.rotateJoinCode().then(c=>{DB.company.joinCode=c;render();toast('招待コードを再発行しました');})
          .catch(e=>toast('再発行できませんでした: '+e.message));return;}
      case 'newcode__old':{DB.company.joinCode=genCode();audit('招待コードを再発行',DB.company.joinCode);save();render();toast('招待コードを再発行しました');return;}
      case 'new-event':eventEditor(null,null);return;
      case 'edit-event':eventEditor(d.id,null);return;
      case 'add-on-day':{const[y,m,dd]=d.day.split('-').map(Number);
        eventEditor(null,{start:zToUTC(y,m,dd,10,0,effTz(me())),dur:60});return;}
      case 'open-day':{const[y,m,dd]=d.day.split('-').map(Number);
        closeLayer();S.cursor={y,m,d:dd};S.cal='day';S.view='calendar';render();return;}
      case 'del-holiday':{
        const e=DB.events.find(x=>x.id===d.id);if(!e)return;
        const k=dkey(e.start,effTz(me()));
        DB.events=DB.events.filter(x=>x.id!==d.id);
        audit('休暇を取り消し',e.title);save();render();dayPanel(k);toast('休暇を取り消しました');return;}

      case 'forgot':forgotPassword();return;
      case 'apple':doApple();return;
      case 'signout-onb':{Store.auth.signOut().then(()=>{S.onb={tab:'make',err:'',busy:false,v:{}};S.appleName='';renderAuth();});return;}

      case 'setloc':{me().location=d.id;if(d.id!=='trip')me().tripCity=null;audit('勤務場所を変更',LOCS[d.id]);save();closeLayer();render();return;}
      case 'account':accountSwitcher();return;
      case 'invite':inviteModal();return;
      case 'do-invite':{
        const n=$('#i-name').value.trim(),m=$('#i-mail').value.trim();
        if(!n||!m){toast('名前とメールアドレスを入力してください');return;}

        DB.people.push(p);DB.invites.push({email:m,at:Date.now(),by:DB.userId});
        audit('メンバーを招待',`${n} <${m}>`);save();closeLayer();render();toast(`${n} さんを招待しました`);return;}
      case 'invites':{
        layer(modal('招待状況',DB.invites.length?`<div class="tblwrap"><table class="t" style="min-width:0"><thead><tr><th>メール</th><th>送信日時</th><th>状態</th></tr></thead><tbody>
          ${DB.invites.map(i=>{const p=P(i.at,effTz(me()));return `<tr><td>${esc(i.email)}</td><td class="tnum">${p.m}/${p.d} ${pad2(p.h)}:${pad2(p.mi)}</td><td class="muted">参加済み</td></tr>`;}).join('')}

      case 'del-photo':{const p=person(d.id);if(p){delete p.photo;audit('プロフィール写真を削除',p.name);save();

        p.location=$('#m-loc').value;p.work=dowCollect('mm-dw');
        audit('メンバー情報を更新',p.name);save();closeLayer();render();toast('保存しました');return;}

                        font-family:var(--lat);font-size:14px;color:var(--ink);word-break:break-all">
              ${esc((VENDOR.urls&&VENDOR.urls.site)||'shiraumedigital.com/koyomi/')}

            このアプリと同じメールアドレスでログインすると、［設定］→［プラン］から手続きできます。<br>

function setImage(path,file){
  const parts=path.split('.');
  if(parts[0]==='logo')return setLogo(file);
  if(parts[0]==='person')return setPhoto(parts[1],file);
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');c.width=c.height=128;
      const g=c.getContext('2d');
      const sc=Math.min(128/img.width,128/img.height),w=img.width*sc,h=img.height*sc;
      g.drawImage(img,(128-w)/2,(128-h)/2,w,h);
      let data;try{data=c.toDataURL('image/png');}catch(e){toast('この画像は読み込めませんでした');return;}
      DB.images=DB.images||{ui:{},kinds:{}};
      DB.images[parts[0]]=DB.images[parts[0]]||{};
      DB.images[parts[0]][parts[1]]=data;
      audit('画像を設定',path);save();render();toast('画像を設定しました');
    };
    img.onerror=()=>toast('画像として読み込めませんでした');
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function setLogo(file){
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');c.width=c.height=128;
      const g=c.getContext('2d');
      const sc=Math.min(128/img.width,128/img.height),w=img.width*sc,h=img.height*sc;
      g.drawImage(img,(128-w)/2,(128-h)/2,w,h);
      try{DB.company.logo=c.toDataURL('image/png');}catch(e){toast('この画像は読み込めませんでした');return;}
      audit('会社ロゴを更新',DB.company.name);save();render();toast('ロゴを設定しました');
    };

}
function setPhoto(id,file){
  const p=person(id);if(!p||!file)return;
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');c.width=c.height=176;
      const g=c.getContext('2d');
      const side=Math.min(img.width,img.height);
      g.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,176,176);
      try{p.photo=c.toDataURL('image/jpeg',0.82);}catch(e){toast('この画像は読み込めませんでした');return;}
      audit('プロフィール写真を更新',p.name);save();
      refreshPhotoBlock(p);
      softRender();toast('写真を更新しました');
    };
    img.onerror=()=>toast('画像として読み込めませんでした');
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

/* 毎朝のダイジェスト（設定で切り替え） */
function dailyDigest(){
  if(!DB.authed||!person(DB.userId))return;
  if(!DB.company.notify||!DB.company.notify.daily)return;
  const u=me(),tz=effTz(u),now=Date.now(),k=dkey(now,tz);
  if(DB.notifs.some(n=>n.type==='daily'&&n.to===u.id&&n.day===k))return;
  const[ds,de]=dayBounds(civil(now,tz),tz);
  const mine=DB.events.filter(e=>e.who.includes(u.id)&&e.end>ds&&e.start<de).sort((a,b)=>a.start-b.start);
  const hol=mine.find(e=>e.kind==='holiday');
  const txt=hol?`今日は休暇です（${hol.title}）。ゆっくり。`
    :mine.length?`今日は ${mine.length}件。最初は ${hhmm(mine[0].start,tz)} 「${mine[0].title}」です。`
    :'今日の予定はありません。';
  DB.notifs.unshift({id:uid(),to:u.id,by:u.id,type:'daily',day:k,text:'今日のダイジェスト ・ '+txt,ref:'',at:now,read:false});
  save();
}

/* 終業したら「おつかれさま」を1日1回 */
function endOfDayCheck(){
  if(!DB.authed||!person(DB.userId))return;
  if(DB.company.notify&&DB.company.notify.done===false)return;
  const u=me(),tz=effTz(u),now=Date.now(),k=dkey(now,tz);
  if(isDayOff(u,now))return;
  const w=workOn(u,now),pt=P(now,tz);
  if(pt.h*60+pt.mi<T(w.e))return;                 /* まだ終業前 */
  if(DB.notifs.some(n=>n.type==='done'&&n.to===u.id&&n.day===k))return;
  const[ds,de]=dayBounds(civil(now,tz),tz);
  const cnt=DB.events.filter(e=>e.who.includes(u.id)&&e.kind!=='holiday'&&e.end>ds&&e.start<de).length;
  DB.notifs.unshift({id:uid(),to:u.id,by:u.id,type:'done',day:k,
    text:`今日はここまで。おつかれさまでした。${cnt?'（今日の予定 '+cnt+'件）':''}`,ref:'',at:now,read:false});
  save();
  if(!$('#layer').innerHTML)softRender();
}

/* 端末（iPhone）の通知の許可ぐあい。native.js が window.NOTIF_PERM に入れてくれるので
   （別ファイルから書き換えられるよう）var で置く。 */
var NOTIF_PERM='';
function koyomiNative(){
  try{ const C=window.Capacitor;
    return (C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Koyomi)?C.Plugins.Koyomi:null;
  }catch(e){ return null; }
}
async function askNotifPerm(){
  const P=koyomiNative(); if(!P)return;
  try{
    if(NOTIF_PERM==='denied'){ if(P.openSettings)await P.openSettings(); return; }
    const r=await P.requestPermission();
    NOTIF_PERM=window.NOTIF_PERM=(r&&r.granted)?'granted':'denied';
    try{localStorage.setItem('koyomi.notifAsked','1');}catch(e){}
    softRender();
    if(NOTIF_PERM==='granted'&&window.__koyomiSync)window.__koyomiSync(true);
    else if(NOTIF_PERM==='denied')toast('iPhone の設定 → 通知 から、あとで変えられます');
  }catch(e){ toast('通知の設定を開けませんでした'); }
}

    S.auth.err=/接続設定/.test(e&&e.message||'')
      ? e.message
      : 'サーバに接続できませんでした。通信環境を確認して、開き直してください。';
    renderAuth();
  }finally{ splashOff(); }
})();
setInterval(tick,1000);
setInterval(()=>{try{endOfDayCheck();}catch(e){}
  if(!$('#layer').innerHTML&&['today','people','map','admin'].includes(S.view))softRender();},60000);
</script>

<script src="native.js"></script>
