.clockbar .ck .o{display:none}
.clockbar .ck.home{background:var(--paper);border-bottom-color:var(--accent)}
.clockbar .ck.home .t{color:var(--ink)}
.clockbar .ck.home .c{color:var(--accent-3)}
.clockbar .ck.night .t{color:var(--ink-4)}
.clockbar .ck.home.night .t{color:var(--ink-2)}
.clockbar .tail{font-size:13px;color:var(--ink-3);font-weight:600}
.clockbar .tail b{font-size:14px;color:var(--ink);font-weight:700}

/* ---- パネル：境界をはっきり ---- */
.block{border:1px solid var(--line-2);border-radius:10px;background:var(--paper);overflow:hidden;margin-bottom:22px}
.block>.sec{margin:0;padding:11px 16px;background:var(--sunken);border-bottom:1px solid var(--line-2);
  border-radius:0;align-items:center}
.block>.sec h2{font-size:13.5px;font-weight:700;letter-spacing:.03em;color:var(--ink)}
.block>.sec .note{font-size:12.5px;color:var(--ink-3)}
.block>.tl{border:0}
.block>.tl .it{padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.block>.tl .it:first-of-type{border-top:0}
.block>.tl .it::before{left:0;top:0;bottom:0;border-radius:0;width:4px}
.block>.tl .it:last-of-type{border-bottom:0}
.block>.tl .end{padding-left:16px;padding-right:16px;border-top:1px solid var(--line);background:var(--side)}
.block>.tl .empty{padding:30px 16px}
.block>.pl{padding:0}
.block>.pl .p{padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.block>.pl .p:first-child{border-top:0}
.block>.pl .p:last-child{border-bottom:0}
.block>.daylog{padding:16px}
.block>.summary{padding:16px}
.block>.tscroll{border:0;border-radius:0}
.block>.tscroll table.t th:first-child,.block>.tscroll table.t td:first-child{padding-left:16px}
.block>.tscroll table.t th:last-child,.block>.tscroll table.t td:last-child{padding-right:16px}
.block>.tscroll table.t thead th{padding-top:10px;padding-bottom:10px;background:var(--side)}
.block>.tscroll table.t tbody tr:last-child td{border-bottom:0}
.block>.row,.block>.kv,.block>.slots,.block>.band,.block>.bandx,.block>.muted,.block>.empty{padding-left:16px;padding-right:16px}
.block>.row,.block>.kv{padding-top:16px;padding-bottom:16px}
.block>.band:first-of-type{padding-top:14px}
.block>.bandx{padding-bottom:14px}
.block>.muted{padding-bottom:14px}
.block>.slots .s{padding-left:16px;padding-right:16px}
.block>.slots{border-top:0}
.block>div[style*="flex-direction:column"]{padding:16px}
.block>.imgslot{padding-left:16px;padding-right:16px}
.block>.imgslot:last-of-type{border-bottom:0}

/* 表は単体でも枠を持つ */
.tscroll{border:1px solid var(--line-2);border-radius:10px;overflow:auto;background:var(--paper)}
table.t thead th{background:var(--side);border-bottom:1px solid var(--line-2)}
.tscroll>table.t th:first-child,.tscroll>table.t td:first-child{padding-left:16px}
.tscroll>table.t th:last-child,.tscroll>table.t td:last-child{padding-right:16px}
table.t thead th{padding-top:10px;padding-bottom:10px}

/* ---- Today ヒーロー ---- */
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:space-between;
  border:1px solid var(--line-2);border-radius:10px;background:var(--side);padding:18px 20px;margin-bottom:22px}
.hero .dayhead{margin:0}
.hero .dayhead .d{font-size:32px;line-height:1.1}
.hero .dayhead .w{font-size:15px;font-weight:700}
.hero-st{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:13.5px;color:var(--ink-2)}
.hero-st .hs-sep{width:1px;height:13px;background:var(--line-2)}
.hero-st .hs-i{font-weight:600}
.hero-st .hs-i b{font-family:var(--lat);font-weight:700;color:var(--ink)}
.hero-r{display:flex;gap:9px;flex-wrap:wrap}
.today{gap:0 32px}
@media (min-width:1080px){ .today-side{border-left:0;padding-left:0} }

/* 右レーン：数字 */
.today-side .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border:0;margin:0;padding:16px}
.today-side .summary span{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.5;font-weight:600}
.today-side .summary b{display:block;font-size:23px;font-weight:700;color:var(--ink);margin-bottom:1px;font-family:var(--lat)}
.pl .sub .cty .cn{font-size:12px}
.pl .sub{font-size:12px}
.pl .rt .st{font-size:11.5px}

/* 国表示をおとなしく */
.cty .cc{display:none}
.pinb .tt{display:none}

@media (max-width:980px){
  .ptitle{font-size:17px}
  .clockbar .ck{padding:9px 14px;gap:8px}
  .clockbar .ck .fl{font-size:18px}
  .clockbar .ck .t{font-size:19px}
  .hero{padding:16px}
  .hero .dayhead .d{font-size:28px}
  .today-side{margin-top:0}
}

/* ============================================================
   v19 — 文字（字体・濃さ・色・配置）／メンバー一覧・地図・空き時間
   ============================================================ */

/* --- 1. 文字の基準を引き締める --- */
body{font-family:var(--jp);font-size:14px;line-height:1.7;letter-spacing:.005em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.muted{color:var(--ink-3)}
h1,h2,h3,b,strong{letter-spacing:0}
/* 数字はすべて等幅で縦に揃える */
.tnum,.mlist .t,.clockbar .ck .t,.clockbar .tail b,.clockbar .tail .tt,
.slotday .tm,.slotday .tm2,.slotday .z,.pinb .tt,.pinb .cnt,
.today-side .summary b,.tl .it .tm,.bdg{font-family:var(--lat);font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;letter-spacing:-.005em}
/* ラベル（小見出し・単位）は一段小さく、色で沈める */
.lbl-s{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-4);font-family:var(--lat)}

/* --- 2. メンバー一覧：表をやめて行に --- */
.mlist{border:1px solid var(--line-2);border-radius:10px;background:var(--paper);overflow:hidden}
.mlist .m{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:0 16px;
  width:100%;text-align:left;padding:16px 18px;border-bottom:1px solid var(--line);background:none}
.mlist .m:last-child{border-bottom:0}
.mlist .m:hover{background:var(--side)}
.mlist .ph{display:flex;align-items:center}
.mlist .info{display:block;min-width:0}
.mlist .nm{display:inline;font-size:16px;font-weight:700;color:var(--ink);letter-spacing:.005em}
.mlist .role{display:inline;font-size:12.5px;font-weight:600;color:var(--ink-3);margin-left:10px}
.mlist .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:3px;
  font-size:12.5px;font-weight:500;color:var(--ink-3);line-height:1.5}
.mlist .meta .cty .cn{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.mlist .meta .fl{font-size:14px}
.mlist .sep{color:var(--line-3)}
.mlist .next{display:block;margin-top:7px;font-size:13px;font-weight:500;color:var(--ink-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlist .next b{font-family:var(--lat);font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.mlist .next.off{color:var(--ink-4);font-weight:500}
.mlist .now{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;text-align:right}
.mlist .now .t{font-size:24px;font-weight:700;color:var(--ink);line-height:1.1}
.mlist .now .t.dim{color:var(--ink-4)}
.mlist .now .stt{font-size:12.5px;font-weight:600}
.av.xl2{width:52px;height:52px;font-size:18px}
@media (max-width:660px){
  .mlist .m{padding:14px;gap:0 12px;grid-template-columns:auto minmax(0,1fr)}
  .av.xl2{width:42px;height:42px;font-size:15px}
  .mlist .nm{font-size:15px}
  .mlist .role{display:block;margin-left:0;margin-top:1px}
  .mlist .now{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;
    gap:12px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);text-align:left}
  .mlist .now .t{font-size:20px}
}

/* --- 3. 地図：面をはっきり、ピンを整える --- */
.mapwrap{border:1px solid var(--line-2);border-radius:10px;background:var(--side)}
.mapinner{max-height:300px;padding:6px 0}
.pinb{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;
  background:var(--paper);border:1px solid var(--line-2);box-shadow:0 1px 2px rgba(0,0,0,.07);
  font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.2;white-space:nowrap}
.pinb .fl{font-size:15px;line-height:1}
.pinb .cnt{display:grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--ink);color:var(--paper);font-size:11px;font-weight:700}
.pinb:hover{border-color:var(--ink-3);z-index:6}
.pinb[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);z-index:6}
.pinb[aria-pressed="true"] .cnt{background:var(--paper);color:var(--ink)}

/* --- 4. 空き時間：日ごとにまとめる --- */
.slotday{border-bottom:1px solid var(--line-2)}
.slotday:last-child{border-bottom:0}
.slotday .sd-h{display:flex;align-items:baseline;gap:9px;padding:10px 16px;background:var(--side);
  border-bottom:1px solid var(--line)}
.slotday .sd-h b{font-size:14px;font-weight:700;color:var(--ink)}
.slotday .sd-h .dw{font-size:12px;font-weight:700;color:var(--ink-3)}
.slotday .sd-h .dw-0{color:var(--sun)} .slotday .sd-h .dw-6{color:var(--sat)}
.slotday .sd-s{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;
  padding:14px 16px;border-bottom:1px solid var(--line)}
.slotday .sd-s:last-child{border-bottom:0}
.slotday .sd-s:hover{background:var(--side)}
.slotday .tmw{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.slotday .tm{font-size:19px;font-weight:700;color:var(--ink);line-height:1.2}
.slotday .dash{font-size:14px;color:var(--ink-4)}
.slotday .tm2{font-size:15px;font-weight:600;color:var(--ink-2)}
.slotday .zs{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.slotday .z{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
@media (max-width:660px){
  .slotday .sd-s{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:13px 14px}
  .slotday .zs{grid-column:1/2;grid-row:2}
  .slotday .sd-s .btn{grid-column:2;grid-row:1/3}
  .slotday .sd-h{padding:9px 14px}
}

/* --- 5. 設定などのタブ：折り返さず横に流す --- */
.tabs{margin:0 0 22px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs .seg{flex-wrap:nowrap;min-width:max-content}
.tabs .seg button{white-space:nowrap;padding:0 15px;height:34px;font-size:13.5px;font-weight:600}
.seg button{white-space:nowrap}

/* --- 6. 世界時計の右端：語ではなく数で --- */
.clockbar .tail{gap:7px}
.clockbar .tail .lb{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink-4);
  font-family:var(--jp);margin-right:2px}
.clockbar .tail b{font-size:19px;font-weight:700;color:var(--ink);line-height:1}
.clockbar .tail .sl{color:var(--line-3);font-size:15px}
.clockbar .tail .tt{font-size:15px;font-weight:600;color:var(--ink-3)}

/* --- 7. 全体の配置・濃さの微調整 --- */
.calbar{margin-bottom:18px;gap:10px}
.calbar .note{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.content .pad{padding-top:22px}
.empty{font-size:13.5px;color:var(--ink-3);font-weight:500}
.field label{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
.kv dt{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.kv dd{font-size:14px;font-weight:600;color:var(--ink)}

/* v19b */
.pbody{padding:16px}
.block>.pbody+.pbody{padding-top:14px}
.slotday .tmw .hf{font-size:14px;line-height:1;margin-right:3px}
.pinb .tt{display:inline;font-size:12px;font-weight:600;color:var(--ink-3);
  font-family:var(--lat);font-variant-numeric:tabular-nums}
.pinb[aria-pressed="true"] .tt{color:var(--paper);opacity:.85}


/* v19c — スマホの詰まりを解消 */
@media (max-width:660px){
  .clockbar .tail{display:none}
  .block>.row{gap:12px!important}
  .block>.row>.field{width:auto!important;min-width:0!important;flex:1 1 140px!important}
  .block>.row>.field:first-child{flex:1 1 100%!important}
  .block>.row>.btn{flex:1 1 100%;justify-content:center}
  .pickr{min-width:0}
  .tabs{margin-bottom:18px}
}

/* v19d — 稼働帯を読めるように */
.band{padding:12px 0}
.band .who{font-size:14px;font-weight:700}
.band .who .sub{font-size:12px;font-weight:600;color:var(--ink-3)}
.band .track{height:22px;border-radius:4px;background:var(--sunken);border:1px solid var(--line-2)}
.band .fill{background:var(--accent);opacity:.30}
.band.on .fill{opacity:.92}
.band .tick{background:var(--line-2)}
.band .now{width:2px;background:var(--red);top:-4px;bottom:-4px;border-radius:2px;z-index:3}
.bandx .sc span{font-size:11px;font-weight:700;color:var(--ink-4);font-family:var(--lat);letter-spacing:.04em}

.bandov{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:13px;
  border-top:1px solid var(--line)}
.bandov .ol{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
.bandov .ov{font-family:var(--lat);font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;
  color:var(--accent-3);background:var(--accent-2);border-radius:6px;padding:3px 10px}
.bandov .ov.none{font-family:var(--jp);font-size:13px;font-weight:600;color:var(--ink-3);background:var(--sunken)}
.block>.bandov{padding-left:16px;padding-right:16px;padding-bottom:16px;margin-top:0}

/* ============================================================
   v20 — 字体を分ける / 色を効かせる
   見出しは明朝、数字はBarlow、本文はゴシック。
   緑を「操作できるもの」の色として一貫させる。
   ============================================================ */
:root{
  --disp:"Zen Old Mincho","Shippori Mincho","Yu Mincho",serif;
  --accent:#147B5A; --accent-2:#E4F2EB; --accent-3:#0C5038; --accent-ln:#ADD6C3;
  --plum:#A63258; --plum-bg:#FBEBF0;
}
:root[data-ui="dark"]{
  --accent:#4FC08D; --accent-2:#11281F; --accent-3:#7FD8AE; --accent-ln:#2C5443;
  --plum:#F08CAE; --plum-bg:#2B1620;
}

/* --- 見出し：明朝で一段大きく --- */
.ptitle{font-family:var(--disp);font-size:21px;font-weight:700;letter-spacing:.04em}
.sec h2,.block>.sec h2{font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:.06em;
  color:var(--ink);display:inline-flex;align-items:center;gap:9px}
.sec h2::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--accent);flex:none}
.block>.sec{background:var(--paper);border-bottom:1px solid var(--line-2);padding:13px 16px}
.block>.sec .note{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.calbar .title{font-family:var(--disp);font-size:23px;font-weight:700;letter-spacing:.04em}
.dayhead .d{font-family:var(--disp);font-weight:700;letter-spacing:.04em}
.mh h3{font-family:var(--disp);font-size:17px;font-weight:700;letter-spacing:.05em}
.drawer .dh div[style*="font-size:19px"]{font-family:var(--disp);letter-spacing:.04em}

/* --- 操作できるものは緑 --- */
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.pri:hover{background:var(--accent-3);border-color:var(--accent-3)}
.btn.pri .ic{opacity:.95}
:root[data-ui="dark"] .btn.pri{color:#07110D}
:root[data-ui="dark"] .btn.pri .ic.img{filter:none}
.btn.pri .ic.img{filter:invert(1) brightness(2)}
:root[data-ui="dark"] .btn.pri:hover{background:var(--accent-3);border-color:var(--accent-3)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-ui="dark"] .seg button[aria-pressed="true"]{color:#07110D}
.seg button[aria-pressed="true"] .ic.img{filter:invert(1) brightness(2)}
:root[data-ui="dark"] .seg button[aria-pressed="true"] .ic.img{filter:none}
.seg{border-color:var(--line-2)}
.tbnav button[aria-current="true"]{background:var(--accent-2);color:var(--accent-3);font-weight:700;
  box-shadow:inset 0 -2px 0 var(--accent)}
.tbnav button:hover{color:var(--ink)}
.btn:focus-visible,.seg button:focus-visible,.tbnav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a,.lnk{color:var(--accent-3)}

/* --- ステータスは丸バッジで色を持たせる --- */
.stt{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;
  font-size:12.5px;font-weight:700;background:var(--sunken);color:var(--ink-2);line-height:1.5}
.stt .sdot{width:7px;height:7px}
.stt.s-available{background:var(--accent-2);color:var(--accent-3)}
.stt.s-meeting{background:var(--k-meeting-bg);color:var(--k-meeting)}
.stt.s-focus{background:var(--k-focus-bg);color:var(--k-focus)}
.stt.s-trip{background:var(--k-trip-bg);color:var(--k-trip)}
.stt.s-holiday{background:var(--k-holiday-bg);color:var(--k-holiday)}
.stt.s-off{background:var(--sunken);color:var(--ink-3)}
.stt.on{font-size:13.5px;padding:4px 12px 4px 10px}
.mlist .now .stt{font-size:12px}

/* --- 今日：日付まわりを主役に --- */
.hero{background:var(--accent-2);border-color:var(--accent-ln);padding:20px 22px}
.hero .dayhead .d{font-size:36px;color:var(--ink)}
.hero .dayhead .w{font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:.06em;color:var(--accent-3)}
.hero .dayhead .w.dw-0{color:var(--sun)} .hero .dayhead .w.dw-6{color:var(--sat)}
.hero-st{margin-top:10px;font-size:13.5px;color:var(--ink-2);font-weight:600}
.hero-st .hs-sep{background:var(--accent-ln)}
.hero-st .hs-i b{font-family:var(--lat);font-variant-numeric:tabular-nums}
:root[data-ui="dark"] .hero{background:var(--accent-2)}

/* --- 予定の行：種別の色をはっきり --- */
.tl .it::before{width:4px;border-radius:0 3px 3px 0;top:11px;bottom:11px}
.tl .it .tm{font-family:var(--lat);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.tl .it .ti{font-size:15.5px;font-weight:700}
.tl .it.k-meeting .tm{color:var(--k-meeting)} .tl .it.k-sales .tm{color:var(--k-sales)}
.tl .it.k-focus .tm{color:var(--k-focus)} .tl .it.k-shoot .tm{color:var(--k-shoot)}
.tl .it.k-delivery .tm{color:var(--k-delivery)} .tl .it.k-sns .tm{color:var(--k-sns)}
.tl .it.k-trip .tm{color:var(--k-trip)} .tl .it.k-holiday .tm{color:var(--k-holiday)}
.tl .it.k-personal .tm{color:var(--k-personal)}
.tl .it.past .tm{color:var(--ink-4)!important}
.tl .it:hover{background:var(--side)}

/* --- 右レーンの数字 --- */
.today-side .summary b{font-family:var(--lat);font-size:27px;letter-spacing:-.02em}
.today-side .summary span{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink-3)}

/* --- 世界時計 --- */
.clockbar .ck.home{background:var(--accent-2);border-bottom-color:var(--accent)}
.clockbar .ck.home .c{color:var(--accent-3)}
.clockbar .ck .c{font-size:11px;font-weight:700;letter-spacing:.11em}
.clockbar .ck .t{font-size:22px}
.clockbar .tail .lb{color:var(--ink-3)}
.clockbar .tail b{color:var(--accent-3);font-size:20px}

/* --- メンバー一覧：名前を明朝で大きく --- */
.mlist .nm{font-family:var(--disp);font-size:18px;font-weight:700;letter-spacing:.04em}
.mlist .role{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-3)}
.mlist .now .t{font-size:26px;letter-spacing:-.02em}
.mlist .m:hover{background:var(--accent-2)}
.mlist .next b{color:var(--accent-3)}

/* --- 空き時間 --- */
.slotday .sd-h{background:var(--paper);border-bottom:1px solid var(--line-2)}
.slotday .sd-h b{font-family:var(--disp);font-size:16px;letter-spacing:.05em}
.slotday .tm{color:var(--accent-3);font-size:20px}
.slotday .sd-s:hover{background:var(--accent-2)}

/* --- 表 --- */
table.t thead th{font-family:var(--jp);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-3)}
table.t tbody tr:hover{background:var(--side)}

/* --- 招待コード・強調値 --- */
.code{font-family:var(--lat);color:var(--accent-3)}

@media (max-width:980px){
  .ptitle{font-size:19px}
  .hero .dayhead .d{font-size:31px}
  .mlist .nm{font-size:16.5px}
}

/* v20b — アバターに色 */
.av{font-weight:700;letter-spacing:.03em}
.av.h-a{background:#1F6F52;color:#fff}
.av.h-b{background:#2B5FA8;color:#fff}
.av.h-c{background:#A63258;color:#fff}
.av.h-d{background:#B06414;color:#fff}
.av.h-e{background:#5B4AA8;color:#fff}
.av.h-f{background:#0E7272;color:#fff}
:root[data-ui="dark"] .av.h-a{background:#2E8A68}
:root[data-ui="dark"] .av.h-b{background:#3C76C4}
:root[data-ui="dark"] .av.h-c{background:#C24A72}
:root[data-ui="dark"] .av.h-d{background:#C87A28}
:root[data-ui="dark"] .av.h-e{background:#7161C4}
:root[data-ui="dark"] .av.h-f{background:#1A8C8C}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}

/* v20c */
.slotday .sd-s .btn{color:var(--accent-3);border-color:var(--accent-ln);font-weight:700;background:var(--paper)}
.slotday .sd-s .btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-ui="dark"] .slotday .sd-s .btn:hover{color:#07110D}
.pickr button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-2);color:var(--accent-3);font-weight:700}

/* ============================================================
   v21 — KOYOMI ロゴ
   ============================================================ */
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);
  line-height:1;user-select:none;flex:none}
.brand .bmark{width:40px;height:21.7px;display:block;color:var(--accent)}
.brand .bname{font-family:var(--disp);font-size:9.5px;font-weight:700;letter-spacing:.34em;
  text-indent:.34em;color:var(--ink);white-space:nowrap}

/* 上部バー：中央に置く（十分な幅があるときだけ絶対中央） */
.topbar{position:relative}
.topbar .brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
@media (max-width:1199px){
  .topbar .brand{position:static;transform:none;margin-left:4px}
}
@media (max-width:979px){
  .topbar .brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0}
  .ptitle{font-size:16px}
}
@media (max-width:420px){
  .ptitle{display:none}
}

/* ログイン画面 */
.authhead{flex-direction:column;align-items:center;gap:14px;text-align:center}
.brand.big .bmark{width:86px;height:46.6px}
.brand.big .bname{font-size:19px;letter-spacing:.38em;text-indent:.38em}
.brand.big{gap:9px}
.authtag{margin:0;font-size:13px;color:var(--ink-3);font-weight:500;line-height:1.7}
.authfoot .bname{display:none}

/* v21b — 上部バーの間合い */
.tbnav{gap:0}
.tbnav button{padding:8px 11px;font-size:13.5px}
.topbar{gap:12px}
@media (min-width:980px) and (max-width:1099px){
  .topbar .brand{position:static;transform:none;margin-left:2px}
}
@media (max-width:979px){
  .topbar .brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0}
}

/* ============================================================
   v22 — 濃く・太く・緑で囲う
   線は1.5px、見出しは明朝、パネルの頭は緑。
   ============================================================ */
:root{
  --ink:#08090B; --ink-2:#272B31; --ink-3:#4E545D; --ink-4:#7D848E;
  --line:#DBD8D2; --line-2:#B9B5AC; --line-3:#8F8B82;
  --accent:#12704F; --accent-2:#E2F0E9; --accent-3:#0A4632; --accent-ln:#9FCEB8;
  --gline:#C4DECF;
}
:root[data-ui="dark"]{
  --ink:#F7F7F5; --ink-2:#D2D6DC; --ink-3:#A0A6AE; --ink-4:#767C85;
  --line:#33363D; --line-2:#494D56; --line-3:#636872;
  --accent:#54C795; --accent-2:#122B21; --accent-3:#8BE0B8; --accent-ln:#2F5C49;
  --gline:#2C5644;
}
body{font-size:15px;font-weight:500;line-height:1.72;color:var(--ink-2)}
.muted{color:var(--ink-3);font-weight:500}

/* --- ボタン：存在感を出す --- */
.btn{height:37px;padding:0 15px;font-size:14.5px;font-weight:700;color:var(--ink);
  border:1.5px solid var(--line-2);border-radius:9px;background:var(--paper)}
.btn .ic{width:17px;height:17px;opacity:.75}
.btn:hover{background:var(--accent-2);border-color:var(--accent);color:var(--accent-3)}
.btn:hover .ic{opacity:1}
.btn:active{transform:translateY(1px)}
.btn.sm{height:32px;padding:0 12px;font-size:13.5px}
.btn.sm .ic{width:16px;height:16px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(10,70,50,.25)}
.btn.pri:hover{background:var(--accent-3);border-color:var(--accent-3);color:#fff}
:root[data-ui="dark"] .btn.pri,:root[data-ui="dark"] .btn.pri:hover{color:#05120D}
.btn.q{border-color:transparent;background:transparent;color:var(--ink-2);font-weight:600}
.btn.q:hover{background:var(--accent-2);color:var(--accent-3);border-color:transparent}
.btn.ico{width:37px;padding:0}.btn.ico.sm{width:32px}
.btn.big{height:48px;font-size:15.5px}
.btn.danger{color:#A5321F;border-color:#D8B4AA}
.btn.danger:hover{background:#FBEDE9;border-color:#A5321F;color:#8B2817}

/* --- セグメント：もっと大きく --- */
.seg{border:1.5px solid var(--line-2);border-radius:9px}
.seg button{height:35px;padding:0 15px;font-size:14px;font-weight:700;color:var(--ink-2);
  border-right:1.5px solid var(--line-2)}
.seg button:hover{background:var(--accent-2);color:var(--accent-3)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-ui="dark"] .seg button[aria-pressed="true"]{color:#05120D}
.seg button .ic{width:16px;height:16px;opacity:.7}
.tabs .seg button{height:38px;padding:0 17px;font-size:14px}

/* --- 入力 --- */
input[type=text],input[type=email],input[type=password],input[type=time],input[type=date],select,textarea{
  border:1.5px solid var(--line-2);border-radius:9px;font-size:14.5px;font-weight:600;color:var(--ink);
  min-height:40px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:2px solid var(--accent-2)}
.field label{font-size:12.5px;font-weight:700;color:var(--ink-2);letter-spacing:.03em;margin-bottom:5px}

/* --- パネル：頭を緑に --- */
.block{border:1.5px solid var(--gline);border-radius:12px;margin-bottom:24px}
.block>.sec{background:var(--accent-2);border-bottom:1.5px solid var(--gline);padding:13px 18px}
.block>.sec h2{font-size:17px;color:var(--accent-3)}
.sec h2::before{width:4px;height:17px;background:var(--accent)}
.block>.sec .note{font-size:13px;font-weight:600;color:var(--accent-3);opacity:.75}
.block>.pbody,.block>.row,.block>.kv{padding:18px}
.block>.tl .it,.block>.pl .p,.block>.mlist .m{border-bottom-color:var(--line)}
.tscroll{border:1.5px solid var(--gline);border-radius:12px}
table.t thead th{background:var(--accent-2);border-bottom:1.5px solid var(--gline);
  font-size:12px;font-weight:700;letter-spacing:.09em;color:var(--accent-3)}
table.t td{font-size:14.5px;font-weight:600;color:var(--ink-2)}
.mlist{border:1.5px solid var(--gline)}
.mapwrap{border:1.5px solid var(--gline)}
.hero{border:1.5px solid var(--gline)}

/* --- 上部：ページ名を主役に --- */
.ptitle{display:flex;flex-direction:column;gap:0;line-height:1;min-width:86px}
.ptitle .en{font-family:var(--lat);font-size:9.5px;font-weight:700;letter-spacing:.18em;
  color:var(--accent);text-transform:uppercase}
.ptitle h1{font-family:var(--disp);font-size:21px;font-weight:700;letter-spacing:.05em;
  color:var(--ink);margin:2px 0 0;white-space:nowrap}
.topbar{height:64px;border-bottom:1.5px solid var(--line-2)}
.tbnav button{font-size:14px;font-weight:700;color:var(--ink-3)}
.tbnav button:hover{background:var(--accent-2);color:var(--accent-3)}
.tbnav button[aria-current="true"]{background:var(--accent-2);color:var(--accent-3);
  box-shadow:inset 0 -3px 0 var(--accent)}
.ibtn{width:39px;height:39px;border:1.5px solid transparent}
.ibtn:hover{background:var(--accent-2);border-color:var(--gline);color:var(--accent-3)}

/* --- 世界時計：枠を強く --- */
.clockbar{border-bottom:1.5px solid var(--line-2)}
.clockbar .ck{border-right:1.5px solid var(--line)}
.clockbar .ck.home{background:var(--accent-2);border-bottom:3px solid var(--accent)}

/* --- カレンダー：押せることを見せる --- */
.mgrid{border:1.5px solid var(--line-2);border-radius:12px;overflow:hidden}
.mgrid .hd>div{font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--sunken);
  padding:9px 0;border-bottom:1.5px solid var(--line-2)}
.mgrid .cell{position:relative;cursor:pointer;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.mgrid .cell:hover{background:var(--accent-2);box-shadow:inset 0 0 0 2px var(--accent-ln)}
.mgrid .cell>.n{display:inline-grid;place-items:center;min-width:25px;height:25px;padding:0 5px;
  border-radius:7px;font-family:var(--lat);font-size:14.5px;font-weight:700;color:var(--ink);background:none}
.mgrid .cell>.n:hover{background:var(--ink);color:var(--paper)}
.mgrid .cell.today>.n{background:var(--accent);color:#fff}
:root[data-ui="dark"] .mgrid .cell.today>.n{color:#05120D}
.mgrid .cell .addhint{position:absolute;right:7px;top:6px;font-family:var(--lat);font-size:17px;
  font-weight:700;color:var(--accent);opacity:0;transition:opacity .12s}
.mgrid .cell:hover .addhint{opacity:1}
.mgrid .cell .ev{border-radius:5px;font-weight:700}
.mgrid .cell .ev .n{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.mgrid .cell .more-ev .n{color:var(--ink-3);font-weight:600;font-size:12px}

/* 休暇の日は黒く塗る */
.mgrid .cell.hol{background:#141618;border-right-color:#2B2E33;border-bottom-color:#2B2E33}
.mgrid .cell.hol:hover{background:#1C1F23;box-shadow:inset 0 0 0 2px #3A3E45;cursor:default}
.mgrid .cell.hol>.n{color:#F2F2F0}
.mgrid .cell.hol>.n:hover{background:#F2F2F0;color:#141618}
.mgrid .cell.hol.today>.n{background:var(--accent);color:#fff}
.mgrid .cell.hol .addhint{display:none}
.mgrid .cell.hol .ev .n{color:#D6D8DA}
.mgrid .cell .holchip{background:#17191C;border-left:3px solid #5C6169;border-radius:0 5px 5px 0}
.mgrid .cell .holchip .n{color:#fff;font-weight:700;letter-spacing:.03em}
.mgrid .cell .holchip .kimg,.mgrid .cell .holchip .kicon{filter:invert(1) brightness(2)}
.mgrid .cell.hol .holchip{background:rgba(255,255,255,.14);border-left-color:#C9CDD2}
.mgrid .cell.out .holchip{opacity:.55}
.mgrid .cell.hol .evdots{filter:invert(1) brightness(2)}

/* 日/週：休暇の列 */
.wgrid .col.holcol{background:#141618}
.wgrid .col.holcol .h{border-color:#2B2E33;background:transparent;cursor:default}
.holmask{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.holmask span{font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:.3em;
  color:#fff;opacity:.55;writing-mode:vertical-rl}
.wgrid .col .h[data-newslot]{cursor:pointer}
.wgrid .col .h[data-newslot]:hover{background:var(--accent-2);box-shadow:inset 0 0 0 1.5px var(--accent-ln)}

/* 種別の凡例：色つきチップに */
.legend-kinds{gap:7px;margin:0 0 16px;font-size:12.5px}
.legend-kinds .lk{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 8px;
  border-radius:999px;font-weight:700;font-size:12.5px;border:1.5px solid transparent}
.legend-kinds .kimg,.legend-kinds .kicon{width:15px;height:15px;opacity:1}
.lk.k-meeting{background:var(--k-meeting-bg);color:var(--k-meeting);border-color:var(--k-meeting-ln)}
.lk.k-sales{background:var(--k-sales-bg);color:var(--k-sales);border-color:var(--k-sales-ln)}
.lk.k-focus{background:var(--k-focus-bg);color:var(--k-focus);border-color:var(--k-focus-ln)}
.lk.k-shoot{background:var(--k-shoot-bg);color:var(--k-shoot);border-color:var(--k-shoot-ln)}
.lk.k-delivery{background:var(--k-delivery-bg);color:var(--k-delivery);border-color:var(--k-delivery-ln)}
.lk.k-sns{background:var(--k-sns-bg);color:var(--k-sns);border-color:var(--k-sns-ln)}
.lk.k-trip{background:var(--k-trip-bg);color:var(--k-trip);border-color:var(--k-trip-ln)}
.lk.k-holiday{background:#17191C;color:#fff;border-color:#33373D}
.lk.k-personal{background:var(--k-personal-bg);color:var(--k-personal);border-color:var(--k-personal-ln)}
.lk.k-holiday .kimg,.lk.k-holiday .kicon{filter:invert(1) brightness(2)}

/* --- 時差の確認：読める形に --- */
.tzlist{border:1.5px solid var(--gline);border-radius:12px;overflow:hidden;background:var(--paper)}
.tzr{display:grid;grid-template-columns:28px minmax(88px,auto) minmax(0,1fr) auto auto;
  align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.tzr:last-child{border-bottom:0}
.tzr.self{background:var(--accent-2)}
.tzr .fl{font-size:21px;line-height:1}
.tzr .cy{display:flex;flex-direction:column;line-height:1.25}
.tzr .cy b{font-family:var(--lat);font-size:14px;font-weight:700;letter-spacing:.05em;color:var(--ink)}
.tzr .cy small{font-size:11.5px;font-weight:600;color:var(--ink-3)}
.tzr .who{display:flex;gap:12px;flex-wrap:wrap;min-width:0}
.tzr .who .w{display:inline-flex;align-items:center;gap:6px;min-width:0}
.tzr .who .w em{font-style:normal;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tzr .who .none{color:var(--ink-4);font-size:13px}
.tzr .tt{display:inline-flex;align-items:baseline;gap:4px;font-family:var(--lat);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tzr .tt b{font-size:21px;font-weight:700;color:var(--ink)}
.tzr .tt i{font-style:normal;color:var(--ink-4)}
.tzr .tt span{font-size:15px;font-weight:600;color:var(--ink-2)}
.tzr .tt .nd{font-style:normal;margin-left:6px;font-family:var(--jp);font-size:11px;font-weight:700;
  padding:2px 7px;border-radius:999px;background:var(--k-trip-bg);color:var(--k-trip)}
.tzr .wb{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:#FBECE7;color:#A5321F;white-space:nowrap}
.tzr .wb.ok{background:var(--accent-2);color:var(--accent-3)}
.tzr .wb.nt{background:var(--k-personal-bg);color:var(--k-personal)}
:root[data-ui="dark"] .tzr .wb{background:#3A211B;color:#F0A08C}
@media (max-width:660px){
  .tzr{grid-template-columns:26px minmax(0,1fr) auto;gap:8px 10px}
  .tzr .who{grid-column:2/4;order:3}
  .tzr .flag{grid-column:2/4;order:4}
}

/* --- 補足の一行 --- */
.note-line{font-size:13px;font-weight:600;color:var(--accent-3);background:var(--accent-2);
  border:1.5px solid var(--gline);border-radius:9px;padding:10px 14px;margin-bottom:4px}
.note-line b{font-weight:700}

/* --- 文字の濃さ全般 --- */
.tl .it .mt,.mlist .meta,.pl .sub{color:var(--ink-3);font-weight:600}
.empty{font-size:14px;font-weight:600;color:var(--ink-3)}
.kv dt{font-size:13px;font-weight:700;color:var(--ink-3)}
.kv dd{font-size:15px;font-weight:700;color:var(--ink)}
.calbar .title{font-size:25px}
.mgrid .cell .evdots .kimg,.mgrid .cell .evdots .kicon{width:16px;height:16px}

@media (max-width:980px){
  .topbar{height:60px}
  .ptitle h1{font-size:18px}
  .ptitle .en{font-size:9px}
  .btn{height:35px}
}
@media (max-width:420px){
  .ptitle{display:none}
}

/* v22b */
:root{--accent-4:#F2F8F5}
:root[data-ui="dark"]{--accent-4:#0E1A15}
.col.today{background:var(--accent-4)}
.wgrid .whd .c.today{background:var(--accent-2);box-shadow:inset 0 -3px 0 var(--accent);border-radius:8px 8px 0 0}
.wgrid .whd .c.today .dw,.wgrid .whd .c.today .dn{color:var(--accent-3);font-weight:700}
.wgrid{border:1.5px solid var(--line-2);border-radius:12px;overflow:hidden}
.wgrid .whd{border-bottom:1.5px solid var(--line-2);background:var(--sunken)}
.wgrid .whd .c{font-size:13px}
.wgrid .whd .c .dn{font-family:var(--lat);font-size:17px;font-weight:700}
.wgrid .gut .h{font-family:var(--lat);font-size:11.5px;font-weight:600;color:var(--ink-4)}
.evb{border-radius:6px;border-left-width:3.5px}
.evb .n{font-size:13px;font-weight:700}
.evb .t{font-family:var(--lat);font-size:11.5px;font-weight:700}
input:disabled,select:disabled{background:var(--sunken);color:var(--ink-4);border-style:dashed;cursor:not-allowed}

/* v22c — 設定の読みやすさ */
.swlist{display:flex;flex-direction:column;gap:2px}
.sw{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:flex-start;
  padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--paper)}
.sw+.sw{margin-top:8px}
.sw:hover{border-color:var(--accent-ln);background:var(--accent-2)}
.sw input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.sw b{display:block;font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.5}
.sw small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-3);line-height:1.65;margin-top:2px}
.mlist .meta .hid{color:var(--ink-4);font-weight:600;font-style:normal}
.tabs .seg{border-color:var(--line-2)}
.block>.pbody .field+.field{margin-top:0}
.grid2{gap:16px}

/* v22d */
.block .seg{align-self:flex-start;width:max-content}
.block>div[style*="flex-direction:column"]{padding:18px}
.block>div[style*="flex-direction:column"]>.muted{margin-top:-6px}
.authcard{border:1.5px solid var(--line-2);border-radius:16px}
.modal{border:1.5px solid var(--line-2);border-radius:14px}
.mh{border-bottom:1.5px solid var(--line-2)}
.mf{border-top:1.5px solid var(--line-2)}
.drawer{border-left:1.5px solid var(--line-2)}
.scrim{backdrop-filter:blur(2px)}
.pickr button{border:1.5px solid var(--line-2);border-radius:999px;font-weight:600;padding:5px 13px 5px 6px}
.pickr button:hover{border-color:var(--accent);background:var(--accent-2)}
.toast{font-size:14px;font-weight:700;border-radius:10px;padding:12px 18px}

/* v22e */
@media (max-width:660px){
  .legend-kinds{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:3px;margin-bottom:12px}
  .legend-kinds::-webkit-scrollbar{display:none}
  .legend-kinds .lk{flex:none}
}

/* ============================================================
   v23 — 緑を引く / 書体を替える / 今日を主役に / 休暇を読めるように
   ============================================================ */
/* 書体：本文 IBM Plex Sans JP、数字 IBM Plex Mono、見出し Zen Old Mincho */
body{font-family:var(--jp);font-size:14.5px;font-weight:450;letter-spacing:.01em;line-height:1.75}
b,strong{font-weight:600}
.ptitle h1,.sec h2,.block>.sec h2,.calbar .title,.dayhead .d,.mh h3,.mlist .nm,
.slotday .sd-h b,.hero .dayhead .w{font-family:var(--disp)}

/* --- 緑を戻す：パネルの頭はニュートラルに --- */
.block{border:1.5px solid var(--line-2)}
.block>.sec{background:var(--sunken);border-bottom:1.5px solid var(--line-2)}
.block>.sec h2{color:var(--ink);font-size:16.5px;letter-spacing:.07em}
.block>.sec .note{color:var(--ink-3);opacity:1;font-weight:500}
.sec h2::before{width:3px;height:16px;background:var(--ink-3)}
.block>.sec h2::before{background:var(--accent)}
.tscroll{border-color:var(--line-2)}
table.t thead th{background:var(--sunken);border-bottom:1.5px solid var(--line-2);color:var(--ink-3)}
.mlist,.mapwrap,.tzlist{border-color:var(--line-2)}
.tzr.self{background:var(--sunken)}
.tzr.self .cy b{color:var(--accent-3)}
.mlist .m:hover{background:var(--sunken)}
.slotday .sd-s:hover{background:var(--sunken)}
.tbnav button[aria-current="true"]{background:transparent;color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.tbnav button:hover{background:var(--sunken);color:var(--ink)}
.ibtn:hover{background:var(--sunken);border-color:var(--line);color:var(--ink)}
.btn:hover{background:var(--sunken);border-color:var(--line-3);color:var(--ink)}
.seg button:hover{background:var(--sunken);color:var(--ink)}
.sw:hover{border-color:var(--line-2);background:var(--sunken)}
.mgrid .cell:hover{background:var(--sunken);box-shadow:inset 0 0 0 2px var(--line-2)}
.wgrid .col .h[data-newslot]:hover{background:var(--sunken);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.clockbar .ck.home{background:var(--paper)}
.clockbar .ck.home .c{color:var(--ink-2)}
.bandov .ov{background:var(--sunken);color:var(--ink);border:1.5px solid var(--line-2)}
.note-line{background:var(--sunken);border-color:var(--line-2);color:var(--ink-2)}

/* --- 今日：主役の面 --- */
.hero{position:relative;overflow:hidden;background:var(--side);border:1.5px solid var(--line-2);
  border-radius:14px;padding:24px 26px}
.hero::after{content:attr(data-flag);position:absolute;right:-70px;top:50%;transform:translateY(-50%);
  font-size:340px;line-height:1;opacity:.42;pointer-events:none;filter:blur(30px) saturate(1.15);
  -webkit-mask-image:radial-gradient(130% 130% at 100% 50%,#000 22%,rgba(0,0,0,.35) 60%,transparent 88%);
  mask-image:radial-gradient(130% 130% at 100% 50%,#000 22%,rgba(0,0,0,.35) 60%,transparent 88%)}
.hero::before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(100deg,var(--side) 30%,rgba(255,255,255,.2) 58%,rgba(255,255,255,0) 100%);
  pointer-events:none}
:root[data-ui="dark"] .hero::before{background:linear-gradient(100deg,var(--side) 34%,rgba(21,22,26,.4) 62%,rgba(0,0,0,0) 100%)}
:root[data-ui="dark"] .hero::after{opacity:.2}
.hero .hero-l,.hero .hero-r{position:relative;z-index:2}
.hero-top{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.hero-top .yr{font-family:var(--lat);font-size:12px;font-weight:600;letter-spacing:.22em;color:var(--ink-3)}
.hero-top .cyn .cty .cn{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.hero-top .cyn .fl{font-size:15px}
.hero .hero-r{align-self:flex-start}
.hero .dayhead{align-items:baseline;gap:16px}
.hero .dayhead .d{font-size:46px;font-weight:700;letter-spacing:.02em;color:var(--ink);line-height:1.05}
.hero .dayhead .d i{font-style:normal;font-size:24px;margin:0 2px 0 1px;font-weight:600}
.hero .dayhead .w{font-size:17px;font-weight:700;letter-spacing:.1em;color:var(--ink-2)}
.hero-st{margin-top:12px}

/* --- 休暇：黒をやめて、斜線＋濃いグレー --- */
.mgrid .cell.hol{
  background:repeating-linear-gradient(135deg,var(--sunken) 0 9px,var(--raise) 9px 18px);
  border-right-color:var(--line-2);border-bottom-color:var(--line-2)}
.mgrid .cell.hol:hover{box-shadow:inset 0 0 0 2px var(--line-3);
  background:repeating-linear-gradient(135deg,var(--raise) 0 9px,var(--sunken) 9px 18px);cursor:pointer}
.mgrid .cell.hol>.n{color:var(--ink-3)}
.mgrid .cell.hol>.n:hover{background:var(--ink);color:var(--paper)}
.mgrid .cell.hol .addhint{display:none}
.mgrid .cell.hol .ev .n{color:var(--ink-2)}
.mgrid .cell.hol .evdots{filter:none}
.mgrid .cell .holchip{background:var(--ink);border-left:3px solid var(--ink-3);border-radius:0 5px 5px 0}
.mgrid .cell .holchip .n{color:var(--paper);font-weight:600;letter-spacing:.02em}
.mgrid .cell .holchip .kimg,.mgrid .cell .holchip .kicon{filter:invert(1) brightness(2)}
:root[data-ui="dark"] .mgrid .cell .holchip .kimg,:root[data-ui="dark"] .mgrid .cell .holchip .kicon{filter:none}
.mgrid .cell.hol .holchip{background:var(--ink);border-left-color:var(--ink-4)}
.wgrid .col.holcol{background:repeating-linear-gradient(135deg,var(--sunken) 0 10px,var(--raise) 10px 20px)}
.wgrid .col.holcol .h{border-color:var(--line)}
.holmask span{color:var(--ink-3);opacity:.8}
.lk.k-holiday{background:var(--ink);color:var(--paper);border-color:var(--ink)}
:root[data-ui="dark"] .lk.k-holiday .kimg,:root[data-ui="dark"] .lk.k-holiday .kicon{filter:none}

/* --- 1日パネル --- */
.dpbar{margin-bottom:18px}
.dpbar .btn.pri{height:44px;width:100%;font-size:15px;border-radius:11px}
.dphol{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;
  border:1.5px solid var(--line-2);border-radius:11px;
  background:repeating-linear-gradient(135deg,var(--sunken) 0 10px,var(--raise) 10px 20px)}
.dphol .hb{font-size:11.5px;font-weight:700;letter-spacing:.14em;padding:3px 10px;border-radius:999px;
  background:var(--ink);color:var(--paper)}
.dphol b{font-size:15px;font-weight:600;color:var(--ink)}
.dpothers{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 16px}
.dpothers .ohol{font-size:12.5px;font-weight:600;color:var(--ink-3);background:var(--sunken);
  border:1px solid var(--line-2);border-radius:999px;padding:3px 11px}
.dplist{border:1.5px solid var(--line-2);border-radius:12px;overflow:hidden}
.dpi{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:stretch;
  border-bottom:1px solid var(--line);position:relative}
.dpi:last-child{border-bottom:0}
.dpi:hover{background:var(--sunken)}
.dpi .main{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:14px;
  text-align:left;padding:14px 4px 14px 16px;width:100%;background:none;border-left:4px solid var(--c-off)}
.dpi.k-meeting .main{border-left-color:var(--k-meeting)} .dpi.k-sales .main{border-left-color:var(--k-sales)}
.dpi.k-focus .main{border-left-color:var(--k-focus)} .dpi.k-shoot .main{border-left-color:var(--k-shoot)}
.dpi.k-delivery .main{border-left-color:var(--k-delivery)} .dpi.k-sns .main{border-left-color:var(--k-sns)}
.dpi.k-trip .main{border-left-color:var(--k-trip)} .dpi.k-personal .main{border-left-color:var(--k-personal)}
.dpi .tm{display:flex;flex-direction:column;font-family:var(--lat);font-variant-numeric:tabular-nums;line-height:1.2}
.dpi .tm{font-size:17px;font-weight:600;color:var(--ink)}
.dpi .tm i{font-style:normal;font-size:12px;font-weight:500;color:var(--ink-4)}
.dpi .bd{min-width:0}
.dpi .ti{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dpi .mt{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.dpi .ppl{display:flex;gap:-4px}
.dpi .ppl .av{margin-left:-7px;box-shadow:0 0 0 2px var(--paper)}
.dpi .ed{align-self:center;margin-right:10px;width:34px;padding:0;justify-content:center}
.dpi .ed .ic{margin:0}
@media (max-width:660px){
  .dpi .main{grid-template-columns:54px minmax(0,1fr);gap:10px;padding-left:12px}
  .dpi .ppl{display:none}
  .hero .dayhead .d{font-size:36px}
  .hero::after{font-size:170px;bottom:-52px}
}

/* v23b */
.tzr .who{overflow:hidden;flex-wrap:nowrap}
.tzr .who .w{min-width:0}
.tzr .who .w em{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tzr .tt{flex:none}

/* v23c — 休暇チップの文字 */
.mgrid .cell .ev.holchip .n,.mgrid .cell.hol .ev.holchip .n{color:var(--paper);font-weight:600}
:root[data-ui="dark"] .mgrid .cell .ev.holchip .n{color:var(--ink)}
.mgrid .cell .ev.holchip{background:var(--ink)}

/* ============================================================
   v24 — 今日を「書類」にする
   ・箱をやめて、見出し＋罫線で区切る
   ・予定の行から色を抜く（色は種別アイコンだけ）
   ・本文は端末の標準書体（Hiragino / SF）
   ============================================================ */
body{font-family:var(--jp);font-size:14.5px;font-weight:400;letter-spacing:.005em;line-height:1.75}
b,strong{font-weight:600}
.btn,.seg button,.tbnav button{font-weight:600}

/* --- 枠をやめた区画 --- */
.block.plain{border:0;border-radius:0;background:none;overflow:visible;margin-bottom:34px}
.block.plain>.sec{background:none;border:0;border-bottom:2px solid var(--ink);
  padding:0 0 7px;margin:0 0 2px;align-items:baseline}
.block.plain>.sec h2{font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:.12em;color:var(--ink)}
.block.plain>.sec h2::before{display:none}
.block.plain>.sec .note{font-family:var(--lat);font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.04em}
.block.plain>.sec .btn.q{margin-right:-8px}
.block.plain>.tl{border:0}
.block.plain>.tl .it{padding-left:0;padding-right:0;border-bottom:1px solid var(--line)}
.block.plain>.tl .it:last-of-type{border-bottom:1px solid var(--line)}
.block.plain>.tl .end{padding-left:0;padding-right:0;background:none;border-top:0}
.block.plain>.tl .empty{padding:34px 0}
.block.plain>.daylog,.block.plain>.pbody{padding:16px 0 0}
.block.plain>.pl{padding:0}
.block.plain>.pl .p{padding-left:0;padding-right:0;border-bottom:1px solid var(--line)}
.block.plain>.pl .p:last-child{border-bottom:1px solid var(--line)}

/* --- 今日の予定：色を抜いて時刻で読ませる --- */
.today .tl .it{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:16px;
  padding-top:15px;padding-bottom:15px;align-items:baseline;position:relative}
.today .tl .it::before{display:none}
.today .tl .it .tm{font-family:var(--lat);font-variant-numeric:tabular-nums;font-size:17px;
  font-weight:600;color:var(--ink);letter-spacing:0}
.today .tl .it .ti{font-size:15.5px;font-weight:600;color:var(--ink);letter-spacing:.01em}
.today .tl .it .ti .kimg,.today .tl .it .ti .kicon{width:15px;height:15px;opacity:.7;margin-right:2px}
.today .tl .it .mt{font-size:12.5px;color:var(--ink-3);font-weight:400;margin-top:3px;display:block}
.today .tl .it .rt{font-family:var(--lat);font-size:12px;font-weight:500;color:var(--ink-4);letter-spacing:.02em}
.today .tl .it:hover{background:var(--sunken)}
.today .tl .it.past .tm,.today .tl .it.past .ti{color:var(--ink-4);font-weight:500}
.today .tl .it.live{background:var(--sunken)}
.today .tl .it.live::before{display:block;content:"";left:-14px;top:14px;bottom:14px;width:3px;
  border-radius:2px;background:var(--accent)}
.today .tl .it.live .rt{color:var(--accent-3);font-weight:700}
.today .tl .end{display:grid;grid-template-columns:66px minmax(0,1fr);gap:16px;padding-top:14px;
  font-size:13px;color:var(--ink-4)}
.today .tl .end span:first-child{font-family:var(--lat);font-variant-numeric:tabular-nums}

/* --- 右レーン：数字を横に並べる --- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0;padding:16px 0 0;
  border-bottom:1px solid var(--line);padding-bottom:16px}
.stats>div{display:flex;flex-direction:column;gap:2px}
.stats dt{font-size:11.5px;font-weight:500;color:var(--ink-3);letter-spacing:.04em;order:2}
.stats dd{margin:0;font-family:var(--lat);font-size:26px;font-weight:600;color:var(--ink);
  line-height:1.05;letter-spacing:-.02em;order:1}
.stats dd i{font-style:normal;font-size:13px;font-weight:500;color:var(--ink-4);margin-left:1px}

/* --- 右レーン：メンバー行 --- */
.today .pl .p{grid-template-columns:36px minmax(0,1fr) auto;gap:12px;padding-top:13px;padding-bottom:13px}
.today .pl .av.l2{width:36px;height:36px;font-size:13px}
.today .pl .nm{font-size:14px;font-weight:600;color:var(--ink)}
.today .pl .sub{font-size:12px;color:var(--ink-3)}
.today .pl .rt .t{font-family:var(--lat);font-size:16px;font-weight:600}
.today .pl .rt .st{background:none;padding:0;font-size:11.5px;font-weight:500;color:var(--ink-3)}
.today .pl .rt .st .sdot{width:6px;height:6px}

/* --- 記録 --- */
.today .daylog textarea{border:1.5px solid var(--line-2);border-radius:4px;background:var(--paper)}

/* --- 国旗を濃く --- */
.hero{border:0;border-top:2px solid var(--ink);border-radius:0;background:none;padding:18px 0 22px}
.hero::before{display:none}
.hero::after{right:-18px;font-size:350px;opacity:.24;filter:saturate(1.1);
  -webkit-mask-image:linear-gradient(95deg,transparent 0%,rgba(0,0,0,.5) 26%,#000 52%);
  mask-image:linear-gradient(95deg,transparent 0%,rgba(0,0,0,.5) 26%,#000 52%)}
:root[data-ui="dark"] .hero::after{opacity:.34}
.hero-top .yr{font-size:11.5px;letter-spacing:.24em}
.hero .dayhead .d{font-size:44px}
.hero .dayhead .w{font-size:16px;letter-spacing:.12em}
.hero-st{margin-top:11px;font-size:13px;color:var(--ink-2);font-weight:400}
.hero-st .stt{background:none;padding:0;font-size:13.5px;font-weight:600}
.hero-st .hs-sep{background:var(--line-2)}
.hero-st .hs-i b{font-family:var(--lat);font-weight:600}

/* --- 角の丸みを控えめに（書類らしく） --- */
.btn,.seg,.seg button,input[type=text],input[type=email],input[type=password],
input[type=time],input[type=date],input[type=number],select,textarea{border-radius:5px}
.block{border-radius:6px}
.block>.sec{border-radius:0}
.mlist,.tscroll,.mapwrap,.tzlist,.dplist,.mgrid,.wgrid,.dphol,.sw{border-radius:6px}
.modal,.authcard{border-radius:8px}
.dpbar .btn.pri{border-radius:5px}
.tabs .seg{border-radius:5px}

@media (max-width:1079px){
  .today-side{border-top:1px solid var(--line);padding-top:8px}
}
@media (max-width:660px){
  .hero{padding:16px 0 20px}
  .hero .dayhead .d{font-size:35px}
  .today .tl .it{grid-template-columns:58px minmax(0,1fr);gap:12px}
  .today .tl .it .rt{grid-column:2;margin-top:2px}
  .stats dd{font-size:23px}
}

/* v24b */
.today .tl .it .ti{display:flex;align-items:center;gap:7px}
.today .tl .it .ti .kimg,.today .tl .it .ti .kicon{margin:0;flex:none}
.hero .hero-r{padding-right:2px;gap:8px}
.hero-st .hs-i{font-weight:500;color:var(--ink-2)}

/* v24c */
.today .tl .it .ti{display:flex!important;align-items:center;gap:8px}
.today .tl .it .ti .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* ============================================================
   v25 — 今日の予定を作り込む / メンバー表を行に / 国旗を見せる
   ============================================================ */
/* --- 今日のタイムライン --- */
.tday{margin-top:2px}
.tday .tt{font-family:var(--lat);font-variant-numeric:tabular-nums;flex:none;width:62px;
  display:flex;flex-direction:column;line-height:1.25}
.tmk{display:flex;align-items:center;gap:16px;padding:10px 0;color:var(--ink-4)}
.tmk .tt{font-size:13px;font-weight:500}
.tmk .lb{font-size:12px;letter-spacing:.08em}
.tgap{display:flex;align-items:center;gap:16px;padding:4px 0}
.tgap .gl{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.tgap .gl::after{content:"";flex:1;border-top:1px dashed var(--line-2)}
.tgap .gt{font-size:12px;color:var(--ink-4);letter-spacing:.02em;order:1}
.tgap .gadd{order:3;width:22px;height:22px;border-radius:4px;border:1px solid var(--line-2);
  background:var(--paper);color:var(--ink-3);font-family:var(--lat);font-size:14px;line-height:1;
  display:grid;place-items:center;flex:none;opacity:.55}
.tgap:hover .gadd{opacity:1;border-color:var(--accent);color:var(--accent-3)}
.tnow{display:flex;align-items:center;gap:10px;padding:7px 0;position:relative}
.tnow::after{content:"";flex:1;border-top:2px solid var(--red)}
.tnow .lb{font-size:11px;font-weight:700;letter-spacing:.1em;color:#fff;background:var(--red);
  padding:2px 8px;border-radius:3px}
.tnow .tv{font-family:var(--lat);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--red)}
.tev{display:flex;gap:16px;padding:13px 0;border-top:1px solid var(--line);align-items:flex-start}
.tev:first-child{border-top:0}
.tev .tt b{font-size:17px;font-weight:600;color:var(--ink);letter-spacing:0}
.tev .tt i{font-style:normal;font-size:12px;font-weight:500;color:var(--ink-4)}
.tev .bd{flex:1;min-width:0;text-align:left;background:none;padding:0;display:block}
.tev .hd{display:flex;align-items:center;gap:8px}
.tev .hd .kimg,.tev .hd .kicon{width:15px;height:15px;opacity:.7;flex:none}
.tev .ti{font-size:15.5px;font-weight:600;color:var(--ink);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tev .du{margin-left:auto;font-family:var(--lat);font-size:12px;font-weight:500;color:var(--ink-4);
  flex:none;padding-left:10px}
.tev .mt{display:block;font-size:12.5px;color:var(--ink-3);margin-top:3px}
.tev .ft{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.tev .av-row{display:flex}
.tev .av-row .av{margin-right:-6px;box-shadow:0 0 0 2px var(--paper)}
.tev .oz{font-family:var(--lat);font-variant-numeric:tabular-nums;font-size:12px;font-weight:500;
  color:var(--ink-3);letter-spacing:.02em}
.tev:hover{background:var(--sunken)}
.tev.past .tt b,.tev.past .ti{color:var(--ink-4);font-weight:500}
.tev.past .av-row{opacity:.6}
.tev.live{background:var(--accent-2)}
.tev.live .du{color:var(--accent-3);font-weight:700}
.tev.live .av-row .av{box-shadow:0 0 0 2px var(--accent-2)}
.thol{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 16px;margin-top:10px;
  border:1.5px solid var(--line-2);border-radius:6px;
  background:repeating-linear-gradient(135deg,var(--sunken) 0 10px,var(--raise) 10px 20px)}
.thol .hb{font-size:11.5px;font-weight:700;letter-spacing:.14em;padding:3px 10px;border-radius:999px;
  background:var(--ink);color:var(--paper)}
.thol b{font-size:15.5px;font-weight:600;color:var(--ink)}

/* --- 設定のメンバー：表をやめて行に --- */
.seatbar{margin-bottom:14px;flex-wrap:wrap;row-gap:10px}
.memlist{border:1.5px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--paper)}
.mrow{display:grid;grid-template-columns:minmax(190px,1fr) minmax(0,1.6fr) auto;gap:16px;
  align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--sunken)}
.mrow .who{display:flex;align-items:center;gap:11px;min-width:0}
.mrow .nm{min-width:0}
.mrow .nm b{display:block;font-size:14.5px;font-weight:600;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .nm small{display:block;font-size:12px;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .facts{display:flex;flex-wrap:wrap;gap:6px 20px;min-width:0}
.mrow .f{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.mrow .f i{font-style:normal;font-size:10.5px;font-weight:500;color:var(--ink-4);letter-spacing:.05em}
.mrow .f b{font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.mrow .f b.tnum{font-family:var(--lat);font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink)}
.mrow .f em{font-style:normal;font-size:11px;color:var(--ink-4);font-family:var(--lat)}
.mrow .ops{display:flex;gap:4px;flex:none}
@media (max-width:900px){
  .mrow{grid-template-columns:minmax(0,1fr) auto;gap:10px 12px}
  .mrow .facts{grid-column:1/-1}
  .mrow .ops{grid-row:1;grid-column:2}
}

/* --- 国旗をちゃんと見せる --- */
.hero{overflow:hidden}
.hero::after{right:14px;top:50%;transform:translateY(-50%);
  font-size:clamp(84px,13vw,132px);opacity:.3;filter:saturate(1.05);
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.65) 34%,#000 62%);
  mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.65) 34%,#000 62%)}
:root[data-ui="dark"] .hero::after{opacity:.42}
@media (max-width:660px){.hero::after{font-size:92px;right:6px}}

/* v25b */
.tgap .gl::after{order:2;margin-left:2px}
.tgap .gt{white-space:nowrap}
.tev.live{background:var(--accent-2)}

/* ============================================================
   v26 — 今日の枠を、その拠点の国旗の色にする
   ============================================================ */
.hero{
  --f1:91,96,104; --f2:155,161,169;
  position:relative;overflow:hidden;
  border:1.5px solid rgba(var(--f1),.30);
  border-top:3px solid rgb(var(--f1));
  border-radius:6px;
  padding:20px 22px;
  background:
    linear-gradient(100deg,
      var(--paper) 0%,
      var(--paper) 38%,
      rgba(var(--f1),.09) 68%,
      rgba(var(--f2),.19) 100%);
}
.hero::before{content:attr(data-flag);display:block;position:absolute;left:82%;top:50%;
  transform:translate(-50%,-50%) scale(3);font-size:180px;line-height:1;
  opacity:.4;filter:blur(40px) saturate(1.45);pointer-events:none;z-index:0}
.hero::after{content:attr(data-flag);position:absolute;right:16px;top:50%;
  transform:translateY(-50%);font-size:clamp(84px,12vw,124px);line-height:1;
  opacity:.34;filter:saturate(1.05);pointer-events:none;z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.6) 32%,#000 60%);
  mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.6) 32%,#000 60%)}
.hero .hero-l,.hero .hero-r{position:relative;z-index:3}
:root[data-ui="dark"] .hero{
  border-color:rgba(var(--f1),.42);
  background:linear-gradient(100deg,var(--paper) 0%,var(--paper) 38%,
    rgba(var(--f1),.16) 68%,rgba(var(--f2),.20) 100%)}
:root[data-ui="dark"] .hero::before{opacity:.38}
:root[data-ui="dark"] .hero::after{opacity:.44}
.hero-top .yr{color:var(--ink-3)}
@media (max-width:660px){
  .hero{padding:16px 16px}
  .hero::after{font-size:86px;right:8px}
  .hero::before{transform:translate(-50%,-50%) scale(2.6)}
}

/* ログイン画面の3つのタブ（後ろの .seg button より後に置いて効かせる） */
.authtabs button{flex:1 1 0;min-width:0;justify-content:center;height:36px;padding:0 8px;white-space:nowrap}
@media (max-width:460px){ .authtabs button{font-size:12px;padding:0 5px;letter-spacing:-.01em} }
@media (max-width:380px){ .authtabs button{font-size:11px;padding:0 4px} }
@media (max-width:340px){ .authtabs button{font-size:10px;padding:0 2px} }

/* 今日の画面：休みの日の大きな表示 */
.restbig{display:flex;align-items:baseline;gap:12px;margin:10px 0 2px;flex-wrap:wrap}
.restbig .rb{font-family:var(--disp);font-size:44px;line-height:1;font-weight:600;letter-spacing:.12em;
  color:var(--accent-3);background:var(--paper);border-radius:12px;padding:8px 18px 10px;
  box-shadow:0 2px 10px rgba(0,0,0,.08)}
.restbig .rt{font-size:13.5px;font-weight:600;color:var(--ink-2)}
:root[data-ui="dark"] .restbig .rb{color:var(--accent);background:rgba(0,0,0,.28)}
@media (max-width:560px){ .restbig .rb{font-size:36px;padding:6px 14px 8px} }
/* 曜日ごとの働きかたエディタ */
.dowset{display:flex;flex-direction:column;gap:11px}
.dowset [hidden]{display:none!important}
.dowdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dowchip{height:44px;border:1.5px solid var(--line-2);border-radius:10px;background:var(--paper);
  font-weight:700;font-size:14.5px;color:var(--ink-3);cursor:pointer;transition:background .12s,color .12s,border-color .12s;
  display:flex;align-items:center;justify-content:center}
.dowchip:hover{background:var(--accent-2);color:var(--accent-3);border-color:var(--accent)}
.dowchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-ui="dark"] .dowchip[aria-pressed="true"]{color:#05120D}
.dowcap{margin:-3px 0 0;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.dowcap b{color:var(--ink-2)}
.dowbase{display:flex;align-items:flex-end;gap:10px}
.dowt{display:flex;flex-direction:column;gap:4px;flex:1 1 0;min-width:0}
.dowt>span{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
.dowar{height:40px;display:flex;align-items:center;color:var(--ink-4);font-size:14px}
.dowset select{width:100%;min-width:0;padding-left:10px}
.dowmore{align-self:flex-start;background:none;border:0;padding:1px 0;cursor:pointer;
  font-size:12.5px;font-weight:700;color:var(--accent-3);text-decoration:underline;text-underline-offset:3px}
.dowmore:hover{opacity:.75}
.dowadv{display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line);padding-top:11px}
.dowrow{display:grid;grid-template-columns:26px 1fr 12px 1fr;align-items:center;gap:9px}
.dowrow .dl{font-size:13.5px;font-weight:700;color:var(--ink-2);text-align:center}
.dowrow .dash{text-align:center;color:var(--ink-4)}
.dowempty{font-size:13px;color:var(--ink-3);font-weight:600}
@media (max-width:430px){
  .dowdays{gap:4px}
  .dowchip{height:40px;font-size:13.5px}
  .dowrow{grid-template-columns:22px 1fr 9px 1fr;gap:6px}
  .dowset select{font-size:13.5px;padding-left:6px}
}

/* 端末の通知の状態 */
.perm{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;
  font-size:12.5px;font-weight:700;background:var(--sunken);color:var(--ink-2)}
.perm::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ink-4)}
.perm.ok{background:var(--accent-2);color:var(--accent-3)}
.perm.ok::before{background:var(--accent)}
.perm.no{background:#FBEEEA;color:#8E3B25}
.perm.no::before{background:#BF5236}
:root[data-ui="dark"] .perm.no{background:#2A1A16;color:#E8A08A}

/* 起動したときのロゴ（アプリの起動画面からそのまま続く） */
#splash{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;
  background:#fff;opacity:1;transition:opacity .6s ease}
#splash.go{opacity:0;pointer-events:none}
#splash .spw{width:126px;color:#12704F;display:flex;flex-direction:column;align-items:center;gap:7px;
  animation:sp-hold 1s ease both}
#splash .spw svg{width:100%;display:block}
#splash .spn{font-family:var(--disp);font-weight:700;font-size:19px;
  letter-spacing:.38em;text-indent:.38em;line-height:1}
#splash .spl{position:absolute;left:0;right:0;bottom:12%;text-align:center;
  font-size:12.5px;font-weight:600;color:var(--ink-3);opacity:0;animation:sp-late .5s ease 2.2s both}
/* iOS の起動画面と同じ絵がそのまま出ていて、最後にすっと息をするだけ */
@keyframes sp-hold{0%{transform:none}70%{transform:none}100%{transform:scale(1.04)}}
@keyframes sp-late{to{opacity:.85}}
@media (prefers-reduced-motion:reduce){#splash .spw{animation:none}}
@media (prefers-color-scheme:dark){#splash{background:#15161A}#splash .spw{color:#54C795}}
/* 起動ロゴだけは iPhone の見た目（明るい／暗い）に合わせる。
   iOS の起動画面は端末の設定で決まるので、そこから切れ目なくつながるようにするため。
   アプリ本体の白黒は、ロゴが消えたあとの画面から反映される。 */

/* ---- ログインまわり ---- */
.authok{background:var(--accent-2);border:1.5px solid var(--gline);border-radius:6px;
  padding:12px 14px;margin-bottom:16px;font-size:13.5px;line-height:1.75;color:var(--accent-3);font-weight:500}
.autherr{border-radius:6px;font-size:13.5px;line-height:1.75}
.authlink{width:100%;margin-top:10px;font-size:13.5px;color:var(--ink-3);height:34px}
.authlink:hover{color:var(--accent-3);background:none;text-decoration:underline}
.authcheck{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.7;color:var(--ink-2)}
.authcheck input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.btn[disabled]{opacity:.55;cursor:progress}
.authform{opacity:1;transition:opacity .15s}
/* Apple でサインイン */
.btn.apple{background:#000;border-color:#000;color:#fff;font-weight:600;gap:8px;letter-spacing:.02em}
.btn.apple:hover{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.btn.apple .ic{width:19px;height:19px;opacity:1;margin-top:-2px}
:root[data-ui="dark"] .btn.apple{background:#fff;border-color:#fff;color:#000}
:root[data-ui="dark"] .btn.apple:hover{background:#eee;border-color:#eee;color:#000}
.authsplit{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--ink-4);font-size:12px}
.authsplit::before,.authsplit::after{content:"";flex:1;border-top:1px solid var(--line)}

function tzOffMin(ms,tz){
  const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});

/* ---------- お支払い ----------
   消費税は10%。表示は「税別」を主、税込を添える。
   status: trial / active / past_due / canceled / none               */
/* iPhone アプリの中で動いているか。
   App Store の規約（Guideline 3.1.1）で、アプリの中から外部の決済へ
   誘導することが禁じられているので、アプリでは購入の導線を出さない。 */
const IS_APP = (()=>{ try{
  return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
      || location.protocol === 'capacitor:';
}catch(e){ return false; } })();

/* App Store に登録する商品ID。プランと支払間隔の組み合わせぶんだけ要る。
   ここを変えたら、App Store Connect と Supabase の plans も必ず合わせること。 */
const IAP_ID = (plan,cyc)=>`com.shiraume.koyomi.sub.${plan}.${cyc==='year'?'year':'month'}`;
/* App Store が返してきた実際の価格（「¥9,800」のような文字列）を覚えておく場所。
   アプリの中に価格を書き固めると、App Store Connect で値段を変えたときや
   通貨・地域が違うときに「表示と請求額が食い違う」状態になり、審査でも指摘される。 */
let STORE_PRICE = null;

/* お金を受け取るかどうかの大元のスイッチ。
   false のあいだは、購入の導線も、期限切れの締め出しも、規約の同意も出さない。
   有料App契約（銀行口座・税務情報）が済んで、はじめて true にする。
   config.js で window.KOYOMI_SELL = true と書けば有効になる。 */
const SELL = (()=>{ try{ return window.KOYOMI_SELL === true; }catch(e){ return false; } })();
/* プラン選択の見出し。無料モード（SELL=false）のときは金額を出さない。 */
const planOptLabel = pl => `${pl.name}${SELL?'｜'+(pl.price?'¥'+pl.price.toLocaleString()+' / 月':'要相談'):''}｜${pl.seats?pl.seats+'名まで':'人数無制限'}`;

const TAX=0.10;
const YEN=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
const INTAX=n=>Math.round(n*(1+TAX));
function jdate(x){
  if(!x)return '—';
  const d=(x instanceof Date)?x:new Date(x);
  if(isNaN(d))return '—';
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function daysLeft(x){
  if(!x)return null;
  const d=new Date(x); if(isNaN(d))return null;
  return Math.ceil((d.getTime()-Date.now())/86400000);
}
/* 画面が使う形にそろえる。ログイン版ではサーバの値で上書きされる。 */
function BILL(){
  const c=DB.company, b=c.billing||{}, pl=curPlan(), used=DB.people.length;
  const sv=DB.billing;                       // billing_summary() の中身
  if(sv){
    const left=daysLeft(sv.trial_ends_at);
    return {
      plan:sv.plan, planName:sv.plan_name||pl.name, price:sv.price,
      priceYear:sv.price_year!=null?sv.price_year:(sv.price?sv.price*10:null),
      seats:sv.seats, used:sv.used!=null?sv.used:used,
      status:sv.status, interval:sv.interval,
      trialEnds:sv.trial_ends_at, trialLeft:left,
      periodEnd:sv.period_end, cancelAtEnd:!!sv.cancel_at_period_end,
      card:b.card||'', contact:sv.billing_email||b.contact||c.name,
      ready:!!b.ready, invoices:b.invoices||[],
      canWrite: sv.can_write!==false
    };
  }
  if(!SELL){
    return {plan:c.plan, planName:pl.name, price:pl.price,
      priceYear:pl.price?pl.price*10:null, seats:pl.seats, used,
      status:'free', interval:'month', trialEnds:null, trialLeft:null,
      periodEnd:null, cancelAtEnd:false, card:'', contact:b.contact||c.name,
      ready:false, invoices:[], canWrite:true};
  }
  const trialEnds=b.trialEnds||new Date(Date.now()+14*86400000).toISOString();
  const st=b.status||'trial';
  const left=daysLeft(trialEnds);
  return {
    plan:c.plan, planName:pl.name, price:pl.price,
    priceYear:pl.price?pl.price*10:null,
    seats:(b.seats!=null?b.seats:pl.seats), used,
    status:st, interval:b.interval||'month',
    trialEnds, trialLeft:left, periodEnd:b.next||null,
    cancelAtEnd:!!b.cancelAtEnd, card:b.card||'', contact:b.contact||c.name,
    ready:!!b.ready, invoices:(b.invoices||[]),
    canWrite: st==='active'||st==='past_due'||(st==='trial'&&left!==null&&left>0)
  };
}

      sub:'いまは人数の上限もなく、すべての機能をお使いいただけます。有料プランのご用意ができましたら、アプリの中でお知らせします。'};

      sub:`${jdate(B.trialEnds)}まで、すべての機能をお使いいただけます。カードの登録はまだ必要ありません。`};
  if(B.status==='trial')

      sub:'いまは「見るだけ」の状態です。予定やメッセージの追加はできません。プランを選ぶと元に戻ります。'};
  if(B.status==='past_due')
    return {cls:'alert',t:'お支払いを確認できていません',big:'',

    sub:`次回のご請求は ${jdate(B.periodEnd)} です。${B.interval==='year'?'年払い':'月払い'}でお支払いいただいています。`};
}

function load(){
  const fresh=()=>{const d=JSON.parse(JSON.stringify(DEF));d.people=[];d.events=[];d.authed=false;d.demo=false;return d;};
  let s=null;
  if(!s||!s.people||!s.people.length){DB=fresh();return;}
  DB=Object.assign(JSON.parse(JSON.stringify(DEF)),s);
  if((DB.imgVer||0)<3){DB.images=JSON.parse(JSON.stringify(BUILTIN_IMG));DB.imgVer=3;}

}

const DEMO_PW='demo2026';
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let o='';for(let i=0;i<6;i++)o+=A[Math.floor(Math.random()*A.length)];return o;}
async function hashPw(pw){
  try{
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('meridian.v1:'+pw));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){let h=0;for(let i=0;i<pw.length;i++){h=(h*31+pw.charCodeAt(i))|0;}return 'f'+(h>>>0).toString(16);}
}
async function __unusedSeedPw(){
  let ch=false;
  for(const p of DB.people){if(!p.pw){p.pw=await hashPw(DEMO_PW);ch=true;}}
  if(ch)save();
}

function visibleEvents(){

function onHoliday(p,ms){
  return DB.events.some(e=>e.kind==='holiday'&&e.who.includes(p.id)&&e.start<=ms&&e.end>ms);
}
/* ============================================================
   曜日ごとの働きかた
   work = { s, e, days:[0..6], dow:{ "0":{off:true} | {s,e}, ... } }
   dow があればそれを優先。無ければ従来どおり days / s / e を見る。
   ============================================================ */
function dayWork(p,dow){
  const w=(p&&p.work)||{};
  const bs=w.s||'09:00', be=w.e||'18:00';
  const d=w.dow&&w.dow[dow];
  if(d) return d.off?{off:true,s:bs,e:be}:{off:false,s:d.s||bs,e:d.e||be};
  return {off:!(w.days||[1,2,3,4,5]).includes(dow),s:bs,e:be};
}
/* その日の勤務時間（その人の現地の曜日で見る） */
function workOn(p,ms){ return dayWork(p,P(ms,effTz(p)).dow); }
/* その日が休みか（曜日の休み・休暇の予定・勤務場所が休暇） */
function isDayOff(p,ms){
  if(!p)return false;
  if(p.location==='holiday'||onHoliday(p,ms))return true;
  return workOn(p,ms).off;
}
/* 曜日ごとの働きかたを一行で（例: 日 休み ・ 月火水木金 09:00–18:00 ・ 土 休み） */
function dowSummary(w){
  const g=[];
  for(let i=0;i<7;i++){
    const d=dayWork({work:w||{}},i);
    const key=d.off?'off':d.s+'-'+d.e;
    if(g.length&&g[g.length-1].key===key) g[g.length-1].ds.push(i);
    else g.push({key,ds:[i],d});
  }
  return g.map(x=>{
    const lbl=x.ds.map(i=>DOWJA[i]).join('');
    return x.d.off?`<span class="muted">${lbl} 休み</span>`:`${lbl} <b>${x.d.s}–${x.d.e}</b>`;
  }).join('<span class="muted"> ・ </span>');
}
/* 時刻の選択肢（15分きざみ・24時間表記でそろえる） */
function timeOpts(val){
  const list=[];
  for(let h=0;h<24;h++)for(let m=0;m<60;m+=15)list.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));
  if(val&&list.indexOf(val)<0){list.push(val);list.sort();}
  return list.map(t=>`<option value="${t}" ${t===val?'selected':''}>${t}</option>`).join('');
}
function dowCapText(days){
  if(!days.length)return'<b>毎日おやすみ</b>になっています';
  if(days.length===7)return'<b>毎日</b>はたらく設定です';
  return'はたらく日：<b>'+days.map(i=>DOWJA[i]).join('')+'</b>（週'+days.length+'日）';
}
/* 曜日ごとの働きかたを編集する部品。pref は id の接頭辞（画面内で重複しない文字列） */
function dowEditor(pref,w){
  const ds=[];for(let i=0;i<7;i++)ds.push(dayWork({work:w||{}},i));
  const days=[0,1,2,3,4,5,6].filter(i=>!ds[i].off);
  const base=days.length?ds[days[0]]:{s:'09:00',e:'18:00'};
  const adv=days.some(i=>ds[i].s!==base.s||ds[i].e!==base.e);
  return `<div class="dowset" data-dowset="${pref}" data-adv="${adv?1:0}" data-adved="${adv?1:0}">
    <div class="dowdays">${DOWJA.map((lbl,i)=>
      `<button type="button" class="dowchip" data-dowtog="${pref}|${i}" aria-pressed="${!ds[i].off}">${lbl}</button>`).join('')}</div>
    <p class="dowcap" data-dowcap="${pref}">${dowCapText(days)}</p>
    <div class="dowbase" data-dowbase="${pref}" ${adv?'hidden':''}>
      <label class="dowt"><span>始業</span><select id="${pref}-bs">${timeOpts(base.s)}</select></label>
      <span class="dowar">→</span>
      <label class="dowt"><span>終業</span><select id="${pref}-be">${timeOpts(base.e)}</select></label>
    </div>
    <div class="dowadv" data-dowadv="${pref}" ${adv?'':'hidden'}>
      ${DOWJA.map((lbl,i)=>`<div class="dowrow" data-dowrow="${pref}|${i}" ${ds[i].off?'hidden':''}>
        <span class="dl">${lbl}</span>
        <select id="${pref}-s-${i}">${timeOpts(ds[i].s)}</select>
        <span class="dash">–</span>
        <select id="${pref}-e-${i}">${timeOpts(ds[i].e)}</select>
      </div>`).join('')}
      <div class="dowempty" data-dowempty="${pref}" ${days.length?'hidden':''}>はたらく日がえらばれていません。</div>
    </div>
    <button type="button" class="dowmore" data-dowmore="${pref}">${adv?'すべて同じ時間にもどす':'曜日ごとに時間を変える'}</button>
  </div>`;
}
/* 画面の状態を整える（曜日ボタンを押したとき・表示を切りかえたとき） */
function dowSync(pref){
  const set=document.querySelector(`[data-dowset="${pref}"]`); if(!set)return;
  const days=[];
  for(let i=0;i<7;i++){
    const tog=set.querySelector(`[data-dowtog="${pref}|${i}"]`);
    const on=tog?tog.getAttribute('aria-pressed')==='true':true;
    if(on)days.push(i);
    const row=set.querySelector(`[data-dowrow="${pref}|${i}"]`); if(row)row.hidden=!on;
  }
  const adv=set.getAttribute('data-adv')==='1';
  const cap=set.querySelector(`[data-dowcap="${pref}"]`); if(cap)cap.innerHTML=dowCapText(days);
  const base=set.querySelector(`[data-dowbase="${pref}"]`); if(base)base.hidden=adv||!days.length;
  const box=set.querySelector(`[data-dowadv="${pref}"]`); if(box)box.hidden=!adv;
  const emp=set.querySelector(`[data-dowempty="${pref}"]`); if(emp)emp.hidden=!!days.length;
  const more=set.querySelector(`[data-dowmore="${pref}"]`);
  if(more){more.textContent=adv?'すべて同じ時間にもどす':'曜日ごとに時間を変える';more.hidden=!days.length;}
}
/* 「曜日ごとに時間を変える」の開閉 */
function dowToggleAdv(pref){
  const set=document.querySelector(`[data-dowset="${pref}"]`); if(!set)return;
  const adv=set.getAttribute('data-adv')==='1';
  const gv=id=>{const el=$('#'+id);return el&&el.value?el.value:null;};
  const sv=(id,v)=>{const el=$('#'+id);if(el&&v)el.value=v;};
  if(!adv){
    // ひらく：いちど目だけ、共通の時間を各曜日にうつす
    if(set.getAttribute('data-adved')!=='1'){
      const bs=gv(pref+'-bs')||'09:00',be=gv(pref+'-be')||'18:00';
      for(let i=0;i<7;i++){sv(pref+'-s-'+i,bs);sv(pref+'-e-'+i,be);}
      set.setAttribute('data-adved','1');
    }
    set.setAttribute('data-adv','1');
  }else{
    // とじる：いちばん早い working day の時間を共通にひきつぐ
    for(let i=0;i<7;i++){
      const tog=set.querySelector(`[data-dowtog="${pref}|${i}"]`);
      if(tog&&tog.getAttribute('aria-pressed')==='true'){
        sv(pref+'-bs',gv(pref+'-s-'+i));sv(pref+'-be',gv(pref+'-e-'+i));break;
      }
    }
    set.setAttribute('data-adv','0');
  }
  dowSync(pref);
}
/* 編集結果を work の形にまとめる */
function dowCollect(pref){
  const set=document.querySelector(`[data-dowset="${pref}"]`);
  const adv=set?set.getAttribute('data-adv')==='1':false;
  const g=id=>{const el=$('#'+id);return el&&el.value?el.value:null;};
  const bs=g(pref+'-bs')||'09:00',be=g(pref+'-be')||'18:00';
  const dow={};
  for(let i=0;i<7;i++){
    const tog=document.querySelector(`[data-dowtog="${pref}|${i}"]`);
    const on=tog?tog.getAttribute('aria-pressed')==='true':true;
    if(!on){dow[i]={off:true};continue;}
    dow[i]=adv?{s:g(pref+'-s-'+i)||bs,e:g(pref+'-e-'+i)||be}:{s:bs,e:be};
  }
  const days=[0,1,2,3,4,5,6].filter(i=>!dow[i].off);
  const base=days.length?dow[days[0]]:{s:bs,e:be};
  return {s:base.s,e:base.e,days,dow};
}
/* 画面に出す「その日の勤務時間」 */
function workLabel(p,ms){
  const w=workOn(p,ms);
  return w.off?'休み':`${w.s}–${w.e}`;
}
function isWorking(p,ms){
  if(p.location==='holiday'||onHoliday(p,ms))return false;
  const tz=effTz(p),pt=P(ms,tz),min=pt.h*60+pt.mi;
  const w=dayWork(p,pt.dow);
  if(w.off)return false;
  return min>=T(w.s)&&min<T(w.e);
}
function statusOf(p,ms){
  if(p.override&&p.override.until>ms)return p.override.status;
  if(p.location==='holiday'||onHoliday(p,ms))return 'holiday';
  const busy=DB.events.filter(e=>e.who.includes(p.id)&&e.start<=ms&&e.end>ms);
  if(busy.some(e=>KGROUP[e.kind]==='meeting'))return 'meeting';
  if(!isWorking(p,ms))return p.location==='trip'?'trip':'off';
  if(busy.some(e=>KGROUP[e.kind]==='focus'))return 'focus';
  if(p.location==='trip')return 'trip';
  return 'available';
}
function nextEvent(pid,ms){

function setupCollect(){
  const g=id=>{const el=$('#'+id);return el?el.value.trim():'';};
  const st=S.setup.step, c=DB.company;
  if(st===1){
    const name=g('su-name');
    if(!name){S.setup.err='会社名を入れてください。';return false;}
    if(SELL && !g('su-mail')){S.setup.err='請求先のメールアドレスを入れてください。';return false;}
    c.name=name; c.nameEn=g('su-en'); c.tz=$('#su-tz').value;
    if(SELL) c.billing=Object.assign({},c.billing,{
      billTo:g('su-billto'),contact:g('su-mail'),zip:g('su-zip'),tel:g('su-tel'),addr:g('su-addr')});
  }
  if(st===2){
    const w=dowCollect('su-dw');
    if(!w.days.length){S.setup.err='働く曜日を1日以上えらんでください。';return false;}
    c.defaultWork=w;
    const r=document.querySelector('input[name="su-loc"]:checked');
    c.locPolicy=r?r.value:c.locPolicy;
  }
  if(st===3){
    const mails=(($('#su-inv')||{}).value||'').split(/[\n,、\s]+/).map(x=>x.trim()).filter(x=>/@/.test(x));
    mails.forEach(m=>{ if(!DB.invites.some(i=>i.email===m)) DB.invites.push({email:m,at:Date.now(),by:DB.userId}); });
    if(mails.length)audit('メンバーを招待',mails.join(' / '));
  }
  S.setup.err=''; return true;
}

function authOk(m){S.auth.err='';S.auth.ok=m;S.auth.busy=false;renderAuth();}
function authBusy(v){S.auth.busy=v;S.auth.err='';S.auth.ok='';renderAuth();}
function authErr(m){
  S.auth.ok='';S.auth.busy=false;
  const vals={};
  document.querySelectorAll('.authform input,.authform select').forEach(el=>{
    if(!el.id||el.type==='password')return;
    vals[el.id]=el.type==='checkbox'?el.checked:el.value;
  });
  S.auth.err=m;renderAuth();
  Object.entries(vals).forEach(([id,v])=>{
    const el=document.getElementById(id);if(!el)return;
    if(el.type==='checkbox')el.checked=v;else el.value=v;
  });
  const first=document.querySelector('.authform input[type=password]')||document.querySelector('.authform input');
  if(first&&window.innerWidth>900)first.focus();
}

function durJa(ms){
  const m=Math.round(ms/60000),h=Math.floor(m/60),mm=m%60;
  return h?(mm?`${h}時間${mm}分`:`${h}時間`):`${mm}分`;
}
function todayTimeline(u,tz,now,ds,de,mine){
  const hol=mine.find(e=>e.kind==='holiday');
  if(hol){
    return `<div class="tday"><div class="thol">
      <span class="hb">休暇</span><b>${esc(hol.title)}</b>
      <span class="sp"></span>
      <button class="btn sm" data-act="del-holiday" data-id="${hol.id}">${icon('trash')}取り消す</button>
    </div></div>`;
  }
  const evs=mine.filter(e=>e.kind!=='holiday');
  const tw=workOn(u,now);
  const off=isDayOff(u,now);                   /* 休みの日は始業・終業の線を出さない */
  const ws=ds+T(tw.s)*60000, we=ds+T(tw.e)*60000;
  const rows=[];
  if(!off)rows.push({k:'m',t:ws,label:'始業',v:tw.s});
  let cur=ws;
  evs.forEach(e=>{
    if(!off&&e.start-cur>=30*60000&&e.start>ws)rows.push({k:'g',t:cur,to:e.start});
    rows.push({k:'e',t:e.start,e});
    cur=Math.max(cur,e.end);
  });
  if(!off&&we-cur>=30*60000)rows.push({k:'g',t:cur,to:we});
  if(!off)rows.push({k:'m',t:we,label:'終業',v:tw.e});
  if(now>ds&&now<de){
    let i=rows.findIndex(r=>r.t>now);
    if(i<0)i=rows.length;
    rows.splice(i,0,{k:'n',t:now});
  }
  if(off&&!evs.length)
    return `<div class="empty">${icon('clock')}今日はお休みです。ゆっくり休んでください。</div>`;
  return `<div class="tday">${rows.map(r=>{
    if(r.k==='n')return `<div class="tnow"><span class="lb">いま</span><span class="tv">${hhmm(now,tz)}</span></div>`;
    if(r.k==='m')return `<div class="tmk"><span class="tt">${r.v}</span><span class="lb">${r.label}</span></div>`;
    if(r.k==='g')return `<div class="tgap"><span class="tt"></span>
      <span class="gl"><span class="gt">${durJa(r.to-r.t)} 空き</span>
      <button class="gadd" data-newslot="${dkey(r.t,tz)}|${hhmm(r.t,tz)}" title="この時間に追加">＋</button></span></div>`;
    const e=r.e,live=e.start<=now&&e.end>now,past=e.end<=now;
    const mem=e.who.map(person).filter(Boolean);
    const otherTz=[...new Set(mem.filter(x=>effTz(x)!==tz).map(x=>effCity(x)))];
    const n=(DB.threads[e.id]||[]).length;
    return `<div class="tev ${live?'live':past?'past':''}">

function weekStart(c){return addDays(c,-cdow(c));}
function evClass(e){return 'k-'+e.kind;}
