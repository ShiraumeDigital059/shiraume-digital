<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Koyomi</title>
<meta name="description" content="世界のどこにいても、チームの「今」が見えるカレンダー。">
<meta name="theme-color" content="#12704F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15161A" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Koyomi">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html{height:100%;-webkit-text-size-adjust:100%}
  body{margin:0;height:100%;background:#fff;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
  @media (prefers-color-scheme:dark){body{background:#15161A}}
  [hidden]{display:none!important}
  @supports (padding:env(safe-area-inset-top)){
    .topbar{padding-top:env(safe-area-inset-top);height:calc(64px + env(safe-area-inset-top))}
    .tabbar{bottom:calc(14px + env(safe-area-inset-bottom))}
    .content{padding-bottom:env(safe-area-inset-bottom)}
  }
</style>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="js/store.js"></script>
</head>
<body>
<title>Koyomi</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Zen+Old+Mincho:wght@600;700;900&display=swap">
<style>
/* ============================================================
   Koyomi — design system
   規則をひとつに揃えない: 主役(予定・時刻・人)は大きく重く、
   補助情報は小さく軽く。面で囲わず、余白と罫線で区切る。
   ============================================================ */
:root{
  /* 面 —— 温かみのあるニュートラル（青みのグレーは使わない） */
  --paper:#FFFFFF; --side:#FAF9F7; --sunken:#F4F2EF; --raise:#EDEAE6;
  --line:#E7E4DF; --line-2:#D3CFC8; --line-3:#B9B4AB;
  --ink:#17181B; --ink-2:#4B4F57; --ink-3:#7C8189; --ink-4:#A9AEB6;
  --accent:#1B6B4C; --accent-2:#EAF3EE; --accent-3:#14523A;
  /* 予定の種別 */
  --k-meeting:#2E6FD4; --k-meeting-bg:#EAF1FD; --k-meeting-ln:#C3D8F7;
  --k-sales:#BF5236;   --k-sales-bg:#FBEEEA;   --k-sales-ln:#EFCCC0;
  --k-focus:#7250C6;   --k-focus-bg:#F1ECFB;   --k-focus-ln:#D8CBF3;
  --k-shoot:#0E8080;   --k-shoot-bg:#E3F3F3;   --k-shoot-ln:#B0DCDC;
  --k-delivery:#1B7550;--k-delivery-bg:#E5F3EC;--k-delivery-ln:#B5DEC8;
  --k-sns:#BA3E74;     --k-sns-bg:#FBE9F0;     --k-sns-ln:#F0C3D6;
  --k-trip:#B07410;    --k-trip-bg:#FBF2DF;    --k-trip-ln:#EEDCAB;
  --k-holiday:#2F82BD; --k-holiday-bg:#E8F2F9; --k-holiday-ln:#BBD9EE;
  --k-personal:#5D6672;--k-personal-bg:#EFF0F2;--k-personal-ln:#D2D5DA;
  --c-off:#8C929B;
  --sun:#B8453C; --sun-bg:#FCF4F3; --sat:#2E6FD4; --sat-bg:#F2F6FD;
  /* 文字 */
  --jp:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Meiryo","Segoe UI",system-ui,sans-serif;
  --lat:"IBM Plex Mono","IBM Plex Sans JP",ui-monospace,monospace;
  --disp:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --r:7px;
}
:root[data-ui="dark"]{
  --paper:#15161A; --side:#101115; --sunken:#1D1F24; --raise:#282A30;
  --line:#2A2C32; --line-2:#3B3E46; --line-3:#4F535C;
  --ink:#F0F0EE; --ink-2:#BFC3C9; --ink-3:#8E939B; --ink-4:#666B73;
  --accent:#57BE90; --accent-2:#152A22; --accent-3:#7ED6AC;
  --k-meeting:#7FB0FF; --k-meeting-bg:#152034; --k-meeting-ln:#2A3C5C;
  --k-sales:#E8907A;   --k-sales-bg:#2C1B16;   --k-sales-ln:#4A2E24;
  --k-focus:#B197FF;   --k-focus-bg:#211C36;   --k-focus-ln:#392F5A;
  --k-shoot:#5CC6C6;   --k-shoot-bg:#112827;   --k-shoot-ln:#1D4241;
  --k-delivery:#57BE90;--k-delivery-bg:#12281E;--k-delivery-ln:#20442F;
  --k-sns:#EE87B0;     --k-sns-bg:#2C1621;     --k-sns-ln:#49263B;
  --k-trip:#DDA63C;    --k-trip-bg:#2A2211;    --k-trip-ln:#473919;
  --k-holiday:#74BAE8; --k-holiday-bg:#142434; --k-holiday-ln:#234057;
  --k-personal:#9AA3AF;--k-personal-bg:#1D2026;--k-personal-ln:#32363E;
  --c-off:#767C85;
  --sun:#E88B83; --sun-bg:#251A19; --sat:#7FB0FF; --sat-bg:#151D2B;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--jp);
  font-size:14.5px;line-height:1.85;font-weight:400;letter-spacing:.012em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit;font-family:var(--jp)}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left;line-height:1.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:.01em}
.muted{color:var(--ink-3)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
/* 数字は別書体・等幅・やや詰める —— 情報として一番強い */
.num,.tnum,.joincode,.clockbar .t,.tl .tm,.mgrid .cell>.n,.wgrid .whd .dn,
.evb .t,.gut .h,.bandx .sc span,.plan .pp,.msg .when,.summary b{
  font-family:var(--lat);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.005em}

/* ---------- 骨格 ---------- */
#app{display:grid;grid-template-columns:230px minmax(0,1fr);height:100%;overflow:hidden}
#app.authmode{display:block;height:100%;overflow:auto;grid-template-columns:none}
.rail{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 18px 16px;display:flex;align-items:center;gap:10px}
.brand .logo{width:24px;height:24px;object-fit:contain;flex:none}
.brand .tx{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:15px;font-weight:700;line-height:1.35;letter-spacing:.005em}
.brand span{font-family:var(--lat);font-size:11.5px;color:var(--ink-3);letter-spacing:.04em;font-weight:500}
.nav{padding:2px 10px 10px;display:flex;flex-direction:column;overflow-y:auto;flex:1;min-height:0}
.nav button{display:flex;align-items:center;gap:11px;padding:7px 10px 7px 12px;color:var(--ink-2);
  font-size:14px;width:100%;border-radius:6px;position:relative;font-weight:500}
.nav button .ic{width:17px;height:17px;flex:none;opacity:.62}
.nav button:hover{background:var(--raise);color:var(--ink)}
.nav button[aria-current="true"]{color:var(--ink);font-weight:700;background:transparent}
.nav button[aria-current="true"] .ic{opacity:1}
.nav button[aria-current="true"]::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2.5px;
  border-radius:2px;background:var(--accent)}
.nav .grp{padding:20px 12px 6px;font-size:11px;letter-spacing:.12em;color:var(--ink-4);font-weight:700;
  font-family:var(--lat);text-transform:uppercase}
.me{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;align-items:center;width:100%}
.me:hover{background:var(--raise)}
.me .nm{display:block;font-size:13.5px;font-weight:700;line-height:1.4}
.me .sub{display:block;font-size:12px;color:var(--ink-3);line-height:1.4}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper)}
.topbar{display:flex;align-items:center;gap:14px;padding:0 26px;height:58px;flex:none;border-bottom:1px solid var(--line)}
.topbar h1{font-size:19px;font-weight:700;letter-spacing:.005em}
.topbar .sub{font-size:12.5px;color:var(--ink-3);padding-left:14px;border-left:1px solid var(--line)}
.content{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.pad{padding:26px 26px 56px;max-width:1160px}

/* 世界時計 —— このプロダクトの看板。面で囲わず、数字で見せる */
.clockbar{display:flex;flex:none;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);background:var(--paper)}
.clockbar::-webkit-scrollbar{display:none}
.clockbar .ck{display:flex;flex-direction:column;justify-content:center;gap:0;padding:9px 24px 10px 0;
  margin-left:26px;flex:none;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.clockbar .ck+.ck{margin-left:0;padding-left:24px;border-left:1px solid var(--line)}
.clockbar .ck .c{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;font-weight:500}
.clockbar .ck .t{font-size:21px;font-weight:600;color:var(--ink-2);line-height:1.15}
.clockbar .ck .o{display:none}
.clockbar .ck.home .t{color:var(--ink)}
.clockbar .ck.home{border-bottom-color:var(--accent)}
.clockbar .ck.night .t{color:var(--ink-4);font-weight:500}
.clockbar .tail{display:flex;align-items:center;padding:0 26px;font-size:12.5px;color:var(--ink-3);white-space:nowrap;margin-left:auto}

/* ---------- 部品 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:33px;padding:0 13px;
  border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper);color:var(--ink);
  font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn .ic{width:16px;height:16px;flex:none;opacity:.6;margin-left:-2px}
.btn .ic:last-child{margin:0 -3px 0 0}
.btn:hover{background:var(--sunken);border-color:var(--line-3)}
.btn:hover .ic{opacity:.85}
.btn:active{background:var(--raise)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.btn.pri .ic{opacity:.8}
.btn.pri:hover{background:#2C2F35;border-color:#2C2F35}
:root[data-ui="dark"] .btn.pri:hover{background:#DCDCDA;border-color:#DCDCDA}
.btn.q{border-color:transparent;background:transparent;color:var(--ink-2);padding:0 8px}
.btn.q:hover{background:var(--sunken);color:var(--ink);border-color:transparent}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn.sm .ic{width:15px;height:15px}
.btn.ico{width:33px;padding:0}.btn.ico.sm{width:28px}.btn.ico .ic{margin:0}
.btn.big{height:46px;width:100%;font-size:15px}
.btn.danger{color:#A03A2B;border-color:var(--line-2)}
:root[data-ui="dark"] .btn.danger{color:#E4907F}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--paper)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:31px;padding:0 13px;font-size:13px;
  color:var(--ink-3);border-right:1px solid var(--line-2);font-weight:500}
.seg button .ic{width:15px;height:15px;opacity:.55}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--sunken);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.seg button[aria-pressed="true"] .ic{opacity:.9}
:root[data-ui="dark"] .seg button[aria-pressed="true"]{color:#15161A}

/* セクション見出し —— 帯にしない。小さなラベル＋細い罫 */
.block{margin:0 0 38px}
.sec{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 12px;
  padding-bottom:7px;border-bottom:1px solid var(--line)}
.sec h2{font-size:13px;font-weight:700;letter-spacing:.055em;color:var(--ink)}
.sec .note{font-size:12.5px;color:var(--ink-3);font-weight:400}
.rule{border:0;border-top:1px solid var(--line);margin:34px 0 26px}
.empty{padding:30px 0;color:var(--ink-3);font-size:13.5px;display:flex;flex-direction:column;
  align-items:center;gap:9px;text-align:center}
.empty .ic{width:24px;height:24px;opacity:.4}
.empty.left{align-items:flex-start;text-align:left}
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:12.5px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
input[type=text],input[type=date],input[type=time],input[type=email],input[type=number],select,textarea{
  background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);padding:8px 11px;
  font-size:14px;width:100%;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink-3);box-shadow:0 0 0 3px var(--sunken)}
textarea{resize:vertical;min-height:70px}

/* 状態 */
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--c-off)}
.sdot.s-available{background:var(--k-delivery)} .sdot.s-meeting{background:var(--k-meeting)}
.sdot.s-focus{background:var(--k-focus)} .sdot.s-trip{background:var(--k-trip)}
.sdot.s-holiday{background:var(--k-holiday)}
.sdot.s-off{background:transparent;box-shadow:inset 0 0 0 2px var(--ink-4)}
.stt{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);white-space:nowrap;font-weight:500}
.stt.on{font-weight:700;color:var(--ink)}
.stt.s-available{color:var(--k-delivery)} .stt.s-meeting{color:var(--k-meeting)}
.stt.s-focus{color:var(--k-focus)} .stt.s-trip{color:var(--k-trip)} .stt.s-holiday{color:var(--k-holiday)}
.stt.s-off{color:var(--ink-3)}
.av{border-radius:50%;display:grid;place-items:center;flex:none;background:var(--raise);color:var(--ink-3);
  position:relative;font-family:var(--lat);font-weight:600;letter-spacing:.02em}
.av.s{width:26px;height:26px;font-size:10.5px}
.av.m{width:32px;height:32px;font-size:12px}
.av.l{width:62px;height:62px;font-size:21px}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ic.img{object-fit:contain;stroke:none}
.ic.img.flip{transform:scaleX(-1)}
.btn.pri .ic.img{filter:invert(1)}
:root[data-ui="dark"] .ic.img{filter:invert(1)}
:root[data-ui="dark"] .btn.pri .ic.img{filter:none}
:root[data-ui="dark"] .kimg{filter:invert(1)}
.kicon{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.kimg{width:15px;height:15px;object-fit:contain;flex:none}

/* ---------- 今日 ---------- */
.today{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:1080px){
  .today{grid-template-columns:minmax(0,1fr) 332px;gap:0 40px}
  .today-side{border-left:1px solid var(--line);padding-left:40px}
}
.dayhead{display:flex;align-items:baseline;gap:14px;margin-bottom:4px}
.dayhead .d{font-family:var(--disp);font-size:31px;font-weight:600;letter-spacing:.02em;line-height:1.15}
.dayhead .w{font-size:14px;color:var(--ink-2);font-weight:500}
.dayhead .w.dw-0{color:var(--sun)} .dayhead .w.dw-6{color:var(--sat)}
.mystate{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 0 0;font-size:13.5px;color:var(--ink-3);margin-bottom:34px}
.mystate .dv{width:1px;height:12px;background:var(--line-2)}
.tl{margin:0}
.tl .it{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:18px;padding:15px 0 15px 14px;
  border-bottom:1px solid var(--line);position:relative;align-items:baseline;width:100%;text-align:left}
.tl .it:first-of-type{border-top:1px solid var(--line-2)}
.tl .it::before{content:"";position:absolute;left:0;top:15px;bottom:15px;width:3px;border-radius:2px;background:var(--c-off)}
.tl .it.k-meeting::before{background:var(--k-meeting)} .tl .it.k-sales::before{background:var(--k-sales)}
.tl .it.k-focus::before{background:var(--k-focus)} .tl .it.k-shoot::before{background:var(--k-shoot)}
.tl .it.k-delivery::before{background:var(--k-delivery)} .tl .it.k-sns::before{background:var(--k-sns)}
.tl .it.k-trip::before{background:var(--k-trip)} .tl .it.k-holiday::before{background:var(--k-holiday)}
.tl .it.k-personal::before{background:var(--k-personal)}
.tl .it:hover{background:var(--side)}
.tl .it .tm{font-size:17px;font-weight:600;color:var(--ink)}
.tl .it .ti{font-size:15px;font-weight:600;line-height:1.6;letter-spacing:.005em}
.tl .it .ti .kicon,.tl .it .ti .kimg{width:16px;height:16px;margin-right:8px;vertical-align:-3px}
.tl .it .mt{font-size:12.5px;color:var(--ink-3);margin-top:1px;font-weight:400}
.tl .it .rt{font-size:12.5px;color:var(--ink-3)}
.tl .it.past .tm{color:var(--ink-3);font-weight:500}
.tl .it.past .ti{color:var(--ink-2);font-weight:400}
.tl .it.past::before{opacity:.35}
.tl .it.live{background:var(--accent-2)}
.tl .it.live .ti{font-weight:700}
.tl .end{display:grid;grid-template-columns:58px 1fr;gap:18px;padding:13px 0 13px 14px;color:var(--ink-4);font-size:13px}
.tl .end span:first-child{font-family:var(--lat);font-variant-numeric:tabular-nums}
.summary{font-size:13.5px;color:var(--ink-3);display:flex;gap:20px;flex-wrap:wrap}
.summary b{font-weight:700;color:var(--ink);font-size:16px;margin-right:2px}

/* 今日 右レーン: メンバーの縦リスト */
.pl{display:flex;flex-direction:column}
.pl .p{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:11px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.pl .p:first-child{border-top:1px solid var(--line-2)}
.pl .p:hover{background:var(--side)}
.pl .nm{font-size:14px;font-weight:700;line-height:1.4;display:block}
.pl .sub{font-size:12px;color:var(--ink-3);display:block;line-height:1.45}
.pl .rt{text-align:right}
.pl .rt .t{font-family:var(--lat);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;display:block;line-height:1.2}
.pl .rt .t.dim{color:var(--ink-4);font-weight:500}
.pl .rt .st{font-size:11.5px;display:block}

/* ---------- 表 ---------- */
.tscroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11.5px;letter-spacing:.08em;color:var(--ink-3);font-weight:700;
  padding:0 16px 8px 0;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.t td{padding:12px 16px 12px 0;border-bottom:1px solid var(--line);vertical-align:middle;
  white-space:nowrap;color:var(--ink-2)}
table.t th:last-child,table.t td:last-child{padding-right:0}
table.t tbody tr.clickable{cursor:pointer}
table.t tbody tr:hover{background:var(--side)}
.pname{display:flex;align-items:center;gap:11px;min-width:0}
.pname .n{font-weight:700;color:var(--ink);font-size:14.5px}
.pname .sub{font-size:12px;color:var(--ink-3);font-weight:400}
.tnum{font-size:17px;font-weight:600;color:var(--ink)}
.tnum.dim{color:var(--ink-4);font-weight:500}

/* ---------- カレンダー ---------- */
.calbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.calbar .title{font-size:19px;font-weight:700;min-width:118px;letter-spacing:.01em}
.legend-kinds{display:flex;flex-wrap:wrap;gap:4px 16px;margin:-4px 0 14px;font-size:12px;color:var(--ink-3)}
.legend-kinds span{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.legend-kinds .kimg,.legend-kinds .kicon{width:14px;height:14px;opacity:.85}
.mgrid{border-top:1px solid var(--line-2);border-left:1px solid var(--line)}
.mgrid .hd,.mgrid .wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mgrid .hd div{padding:7px 8px;font-size:12px;font-weight:700;color:var(--ink-3);text-align:center;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line-2);letter-spacing:.06em}
.mgrid .hd div:first-child{color:var(--sun)} .mgrid .hd div:last-child{color:var(--sat)}
.mgrid .cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:112px;
  padding:6px 7px 8px;display:flex;flex-direction:column;gap:3px}
.mgrid .cell:first-child{background:var(--sun-bg)} .mgrid .cell:last-child{background:var(--sat-bg)}
.mgrid .cell.out{background:var(--sunken)}
.mgrid .cell>.n{font-size:13px;font-weight:600;color:var(--ink-2);align-self:flex-start;padding:0 2px;line-height:1.5}
.mgrid .cell:first-child>.n{color:var(--sun)} .mgrid .cell:last-child>.n{color:var(--sat)}
.mgrid .cell.out>.n{color:var(--ink-4);font-weight:500}
.mgrid .cell.today{background:var(--accent-2)}
.mgrid .cell.today>.n{background:var(--accent);color:#fff;border-radius:50%;width:23px;height:23px;
  display:grid;place-items:center;padding:0;font-weight:700}
:root[data-ui="dark"] .mgrid .cell.today>.n{color:#15161A}
.ev{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 5px;border-radius:4px;
  cursor:pointer;width:100%;line-height:1.5;background:transparent}
.ev .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);font-weight:500}
.ev:hover{background:var(--raise)}
.ev .bull{width:6px;height:6px;border-radius:50%;flex:none;background:var(--c-off)}
.evdots{display:none;gap:4px;flex-wrap:wrap;margin-top:2px}
.evdots i{width:7px;height:7px;border-radius:50%;display:block;background:var(--c-off)}
.wgrid{border-top:1px solid var(--line-2)}
.wgrid .whd{display:grid;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--paper);z-index:3}
.wgrid .whd .c{padding:8px 6px;text-align:center;display:flex;align-items:baseline;justify-content:center;gap:7px;
  border-right:1px solid var(--line)}
.wgrid .whd .c:last-child{border-right:0}
.wgrid .whd .c .dw{font-size:12px;color:var(--ink-3);font-weight:600}
.wgrid .whd .c .dn{font-size:16px;font-weight:600}
.wgrid .whd .c:nth-child(2) .dw,.wgrid .whd .c:nth-child(2) .dn{color:var(--sun)}
.wgrid .whd .c:last-child .dw,.wgrid .whd .c:last-child .dn{color:var(--sat)}
.wgrid .whd .c.today{background:var(--accent-2)}
.wgrid .whd .c.today .dw,.wgrid .whd .c.today .dn{color:var(--accent-3);font-weight:700}
.wbody{position:relative;overflow:auto;max-height:min(68vh,660px)}
.wbody .inner{display:grid;position:relative}
.gut{border-right:1px solid var(--line);background:var(--paper)}
.gut .h{height:46px;font-size:11.5px;color:var(--ink-4);text-align:right;padding-right:9px;transform:translateY(-7px)}
.col{border-right:1px solid var(--line);position:relative}
.col:last-child{border-right:0}
.col .h{height:46px;border-bottom:1px solid var(--line)}
.col .h.off{background:var(--sunken)}
.col .h:hover{background:var(--raise);cursor:pointer}
.col.dow-0{background:var(--sun-bg)} .col.dow-6{background:var(--sat-bg)}
.col.today{background:var(--accent-2)}
.evb{position:absolute;left:2px;right:2px;border-radius:5px;padding:4px 7px;font-size:12.5px;overflow:hidden;
  cursor:pointer;background:var(--sunken);border:1px solid var(--line);border-left:3px solid var(--c-off);z-index:2;line-height:1.35}
.evb .n{font-weight:600;color:var(--ink)}
.evb .n.ell{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.evb .t{font-size:11.5px;color:var(--ink-3)}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--accent);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-3px;top:-3.5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tzlist{border-top:1px solid var(--line-2)}
.tzlist .r{display:flex;align-items:baseline;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.tzlist .r .c{color:var(--ink-2);flex:1;min-width:0;font-weight:600}
.tzlist .r .t{font-family:var(--lat);font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.tzlist .r.self .c,.tzlist .r.self .t{color:var(--ink)}
.tzlist .r.self{background:var(--accent-2);margin:0 -10px;padding-left:10px;padding-right:10px}
.tzlist .r .nd{font-size:11.5px;color:var(--k-sales);font-weight:700}

/* ---------- 地図 ---------- */
.mapwrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.mapinner{position:relative;width:100%;aspect-ratio:180/70;max-height:330px}
#worldmap{position:absolute;inset:0;width:100%;height:100%}
.pinb{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:baseline;gap:8px;
  background:var(--paper);border:1px solid var(--line-2);border-radius:99px;padding:3px 11px;cursor:pointer;
  white-space:nowrap;font-size:12.5px;color:var(--ink-2);box-shadow:0 1px 3px rgba(20,20,22,.07)}
.pinb:hover,.pinb[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);z-index:5}
.pinb .cnt{font-weight:700;color:var(--ink);font-family:var(--lat)}
.pinb .tt{font-family:var(--lat);font-variant-numeric:tabular-nums;color:var(--ink-3)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);padding:11px 16px;border-top:1px solid var(--line)}

/* ---------- メッセージ ---------- */
.dmpick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.dmpick .lb{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;margin-right:4px}
.dmpick .who{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:99px;
  padding:4px 13px 4px 5px;font-size:13.5px;color:var(--ink-2)}
.dmpick .who:hover{border-color:var(--ink-3);background:var(--side)}
.dmpick .who.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
:root[data-ui="dark"] .dmpick .who.on{color:#15161A}
.dmpick .who .nm{font-weight:600}
.dmpick .who .st{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3);font-family:var(--lat)}
.dmpick .who.on .st{color:rgba(255,255,255,.75)}
.msgwrap{display:grid;grid-template-columns:262px minmax(0,1fr);border:1px solid var(--line);border-radius:10px;
  overflow:hidden;height:calc(100vh - 250px);min-height:430px}
.thl{border-right:1px solid var(--line);overflow:auto;background:var(--side)}
.thl button{width:100%;padding:12px 15px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.thl button:hover{background:var(--raise)}
.thl button[aria-current="true"]{background:var(--paper);box-shadow:inset 2.5px 0 0 var(--accent)}
.thl .t1{font-size:13.5px;font-weight:700;display:flex;gap:8px;align-items:center}
.thl .t2{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thl .grp{padding:14px 15px 6px;font-size:11px;letter-spacing:.1em;color:var(--ink-4);font-weight:700;font-family:var(--lat);text-transform:uppercase}
.thread{display:flex;flex-direction:column;min-width:0;background:var(--paper)}
.thread .th{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.thread .body{flex:1;overflow:auto;padding:4px 18px 16px}
.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.msg .who{font-size:13.5px;font-weight:700;color:var(--ink)}
.msg .when{font-size:12px;color:var(--ink-4);margin-left:10px;font-weight:500}
.msg .tx{font-size:14px;color:var(--ink-2);line-height:1.9;white-space:pre-wrap}
.composer{border-top:1px solid var(--line);padding:11px 14px;display:flex;gap:9px;background:var(--side)}

/* ---------- 管理 ---------- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 28px;font-size:14px;align-items:baseline}
.kv dt{color:var(--ink-3);font-size:12.5px;white-space:nowrap;font-weight:500}
.kv dd{margin:0;font-weight:600;color:var(--ink)}
.kv dd .kicon,.kv dd .kimg{width:15px;height:15px;margin-right:7px;vertical-align:-2px}
.band{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.band .who{font-size:14px;display:flex;align-items:baseline;gap:9px;min-width:0;color:var(--ink);font-weight:600}
.band .who .sub{font-size:12px;color:var(--ink-3);white-space:nowrap;font-weight:400}
.band .track{position:relative;height:20px;background:var(--sunken);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.band .fill{position:absolute;top:0;bottom:0;background:var(--ink-4);opacity:.4}
.band.on .fill{background:var(--accent);opacity:.85}
.band .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2)}
.band .now{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.bandx{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;margin-top:7px}
.bandx .sc{position:relative;height:14px}
.bandx .sc span{position:absolute;font-size:11px;color:var(--ink-4);transform:translateX(-50%)}
.joincode{font-size:25px;font-weight:600;letter-spacing:.24em;padding:5px 16px;border:1px dashed var(--line-3);
  border-radius:8px;color:var(--ink);background:var(--side)}
.usage{height:5px;background:var(--sunken);border-radius:99px;overflow:hidden;width:130px}
.usage span{display:block;height:100%;background:var(--ink-3)}
.planrow td .cur{font-size:11.5px;color:var(--accent);font-weight:700;margin-left:9px}
/* ---- お支払い ---- */
.billhead{display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px 28px;
  padding:2px 0 22px;border-bottom:1px solid var(--line-2);margin-bottom:24px}
.billhead>div:first-child{flex:1 1 320px;min-width:0}
.billhead .st{font-family:var(--disp);font-size:26px;font-weight:600;color:var(--ink);
  letter-spacing:.02em;line-height:1.3;display:flex;align-items:baseline;gap:10px}
.billhead .st b{font-family:var(--lat);font-size:30px;font-weight:600;color:var(--accent);letter-spacing:0}
.billhead .sub{font-size:13.5px;color:var(--ink-2);margin-top:8px;line-height:1.75;max-width:46em}
.billhead .acts{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap;padding-top:4px}
.billhead.alert .st,.billhead.alert .st b{color:var(--sun)}
.billhead.alert .sub{color:var(--ink-2)}
.billnote{font-size:12.5px;color:var(--ink-3);margin-top:14px;line-height:1.8}
.billnote a{color:var(--ink-2)}
.kv.billkv dd{overflow-wrap:anywhere}
.seatbar{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.seatbar .usage{width:180px;height:7px}
.seatbar .usage span{background:var(--accent)}
.seatbar.full .usage span{background:var(--sun)}
.cyc{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cyc .save{font-size:12.5px;color:var(--accent);font-weight:700}
.plist{border-top:1px solid var(--line)}
.prow{position:relative;display:grid;grid-template-columns:minmax(140px,1.1fr) 148px minmax(0,1.6fr) auto;
  gap:14px 20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.prow>*{position:relative;z-index:1}
.prow .nm{font-family:var(--disp);font-size:18px;font-weight:600;color:var(--ink);display:flex;align-items:baseline;gap:9px}
.prow .nm .cur{font-family:var(--jp);font-size:11.5px;color:var(--accent);font-weight:700;letter-spacing:.04em}
.prow .nm .seat{font-family:var(--jp);font-size:12px;color:var(--ink-3);font-weight:400}
.prow .pr{font-family:var(--lat);font-size:21px;font-weight:600;color:var(--ink);white-space:nowrap}
.prow .pr .u{font-family:var(--jp);font-size:12px;color:var(--ink-3);font-weight:400;margin-left:3px}
.prow .pr .tax{display:block;font-family:var(--jp);font-size:11.5px;color:var(--ink-4);font-weight:400;letter-spacing:0}
.prow .ft{font-size:13px;color:var(--ink-2);line-height:1.8}
.prow .go{text-align:right;white-space:nowrap}
.prow.on::before{content:"";position:absolute;inset:0;background:var(--accent-2);
  border-left:3px solid var(--accent);z-index:0}
.prow.on .nm{padding-left:12px}
.invl{border-top:1px solid var(--line)}
.invr{display:grid;grid-template-columns:118px minmax(0,1fr) auto 96px auto;gap:12px 16px;align-items:center;
  padding:13px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.invr .dt{font-family:var(--lat);color:var(--ink-2);font-size:13px}
.invr .no{color:var(--ink-3);font-size:12.5px}
.invr .am{font-family:var(--lat);font-size:15px;font-weight:600;color:var(--ink);text-align:right;white-space:nowrap}
.invr .stt{font-size:12px;font-weight:700}
.invr .stt.paid{color:var(--accent)} .invr .stt.open{color:var(--k-trip)} .invr .stt.bad{color:var(--sun)}
.robar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;
  background:var(--sun-bg);border-bottom:1px solid var(--line-2);font-size:13.5px;color:var(--ink)}
.robar b{color:var(--sun)}
.robar .btn{margin-left:auto;height:29px;font-size:13px}
:root[data-ui="dark"] .robar{background:#2A1917}
@media(max-width:860px){
  .kv.billkv{grid-template-columns:1fr;gap:2px 0}
  .kv.billkv dt{font-size:12px;font-weight:600;padding-top:11px;color:var(--ink-3)}
  .kv.billkv dd{font-size:15.5px;font-weight:700;line-height:1.55}
  .kv.billkv dd,.kv.billkv dt{overflow-wrap:anywhere}
  .kv.billkv dd .muted{font-size:12.5px;font-weight:500}
  .billnote{font-size:12px;line-height:1.85}
  .prow{grid-template-columns:1fr auto;row-gap:8px}
  .prow .ft{grid-column:1/-1}
  .prow .go{grid-column:1/-1;text-align:left}
  .invr{grid-template-columns:1fr auto;row-gap:4px}
  .invr .no{grid-column:1/-1}
  .billhead .acts{margin-left:0;width:100%}
}
.imgslot{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line)}
.imgslot .pv{width:46px;height:46px;flex:none;display:grid;place-items:center;border:1px solid var(--line-2);
  border-radius:8px;background:var(--side)}
.imgslot .pv img{width:30px;height:30px;object-fit:contain}
.imgslot .pv.round img{width:100%;height:100%;border-radius:50%}
.imgslot .nm{flex:1;min-width:0;font-size:14px;font-weight:600}
.imgslot .nm small{display:block;color:var(--ink-3);font-size:12px;font-weight:400}
.imgslot input[type=file]{display:none}
.imggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0 30px}
.photoedit{display:flex;align-items:center;gap:14px}
.photoedit input[type=file]{display:none}

/* ---------- 重ねる層 ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--paper);
  border-left:1px solid var(--line-2);box-shadow:-24px 0 50px -34px rgba(20,20,22,.5);z-index:60;display:flex;flex-direction:column}
.drawer .dh{padding:20px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:flex-start}
.drawer .db{overflow:auto;padding:20px;display:flex;flex-direction:column;gap:30px;flex:1}
.scrim{position:fixed;inset:0;background:rgba(18,18,20,.36);z-index:50;display:grid;place-items:center;padding:16px;overflow:auto;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.modal{background:var(--paper);border-radius:12px;box-shadow:0 24px 60px -22px rgba(18,18,20,.45);
  width:min(560px,100%);border:1px solid var(--line-2);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.wide{width:min(780px,100%)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h3{font-size:16px;font-weight:700}
.modal .mb{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center;background:var(--side)}
.x{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3)}
.x .ic{width:16px;height:16px}
.x:hover{background:var(--sunken);color:var(--ink)}
.pickr{display:flex;flex-wrap:wrap;gap:7px;max-height:220px;overflow:auto}
.pickr button{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:99px;
  padding:4px 12px 4px 4px;font-size:13.5px;color:var(--ink-2)}
.pickr button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600;background:var(--sunken)}
.slots{border-top:1px solid var(--line-2)}
.slots .s{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);align-items:center}
.slots .s:hover{background:var(--side)}
.slots .s .d{font-size:15px;font-weight:600;color:var(--ink)}
.slots .s .z{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:99px;font-size:13.5px;z-index:90;font-weight:600;box-shadow:0 8px 24px -10px rgba(0,0,0,.4)}

/* ---------- 認証 ---------- */
.authwrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 18px 44px;background:var(--side);gap:18px;overflow:auto}
.authcard{width:100%;max-width:512px;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:30px 30px 32px;display:flex;flex-direction:column;gap:20px;box-shadow:0 20px 54px -38px rgba(18,18,20,.4)}
.authhead{display:flex;align-items:center;gap:15px}
.authhead .mark{width:46px;height:46px;flex:none;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;background:var(--side)}
.authhead .mark .ic{width:23px;height:23px;color:var(--accent)}
.authhead .mark img{width:32px;height:32px;object-fit:contain}
.authhead h1{font-family:var(--disp);font-size:25px;font-weight:600;line-height:1.2;letter-spacing:.02em}
.authhead p{margin:4px 0 0;font-size:12.5px;color:var(--ink-3);font-weight:400;line-height:1.6}
.authtabs{width:100%}
.authtabs button{flex:1;justify-content:center;height:36px}
.authform{display:flex;flex-direction:column;gap:15px}
.autherr{background:var(--k-sales-bg);border:1px solid var(--k-sales-ln);color:var(--k-sales);
  border-radius:8px;padding:11px 14px;font-size:13.5px;font-weight:600}
.authsplit{display:flex;align-items:center;gap:13px;color:var(--ink-4);font-size:12.5px}
.authsplit::before,.authsplit::after{content:"";flex:1;height:1px;background:var(--line)}
.authnote{margin:0;font-size:12px;color:var(--ink-3);line-height:1.8}
.authcheck{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.authcheck input{width:auto;margin-top:5px}
.authfoot{font-size:12px;color:var(--ink-4)}

/* ---- 初期設定 ---- */
.setwrap{min-height:100%;display:flex;flex-direction:column;align-items:center;
  padding:38px 18px 56px;background:var(--side);gap:20px;overflow:auto}
.setcard{width:100%;max-width:660px;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:30px 32px 34px;display:flex;flex-direction:column;gap:22px;box-shadow:0 20px 54px -38px rgba(18,18,20,.4)}
.sethead{display:flex;align-items:center;gap:18px}
.sethead .brand{padding:0;flex:none}
.sethead .brand .bmark{width:54px;height:29.3px}

/* ============================================================
   v17 — 上部ナビ / 通知 / 国旗 / コントラスト強化
   ============================================================ */
:root{
  --ink:#0D0E11; --ink-2:#33373E; --ink-3:#5F656F; --ink-4:#98A0AC;
  --line:#E3E0DB; --line-2:#CFCBC4; --line-3:#AEA9A1;
  --red:#DB3327;
}
:root[data-ui="dark"]{
  --ink:#F5F5F3; --ink-2:#C9CDD3; --ink-3:#969BA3; --ink-4:#6B707A;
  --line:#2C2E34; --line-2:#3E414A; --line-3:#565A64;
  --red:#FF5F52;
}
body{font-weight:500;line-height:1.78}
.muted{color:var(--ink-3);font-weight:500}

/* --- 骨格：上部ナビ --- */
#app{display:flex;flex-direction:column;height:100%;overflow:hidden;grid-template-columns:none}
.rail{display:none!important}
.topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:60px;flex:none;border-bottom:1px solid var(--line)}
.tb-brand{display:flex;align-items:center;gap:9px;min-width:0;max-width:200px}
.tb-brand .logo{width:26px;height:26px;object-fit:contain;flex:none}
.tb-brand .lgmark{width:27px;height:27px;flex:none;border-radius:8px;background:var(--ink);color:var(--paper);
  display:grid;place-items:center;font-weight:700;font-size:14px}
.tb-brand .tx{min-width:0}
.tb-brand .tx b{display:block;font-size:14px;font-weight:700;line-height:1.3;color:var(--ink)}
.tb-brand .tx span{display:block;font-size:10.5px;color:var(--ink-3);font-family:var(--lat);letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.tbnav{display:flex;gap:2px}
.tbnav button{position:relative;padding:8px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.tbnav button:hover{background:var(--sunken);color:var(--ink-2)}
.tbnav button[aria-current="true"]{color:var(--ink);background:var(--sunken);font-weight:700}
.bdg{position:absolute;top:1px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);
  color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;font-family:var(--lat);line-height:1;
  box-shadow:0 0 0 2px var(--paper)}
.ibtn{width:37px;height:37px;border-radius:10px;display:grid;place-items:center;position:relative;color:var(--ink-2);flex:none}
.ibtn:hover{background:var(--sunken);color:var(--ink)}
.ibtn .ic{width:20px;height:20px}
.av-btn{width:37px}.av-btn .av{width:30px;height:30px;font-size:11px}

/* --- 世界時計：国旗＋英語 --- */
.clockbar .ck .c{display:flex;align-items:center;gap:6px;font-family:var(--lat);font-size:12.5px;font-weight:600;
  color:var(--ink-3);letter-spacing:.03em;text-transform:none}
.clockbar .ck .c .fl{font-size:15px;line-height:1}
.clockbar .ck .c .cc{font-size:10.5px;color:var(--ink-4);letter-spacing:.06em}
.clockbar .ck .t{font-size:22px;font-weight:700;color:var(--ink-2)}
.clockbar .ck.home .t{color:var(--ink)}
.clockbar .ck.home.night .t{color:var(--ink-2)}
.clockbar .ck .o{display:block;font-family:var(--lat);font-size:10.5px;color:var(--ink-4);letter-spacing:.04em;font-weight:600;margin-top:-2px}
.clockbar .tail b{font-family:var(--lat);font-size:15px;color:var(--ink);font-weight:700}
.cty{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.cty .fl{font-size:15px;line-height:1}
.cty .cn{font-family:var(--lat);font-weight:600;color:var(--ink-2);letter-spacing:.01em}

/* --- 今日：予定を濃く --- */
.tl .it{padding:16px 0 16px 15px}

.tl .it .ti{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.55}

   v18 — 区切りを戻す / 上部を簡素に / 国表示を整理
   ============================================================ */
/* 上部：＋ と ページ名だけ */

.clockbar{background:var(--side);border-bottom:1px solid var(--line-2)}
.clockbar .ck{display:flex;flex-direction:row;align-items:center;gap:10px;padding:10px 20px;margin:0;
  border-right:1px solid var(--line);border-bottom:2px solid transparent;border-left:0}
.clockbar .ck+.ck{padding-left:20px;border-left:0}

  text-transform:uppercase;line-height:1.4}
