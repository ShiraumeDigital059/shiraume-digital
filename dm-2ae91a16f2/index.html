<style>
:root{--bg:#FBF8F1;--ink:#2B2A2E;--gold:#B8912F;--green:#1E7A4A;--line:#e7e1d3;--mut:#8a8580}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:5;background:rgba(251,248,241,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px calc(10px) ;padding-top:max(10px,env(safe-area-inset-top))}
.wrap{max-width:760px;margin:0 auto}
.row1{display:flex;align-items:center;gap:10px}
h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
.cnt{font-size:12.5px;color:var(--mut);margin-left:auto;white-space:nowrap}
.bar{height:5px;background:#eee7d6;border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.row2{display:flex;gap:8px;align-items:center}
input[type=search]{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
.tabs{display:flex;background:#efe8d8;border-radius:10px;padding:3px;flex-shrink:0}
.tabs button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;padding:7px 10px;border-radius:8px;color:var(--mut);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
main{max-width:760px;margin:0 auto;padding:12px 12px calc(90px + env(safe-area-inset-bottom))}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card.sent{background:#f6f3ea}
.card.sent .acc,.card.sent .name{opacity:.55}
.head{display:flex;align-items:center;gap:10px}
.chk{width:30px;height:30px;flex-shrink:0;border-radius:8px;border:2px solid #cfc6b2;background:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.chk svg{width:18px;height:18px;opacity:0}
.card.sent .chk{background:var(--green);border-color:var(--green)}
.card.sent .chk svg{opacity:1}
.who{min-width:0;flex:1}
.acc{display:block;font-weight:700;font-size:16px;color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name{font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.no{font-size:11px;font-weight:700;background:#f2ecdd;border-radius:6px;padding:3px 6px;flex-shrink:0}
.note{margin-top:8px;font-size:12.5px;background:#fff6dc;border-left:3px solid var(--gold);padding:6px 9px;border-radius:4px}
.msg{margin-top:10px;white-space:pre-wrap;font-size:13.5px;line-height:1.7;color:#444;max-height:4.9em;overflow:hidden;position:relative;cursor:pointer}
.msg:after{content:"タップで全文";position:absolute;right:0;bottom:0;left:0;height:2.2em;background:linear-gradient(rgba(255,255,255,0),#fff 70%);font-size:11px;color:var(--mut);display:flex;align-items:flex-end;justify-content:flex-end}
.card.sent .msg:after{background:linear-gradient(rgba(246,243,234,0),#f6f3ea 70%)}
.msg.open{max-height:none}.msg.open:after{display:none}
.acts{display:flex;gap:8px;margin-top:10px}
