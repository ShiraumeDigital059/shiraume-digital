<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ありがとうございました｜shiraume supply</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--ink:#26241F;--sub:#6B655C;--line:#E6E0D4;--paper:#FBF9F4;--gold:#9C7C2E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
     color:var(--ink);line-height:1.9;font-size:15px;background:var(--paper);
     min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:#fff;border:1px solid var(--line);border-top:4px solid var(--gold);
     max-width:520px;width:100%;padding:48px 34px;text-align:center}
.box img{width:34px;height:34px;margin:0 auto 20px}
h1{font-size:21px;font-weight:600;margin-bottom:18px;letter-spacing:.04em}
p{font-size:14px;color:var(--sub);line-height:2.1;margin-bottom:16px}
.back{display:inline-block;margin-top:20px;padding:13px 30px;background:var(--ink);
      color:#fff;text-decoration:none;font-size:13.5px;letter-spacing:.08em;border-radius:2px}
</style>
</head>
<body>
<div class="box">
  <img src="../assets/images/shiraume-symbol-mark.png" alt="" onerror="this.style.display='none'">
  <h1>ありがとうございました</h1>
  <p>
    ご注文を受け付けました。<br>
    在庫と送料を確認のうえ、こちらから折り返しご連絡いたします。
  </p>
  <p>
    2営業日を過ぎても連絡がない場合は、<br>
    お手数ですが下記までご一報ください。<br>
    contact.shiraumedigital@gmail.com
  </p>
  <a class="back" href="index.html">商品ページに戻る</a>
</div>
</body>
</html>
