<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shiraume supply｜海外バズグッズ</title>
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="shiraume supply｜海外バズグッズ">
<meta property="og:description" content="海外で流行っている道具を、そのまま仕入れています。">

<!-- ═══════════════════════════════════════════════════════
     ★★ ここだけ書き換えれば商品が増減します ★★
     書き方は README.txt を見てください
     ═══════════════════════════════════════════════════════ -->
<script>
const SHOP_NAME = "shiraume supply";
const SHOP_SUB  = "海外バズグッズ";
const SHOP_LEAD = "海外のお店で実際に使われている道具を、そのまま仕入れています。<br>動画でご紹介したもののうち、お問い合わせの多かったものを置いています。";

const ITEMS = [

  {
    name:  "スナックカップ",
    price: 0,
    stock: "お取り寄せ",
    desc:  "上にスナックやトッピングを載せられる、二段のカップです。下がドリンク、上が食べもの。片手で両方持てるので、食べ歩きのお店で使われています。",
    note:  "台湾・韓国のドリンク店で定番の形です",
    img:   "images/item01.jpg",
    sub:   ["images/item01c.jpg", "images/item01b.jpg"],
    tag:   "動画で紹介"
  },

  {
    name:  "ツインカップ",
    price: 0,
    stock: "お取り寄せ",
    desc:  "ひとつのカップで、2種類の飲みものを同時に出せます。中が縦に仕切られているので混ざりません。ふたも左右に分かれています。",
    note:  "2つの味を選べる、色の対比を見せる、といった使い方に",
    img:   "images/item02.jpg",
    sub:   ["images/item02b.jpg"],
    tag:   "動画で紹介"
  },

];

// ご注文の受け先
const LINE_URL  = "https://lin.ee/zZOLYKc";
const INSTA_URL = "https://www.instagram.com/shiraume.digital_";
const MAIL_ADDR = "contact.shiraumedigital@gmail.com";

// 特定商取引法の表記（ここも必要なら書き換え）
const LAW = {
  seller:   "白梅デジタル　大西 一輝",
  address:  "ご請求いただき次第、遅滞なく開示いたします",
  tel:      "ご請求いただき次第、遅滞なく開示いたします",
  mail:     "contact.shiraumedigital@gmail.com",
  extra:    "送料（ご注文時にお伝えします）／お振込手数料",
  pay:      "銀行振込",
  payTime:  "ご注文の確認後、7日以内にお願いしております",
  ship:     "ご入金の確認後、7日以内に発送いたします。お取り寄せの商品は、その都度お伝えします",
  returns:  "商品に不良があった場合は、お届けから7日以内にご連絡ください。送料は当方で負担いたします。お客様のご都合による返品は、未開封のものに限り、お届けから7日以内・送料お客様負担で承ります"
};
</script>
<!-- ═══════════ ここまで ═══════════ -->

<style>
:root{
  --ink:#26241F; --sub:#6B655C; --line:#E6E0D4; --paper:#FBF9F4;
  --gold:#9C7C2E; --white:#fff; --ok:#3B6B47; --ng:#B4472F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
     color:var(--ink);background:var(--white);line-height:1.85;
     font-size:15px;-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:920px;margin:0 auto;padding:0 20px}

header{border-top:4px solid var(--gold);background:var(--paper);
       padding:38px 0 32px;text-align:center}
header .en{font-size:10px;letter-spacing:.34em;color:var(--gold);margin-bottom:12px}
header h1{font-size:27px;font-weight:600;letter-spacing:.14em}
header .sub{font-size:13px;letter-spacing:.2em;color:var(--gold);margin-top:9px}
header p{font-size:14px;color:var(--sub);margin-top:12px;line-height:1.9}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
      gap:22px;padding:40px 0 10px}
.card{border:1px solid var(--line);background:var(--white);
      display:flex;flex-direction:column;overflow:hidden}
.card .ph{aspect-ratio:1/1;background:linear-gradient(135deg,#F4F0E7,#E9E2D3);
          display:flex;align-items:center;justify-content:center;
          font-size:12px;color:#B2A78F;letter-spacing:.08em;position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.card .subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:2px;background:var(--line)}
.card .sub-ph{aspect-ratio:1/1;overflow:hidden;background:#F4F0E7}
.card .sub-ph img{width:100%;height:100%;object-fit:cover}
.card .body{padding:18px 18px 20px;display:flex;flex-direction:column;flex:1}
.card .tag{display:inline-block;align-self:flex-start;font-size:10px;
           letter-spacing:.1em;color:var(--gold);border:1px solid #D9C79A;
           padding:3px 9px;border-radius:2px;margin-bottom:10px}
.card h3{font-size:16px;font-weight:600;letter-spacing:.03em;margin-bottom:8px;line-height:1.6}
.card .desc{font-size:13px;color:var(--sub);line-height:1.95;margin-bottom:10px}
.card .note{font-size:12px;color:#8C857A;margin-bottom:12px;margin-top:auto}
.card .price{font-size:21px;font-weight:700;letter-spacing:.02em;
             border-top:1px solid var(--line);padding-top:13px}
.card .price small{font-size:11px;font-weight:400;color:var(--sub);margin-left:4px}
.card .stock{font-size:11px;color:var(--ok);margin-top:5px}
.card .stock.out{color:var(--ng)}
.card .buy{margin-top:14px;display:block;width:100%;border:1px solid var(--ink);
           background:var(--white);color:var(--ink);padding:11px;font-size:13px;
           letter-spacing:.06em;cursor:pointer;font-family:inherit;border-radius:2px;
           transition:background .15s,color .15s}
.card .buy:hover{background:var(--ink);color:#fff}
.card .buy.done{background:var(--ok);border-color:var(--ok);color:#fff}

.order{background:var(--paper);padding:44px 0;margin-top:30px;text-align:center}
.order h2{font-size:19px;font-weight:600;margin-bottom:14px;letter-spacing:.05em}
.order p{font-size:14px;color:var(--sub);line-height:2;margin-bottom:22px}
.btn{display:inline-block;text-decoration:none;padding:15px 34px;margin:6px;
     font-size:14px;letter-spacing:.08em;border-radius:2px}
.btn.dark{background:var(--ink);color:#fff}
.btn.line{background:#06C755;color:#fff}
.btn.mail{background:#fff;color:var(--ink);border:1px solid var(--line)}

.info{padding:44px 0}
.info h2{font-size:17px;font-weight:600;margin-bottom:16px;letter-spacing:.05em}
.info dl{border-top:1px solid var(--line)}
.info dt{font-size:13px;color:var(--sub);padding:14px 0 0}
.info dd{font-size:14px;padding:2px 0 14px;border-bottom:1px solid var(--line);line-height:1.9}

footer{background:var(--ink);color:#C7C0B4;text-align:center;
       padding:30px 0;font-size:12px;line-height:2}
footer a{color:#C7C0B4}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
       background:var(--ink);color:#fff;padding:13px 26px;font-size:13px;
       border-radius:3px;opacity:0;pointer-events:none;transition:.25s;z-index:99;
       max-width:90%;text-align:center;line-height:1.7}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:640px){
  .grid{grid-template-columns:1fr;gap:16px;padding-top:28px}
  header h1{font-size:21px}
  .btn{display:block;margin:8px 0}
}
</style>
</head>
<body>

<header>
  <div class="en">SHIRAUME DIGITAL</div>
  <h1 id="shopName"></h1>
  <div class="sub" id="shopSub"></div>
  <p id="shopLead"></p>
</header>

<div class="wrap">
  <div class="grid" id="grid"></div>
</div>

<div class="order">
  <div class="wrap">
    <h2>ご注文について</h2>
    <p>
      商品名と個数を、下のいずれかからお送りください。<br>
      在庫と送料をお伝えしたうえで、お支払い方法をご案内いたします。
    </p>
    <a href="#" class="btn line" id="lineBtn">LINEでご注文</a>
    <a href="#" class="btn dark" id="instaBtn">InstagramのDMでご注文</a>
    <a href="#" class="btn mail" id="mailBtn">メールでご注文</a>
  </div>
</div>

<div class="wrap">
  <div class="info">
    <h2>特定商取引法に基づく表記</h2>
    <dl id="law"></dl>
  </div>
</div>

<footer>
  白梅デジタル　Shiraume Digital<br>
  <a href="https://shiraumedigital.com/">shiraumedigital.com</a>
</footer>

<div class="toast" id="toast"></div>

<script>
document.getElementById('shopName').textContent = SHOP_NAME;
document.getElementById('shopSub').textContent = SHOP_SUB;
document.getElementById('shopLead').innerHTML = SHOP_LEAD;
document.getElementById('lineBtn').href  = LINE_URL;
document.getElementById('instaBtn').href = INSTA_URL;
document.getElementById('mailBtn').href  =
  'mailto:' + MAIL_ADDR + '?subject=' + encodeURIComponent('商品のご注文');

const yen = n => Number(n).toLocaleString('ja-JP');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('grid').innerHTML = ITEMS.map((it, i) => {
  const out = String(it.stock||'').includes('切');
  return `
  <div class="card">
    <div class="ph">${it.img ? `<img src="${esc(it.img)}" alt="${esc(it.name)}" onerror="this.remove()">` : ''}写真をここに</div>
    ${(it.sub && it.sub.length) ? `<div class="subs">${it.sub.map(s => `<div class="sub-ph"><img src="${esc(s)}" alt="" onerror="this.parentNode.remove()"></div>`).join('')}</div>` : ''}
    <div class="body">
      ${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ''}
      <h3>${esc(it.name)}</h3>
      <div class="desc">${esc(it.desc)}</div>
      ${it.note ? `<div class="note">${esc(it.note)}</div>` : '<div class="note"></div>'}
      <div class="price">${it.price ? '¥' + yen(it.price) : '価格はお問い合わせください'}${it.price ? '<small>税込</small>' : ''}</div>
      <div class="stock${out ? ' out' : ''}">${esc(it.stock||'')}</div>
      ${out ? '' : `<button class="buy" data-i="${i}">この商品を注文する</button>`}
    </div>
  </div>`;
}).join('');

const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('on'), 3200);
}

document.querySelectorAll('.buy').forEach(btn => {
  btn.addEventListener('click', async () => {
    const it = ITEMS[btn.dataset.i];
    const text = `${it.name}を1個お願いします。`;
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = 'コピーしました';
      btn.classList.add('done');
      showToast('「' + text + '」をコピーしました。LINEかDMに貼り付けてお送りください。');
      setTimeout(() => { btn.textContent = 'この商品を注文する'; btn.classList.remove('done'); }, 3000);
    } catch(e) {
      showToast('「' + text + '」とお送りください。');
    }
  });
});

document.getElementById('law').innerHTML = [
  ['販売事業者', LAW.seller], ['所在地', LAW.address], ['電話番号', LAW.tel],
  ['連絡先', LAW.mail], ['販売価格', '各商品に表示された金額（消費税込）'],
  ['商品代金以外の費用', LAW.extra], ['お支払い方法', LAW.pay],
  ['お支払い時期', LAW.payTime], ['お届け時期', LAW.ship], ['返品・交換', LAW.returns]
].map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
</script>

</body>
</html>
