const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yen = n => Number(n).toLocaleString('ja-JP');

document.getElementById('shopName').textContent = SHOP_NAME;
document.getElementById('shopSub').textContent = SHOP_SUB;
document.getElementById('shopLead').innerHTML = SHOP_LEAD;
document.getElementById('orderForm').action = 'https://formsubmit.co/' + FORM_TO;
document.getElementById('lineBtn').href = LINE_URL;
document.getElementById('instaBtn').href = INSTA_URL;
document.getElementById('mailBtn').href = 'mailto:' + FORM_TO + '?subject=' + encodeURIComponent('商品のご注文');

/* ───────── 商品カード：検索・並べ替え ───────── */
const grid = document.getElementById('grid');
const searchBox = document.getElementById('searchBox');
const sortSel = document.getElementById('sortSel');
const countEl = document.getElementById('count');

function cardHTML(it, origIdx){
const out = String(it.stock||'').includes('切');
return `
<div class="card">
<div class="ph">${it.img ? `<img src="${esc(it.img)}" alt="${esc(it.name)}" onerror="this.remove()">` : ''}写真をここに</div>
${(it.sub && it.sub.length) ? `<div class="subs">${it.sub.map(s => `<div class="sub-ph"><img src="${esc(s)}" alt="" onerror="this.parentNode.remove()"></div>`).join('')}</div>` : ''}
<div class="body">
${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ''}
<h3>${esc(it.name)}</h3>
<div class="desc">${esc(it.desc)}</div>
${it.note ? `<div class="note">${esc(it.note)}</div>` : '<div class="note"></div>'}
<div class="price">${it.price ? '¥' + yen(it.price) : '価格はお問い合わせください'}${it.price ? '<small>税込</small>' : ''}</div>
<div class="stock${out ? ' out' : ''}">${esc(it.stock||'')}</div>
${out ? '' : `<button class="buy" data-i="${origIdx}">この商品を注文する</button>`}
</div>
</div>`;
}

// 価格の並べ替え用キー（お問い合わせ=0 の商品は、安い順でも高い順でも末尾に回す）
const priceAscKey  = it => (Number(it.price) > 0 ? Number(it.price) :  Infinity);
const priceDescKey = it => (Number(it.price) > 0 ? Number(it.price) : -Infinity);

function currentList(){
let list = ITEMS.map((it, idx) => ({it, idx}));

const q = searchBox.value.trim().toLowerCase();
if(q){
list = list.filter(({it}) => {
const hay = [it.name, it.desc, it.note, it.tag].filter(Boolean).join(' ').toLowerCase();
return hay.includes(q);
});
}

const s = sortSel.value;
if(s === 'new')            list.sort((a,b) => b.idx - a.idx);
else if(s === 'old')       list.sort((a,b) => a.idx - b.idx);
else if(s === 'priceAsc')  list.sort((a,b) => priceAscKey(a.it)  - priceAscKey(b.it)  || a.idx - b.idx);
else if(s === 'priceDesc') list.sort((a,b) => priceDescKey(b.it) - priceDescKey(a.it) || a.idx - b.idx);

return list;
}

function render(){
const list = currentList();
if(list.length){
grid.innerHTML = list.map(({it, idx}) => cardHTML(it, idx)).join('');
} else {
grid.innerHTML = '<div class="empty">「' + esc(searchBox.value.trim()) + '」に一致する商品が見つかりませんでした。<br>別のことばでお試しください。</div>';
}
countEl.textContent = searchBox.value.trim() ? `${list.length}件が見つかりました` : `全${list.length}件`;

// 「この商品を注文する」→ フォームに商品を入れて移動
grid.querySelectorAll('.buy').forEach(btn => {
btn.addEventListener('click', () => {
document.getElementById('selItem').value = ITEMS[btn.dataset.i].name;
document.getElementById('order').scrollIntoView({behavior:'smooth'});
});
});
}

searchBox.addEventListener('input', render);
sortSel.addEventListener('change', render);
render();

/* ───────── 住所：都道府県プルダウン＋郵便番号で自動入力 ───────── */
const PREFS = ["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
const prefSel = document.getElementById('pref');
prefSel.innerHTML = '<option value="">お選びください</option>' + PREFS.map(p => `<option value="${p}">${p}</option>`).join('');

const zip = document.getElementById('zip');
const city = document.getElementById('city');
const banchi = document.getElementById('banchi');
const zipMsg = document.getElementById('zipMsg');

function setZipMsg(text, cls){
zipMsg.textContent = text;
zipMsg.className = 'zipmsg' + (cls ? ' ' + cls : '');
}

// 郵便番号 → 住所（zipcloud を JSONP で呼び出し。失敗しても手入力できます）
function lookupZip(){
const z = zip.value.replace(/[^0-9]/g, '');
if(z.length !== 7){
if(z.length === 0) setZipMsg('番号を入力すると、都道府県と市区町村が自動で入ります。', '');
return;
}
setZipMsg('住所を調べています…', '');
const cb = '__zipcb' + Date.now();
const s = document.createElement('script');
let done = false;
const cleanup = () => { delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s); };
const timer = setTimeout(() => {
if(done) return; done = true; cleanup();
setZipMsg('自動入力できませんでした。お手数ですが住所をご記入ください。', 'err');
}, 6000);
window[cb] = (res) => {
if(done) return; done = true; clearTimeout(timer); cleanup();
if(res && res.status === 200 && res.results && res.results[0]){
const r = res.results[0];
prefSel.value = r.address1;
city.value = (r.address2 || '') + (r.address3 || '');
setZipMsg('住所を入力しました。続けて番地・建物名をご記入ください。', 'ok');
if(!banchi.value) banchi.focus();
} else {
setZipMsg('この郵便番号の住所が見つかりませんでした。ご確認のうえ、手入力もできます。', 'err');
}
};
s.onerror = () => {
if(done) return; done = true; clearTimeout(timer); cleanup();
setZipMsg('自動入力できませんでした。お手数ですが住所をご記入ください。', 'err');
};
s.src = 'https://zipcloud.ibsnet.co.jp/api/search?zipcode=' + z + '&callback=' + cb;
document.body.appendChild(s);
}
zip.addEventListener('input', lookupZip);
zip.addEventListener('blur', lookupZip);
