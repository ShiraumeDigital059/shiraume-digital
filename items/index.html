<style>
:root{
--ink:#242830;--sub:#6B7178;--line:#E6E8EC;--paper:#F5F6F8;
--gold:#9C7C2E;--green:#2F5D3B;--white:#fff;--ok:#3B6B47;--ng:#B4472F;

}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);background:var(--white);line-height:1.85;font-size:15px;-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.np{display:inline-block}

.brand{position:absolute;top:16px;left:20px;display:flex;align-items:center;gap:9px;text-decoration:none;z-index:5}
.brand img{width:30px;height:30px}
.brand span{font-size:12px;letter-spacing:.14em;color:var(--ink)}

header{border-top:4px solid var(--green);background:linear-gradient(180deg,#FCFDFD,var(--paper));padding:66px 0 40px;text-align:center;position:relative}
header .en{font-size:10px;letter-spacing:.36em;color:var(--green);margin-bottom:12px;font-weight:600}
header h1{font-size:29px;font-weight:700;letter-spacing:.12em}
header .sub{display:inline-block;font-size:12px;letter-spacing:.2em;color:var(--gold);margin-top:12px;padding:4px 14px;border:1px solid #E4D8B8;border-radius:999px;background:#FCFAF3}
header p{font-size:14px;color:var(--sub);margin-top:18px;line-height:1.9;word-break:auto-phrase;line-break:strict;text-wrap:pretty}

/* 商品セクション（薄い背景でカードを浮かせる） */

.controls .sortwrap{position:relative;flex:0 0 auto}

.count{font-size:12px;color:var(--sub);padding:10px 2px 0;letter-spacing:.04em}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:26px;padding:16px 0 6px}
.card{border:1px solid var(--line);background:var(--white);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transition:transform .16s ease, box-shadow .16s ease}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
.card .ph{aspect-ratio:1/1;background:linear-gradient(135deg,#EEF0F2,#E2E5E9);display:flex;align-items:center;justify-content:center;font-size:12px;color:#A7ADB5;position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}

.card .sub-ph{aspect-ratio:1/1;overflow:hidden;background:#EEF0F2}
.card .sub-ph img{width:100%;height:100%;object-fit:cover}
.card .body{padding:20px 20px 22px;display:flex;flex-direction:column;flex:1}
.card .tag{display:inline-flex;align-self:flex-start;align-items:center;gap:5px;font-size:10px;letter-spacing:.1em;color:var(--green);background:#EDF3EE;border:1px solid #D2E2D6;padding:4px 10px;border-radius:999px;margin-bottom:12px}
.card h3{font-size:17px;font-weight:700;margin-bottom:6px;line-height:1.55}
.card h3::after{content:"";display:block;width:30px;height:2px;background:var(--gold);margin-top:9px;border-radius:2px}
.card .desc{font-size:13px;color:var(--sub);line-height:1.95;margin:10px 0 10px;word-break:auto-phrase;line-break:strict}
.card .note{font-size:12px;color:#9A9FA7;margin-bottom:12px;margin-top:auto}
.card .price{font-size:20px;font-weight:800;border-top:1px solid var(--line);padding-top:14px;letter-spacing:.02em}
.card .price small{font-size:11px;font-weight:400;color:var(--sub);margin-left:5px}
.card .stock{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ok);margin-top:7px}
.card .stock::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
.card .stock.out{color:var(--ng)}
.card .stock.out::before{background:var(--ng)}
.card .buy{margin-top:16px;display:block;width:100%;border:0;background:var(--ink);color:#fff;padding:13px;font-size:13px;letter-spacing:.04em;cursor:pointer;font-family:inherit;border-radius:9px;transition:background .16s}
.card .buy:hover{background:var(--green)}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:56px 20px;font-size:14px;line-height:2}

.order-hero .en{font-size:10px;letter-spacing:.34em;color:rgba(255,255,255,.75);margin-bottom:12px}
.order-hero h2{font-size:25px;font-weight:700;letter-spacing:.06em;color:#fff}
.order-hero .lead{font-size:13.5px;color:rgba(255,255,255,.92);line-height:2;margin-top:14px;word-break:auto-phrase;line-break:strict;text-wrap:pretty}
.form{max-width:580px;margin:-48px auto 0;position:relative;z-index:2;background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-hover);padding:30px 28px}
.f{margin-bottom:19px}
.f label{display:block;font-size:13px;color:var(--sub);margin-bottom:7px;letter-spacing:.04em}
.f label .req{color:var(--ng);font-size:10px;margin-left:6px}
.f label .opt{color:#A5AAB1;font-size:10px;margin-left:6px}
.f input,.f select,.f textarea{width:100%;padding:12px 13px;border:1px solid var(--line);background:var(--white);font-family:inherit;font-size:16px;color:var(--ink);border-radius:9px;transition:border-color .14s, box-shadow .14s}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(47,93,59,.10)}
.f textarea{resize:vertical;min-height:82px}
.f .hint{font-size:11px;color:#A5AAB1;margin-top:6px;line-height:1.7}
/* 住所ブロック */
.addr{border:1px solid var(--line);border-radius:12px;padding:18px 16px 4px;background:#FAFBFC}
.addr .lbl{display:block;font-size:13px;color:var(--sub);margin-bottom:12px;letter-spacing:.04em}
.addr .lbl .req{color:var(--ng);font-size:10px;margin-left:6px}
.zip{display:flex;gap:8px;align-items:center}
.zip .yubin{font-size:15px;color:var(--sub)}
.zip input{max-width:170px}
.zipmsg{font-size:11px;margin-top:6px;min-height:15px;line-height:1.6}
.zipmsg.ok{color:var(--ok)}
.zipmsg.err{color:var(--ng)}
.sub-f{margin-top:13px}
.sub-f span{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.qty{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.qty label{display:block;margin:0;cursor:pointer}
.qty input{display:none}
.qty span{display:block;text-align:center;padding:12px 4px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:var(--white);transition:.12s}
.qty input:checked + span{background:var(--ink);color:#fff;border-color:var(--ink)}
#qtyOther{display:none;margin-top:9px}
#qtyOther.on{display:block}
.submit{width:100%;background:var(--green);color:#fff;border:0;padding:16px;font-size:15px;letter-spacing:.1em;cursor:pointer;font-family:inherit;border-radius:10px;margin-top:6px;transition:opacity .16s}
.submit:hover{opacity:.9}
.alt{text-align:center;margin-top:22px;font-size:13px;color:var(--sub);line-height:2}
.alt a{color:var(--green);font-weight:600;text-decoration:none;border-bottom:1px solid rgba(47,93,59,.3)}

.info{padding:48px 0}
.info h2{font-size:17px;font-weight:700;margin-bottom:16px}
.info dl{border-top:1px solid var(--line)}
.info dt{font-size:13px;color:var(--sub);padding:14px 0 0}
.info dd{font-size:14px;padding:2px 0 14px;border-bottom:1px solid var(--line);line-height:1.9;word-break:auto-phrase;line-break:strict}

footer{background:var(--ink);color:#B9C0C7;text-align:center;padding:34px 0;font-size:12px;line-height:2}
footer a{color:#B9C0C7}

@media(max-width:640px){
.grid{grid-template-columns:1fr;gap:16px}
header h1{font-size:23px}
header{padding-top:60px}
.form{padding:24px 18px;margin-top:-40px}
.order-hero{padding:56px 0 80px}
.order-hero h2{font-size:22px}
.controls{gap:9px}
.controls .sortwrap{flex:1 1 100%}
.controls select{width:100%}
}
</style>
</head>

<img src="../assets/images/shiraume-symbol-mark.png" alt="白梅デジタル" onerror="this.style.display='none'">
<span>白梅デジタル</span>
</a>

<header>
<div class="en">SHIRAUME DIGITAL</div>
<h1 id="shopName"></h1>
<div class="sub" id="shopSub"></div>
<p id="shopLead"></p>
</header>

<div class="products">
<div class="wrap">
<div class="controls">
<div class="search">
<input type="search" id="searchBox" placeholder="商品を検索（名前・説明・タグ）" autocomplete="off">
</div>
<div class="sortwrap">
<select id="sortSel" aria-label="並べ替え">
<option value="new">新しい順</option>
<option value="old">古い順</option>
<option value="priceAsc">価格が安い順</option>
<option value="priceDesc">価格が高い順</option>
</select>
</div>
</div>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>
</div>
</div>

<div class="order" id="order">
<div class="order-hero">
<div class="wrap">
<div class="en">CONTACT / ORDER</div>
<h2>ご注文・お問い合わせ</h2>
<div class="lead">
<span class="np">下記をご記入のうえ、</span><span class="np">お進みください。</span><br>
<span class="np">在庫と送料をお伝えしたうえで、</span><span class="np">お支払い方法をご案内いたします。</span>
</div>
</div>
</div>

<div class="wrap">
<form class="form" id="orderForm" method="POST">
<input type="hidden" name="_subject" value="【shiraume supply】ご注文がありました">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_next" value="https://shiraumedigital.com/items/thanks.html">

<div class="f">
<label>商品<span class="req">必須</span></label>
<select name="商品" id="selItem" required></select>
</div>

<div class="f">
<label>数量<span class="req">必須</span></label>
<div class="qty" id="qtyBox"></div>
<input type="number" id="qtyOther" name="数量（その他）" placeholder="個数を入力してください" min="1" step="1">
</div>

<div class="f">
<label>お名前<span class="req">必須</span></label>
<input type="text" name="お名前" required placeholder="例）白梅 太郎">
</div>

<div class="f">
<label>会社名・屋号<span class="opt">任意</span></label>
<input type="text" name="会社名・屋号" placeholder="個人の方は空欄で結構です">
</div>

<div class="f">
<div class="addr">
<span class="lbl">お届け先のご住所<span class="req">必須</span></span>

<div class="sub-f">
<span>郵便番号</span>
<div class="zip">
<span class="yubin">〒</span>
<input type="text" name="郵便番号" id="zip" inputmode="numeric" autocomplete="postal-code" placeholder="1234567" maxlength="8" required>
</div>
<div class="zipmsg" id="zipMsg">番号を入力すると、都道府県と市区町村が自動で入ります。</div>
</div>

<div class="sub-f">
<span>都道府県</span>
<select name="都道府県" id="pref" required></select>
</div>

<div class="sub-f">
<span>市区町村・町名</span>
<input type="text" name="市区町村" id="city" required placeholder="例）大阪市北区梅田">
</div>

<div class="sub-f">
<span>番地・丁目</span>
<input type="text" name="番地" id="banchi" required placeholder="例）1丁目2-3">
</div>

<div class="sub-f">
<span>建物名・部屋番号<span class="opt" style="color:#A5AAB1;font-size:10px;margin-left:6px">任意</span></span>
<input type="text" name="建物名・部屋番号" id="bldg" placeholder="例）白梅ビル 4F">
</div>
</div>
</div>

<div class="f">
<label>お電話番号<span class="req">必須</span></label>
<input type="tel" name="お電話番号" required placeholder="090-0000-0000">
</div>

<div class="f">
<label>メールアドレス<span class="req">必須</span></label>
<input type="email" name="メールアドレス" required placeholder="example@example.com">
</div>

<div class="f">
<label>メモ<span class="opt">任意</span></label>
<textarea name="メモ" placeholder="ご希望の納期、色やサイズのご指定など、ございましたらご記入ください"></textarea>
</div>

<button type="submit" class="submit">購入に進む</button>
</form>

<div class="alt">
フォームが使いにくい場合は、こちらからでも承ります。<br>
<a href="#" id="lineBtn" target="_blank" rel="noopener">LINE</a> ／
<a href="#" id="instaBtn" target="_blank" rel="noopener">InstagramのDM</a> ／
<a href="#" id="mailBtn">メール</a>
</div>
</div>
</div>

<div class="wrap">
<div class="info">
<h2>特定商取引法に基づく表記</h2>
<dl id="law"></dl>
</div>
</div>

<footer>
白梅デジタル Shiraume Digital<br>
<a href="https://shiraumedigital.com/">shiraumedigital.com</a>
</footer>

<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yen = n => Number(n).toLocaleString('ja-JP');

document.getElementById('shopName').textContent = SHOP_NAME;
document.getElementById('shopSub').textContent = SHOP_SUB;
document.getElementById('shopLead').innerHTML = SHOP_LEAD;
document.getElementById('orderForm').action = 'https://formsubmit.co/' + FORM_TO;
document.getElementById('lineBtn').href = LINE_URL;
document.getElementById('instaBtn').href = INSTA_URL;
document.getElementById('mailBtn').href = 'mailto:' + FORM_TO + '?subject=' + encodeURIComponent('商品のご注文');

/* ───────── 商品カード：検索・並べ替え ───────── */
const grid = document.getElementById('grid');
const searchBox = document.getElementById('searchBox');
const sortSel = document.getElementById('sortSel');
const countEl = document.getElementById('count');

function cardHTML(it, origIdx){
const out = String(it.stock||'').includes('切');
return `
<div class="card">
<div class="ph">${it.img ? `<img src="${esc(it.img)}" alt="${esc(it.name)}" onerror="this.remove()">` : ''}写真をここに</div>
${(it.sub && it.sub.length) ? `<div class="subs">${it.sub.map(s => `<div class="sub-ph"><img src="${esc(s)}" alt="" onerror="this.parentNode.remove()"></div>`).join('')}</div>` : ''}
<div class="body">
${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ''}
<h3>${esc(it.name)}</h3>
<div class="desc">${esc(it.desc)}</div>
${it.note ? `<div class="note">${esc(it.note)}</div>` : '<div class="note"></div>'}
<div class="price">${it.price ? '¥' + yen(it.price) : '価格はお問い合わせください'}${it.price ? '<small>税込</small>' : ''}</div>
<div class="stock${out ? ' out' : ''}">${esc(it.stock||'')}</div>
${out ? '' : `<button class="buy" data-i="${origIdx}">この商品を注文する</button>`}
</div>
</div>`;
}

// 価格の並べ替え用キー（お問い合わせ=0 の商品は、安い順でも高い順でも末尾に回す）
const priceAscKey  = it => (Number(it.price) > 0 ? Number(it.price) :  Infinity);
const priceDescKey = it => (Number(it.price) > 0 ? Number(it.price) : -Infinity);

function currentList(){
let list = ITEMS.map((it, idx) => ({it, idx}));

const q = searchBox.value.trim().toLowerCase();
if(q){
list = list.filter(({it}) => {
const hay = [it.name, it.desc, it.note, it.tag].filter(Boolean).join(' ').toLowerCase();
return hay.includes(q);
});
}

const s = sortSel.value;
if(s === 'new')            list.sort((a,b) => b.idx - a.idx);
else if(s === 'old')       list.sort((a,b) => a.idx - b.idx);
else if(s === 'priceAsc')  list.sort((a,b) => priceAscKey(a.it)  - priceAscKey(b.it)  || a.idx - b.idx);
else if(s === 'priceDesc') list.sort((a,b) => priceDescKey(b.it) - priceDescKey(a.it) || a.idx - b.idx);

return list;
}

function render(){
const list = currentList();
if(list.length){
grid.innerHTML = list.map(({it, idx}) => cardHTML(it, idx)).join('');
} else {
grid.innerHTML = '<div class="empty">「' + esc(searchBox.value.trim()) + '」に一致する商品が見つかりませんでした。<br>別のことばでお試しください。</div>';
}
countEl.textContent = searchBox.value.trim() ? `${list.length}件が見つかりました` : `全${list.length}件`;

// 「この商品を注文する」→ フォームに商品を入れて移動
grid.querySelectorAll('.buy').forEach(btn => {
btn.addEventListener('click', () => {
document.getElementById('selItem').value = ITEMS[btn.dataset.i].name;
document.getElementById('order').scrollIntoView({behavior:'smooth'});
});
});
}

searchBox.addEventListener('input', render);
sortSel.addEventListener('change', render);
render();

/* ───────── 注文フォーム：商品・数量の選択肢 ───────── */
document.getElementById('selItem').innerHTML =
'<option value="">お選びください</option>' +
ITEMS.map(it => `<option value="${esc(it.name)}">${esc(it.name)}</option>`).join('') +
'<option value="その他・ご相談">その他・ご相談</option>';

document.getElementById('qtyBox').innerHTML =
QTY.map((q,i) => `<label><input type="radio" name="数量" value="${q}個" required><span>${yen(q)}個</span></label>`).join('') +
`<label><input type="radio" name="数量" value="その他"><span>その他</span></label>`;

const other = document.getElementById('qtyOther');
document.querySelectorAll('input[name="数量"]').forEach(r => {
r.addEventListener('change', () => {
const on = r.value === 'その他' && r.checked;
other.classList.toggle('on', on);
other.required = on;
if (on) other.focus(); else other.value = '';
});
});

const prefSel = document.getElementById('pref');
prefSel.innerHTML = '<option value="">お選びください</option>' + PREFS.map(p => `<option value="${p}">${p}</option>`).join('');

const zip = document.getElementById('zip');
const city = document.getElementById('city');
const banchi = document.getElementById('banchi');
const zipMsg = document.getElementById('zipMsg');

function setZipMsg(text, cls){
zipMsg.textContent = text;
zipMsg.className = 'zipmsg' + (cls ? ' ' + cls : '');
}

if(!banchi.value) banchi.focus();
} else {
