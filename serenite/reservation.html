<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serenite ご予約フォーム</title>
<style>
  :root{
    --cream:#FBFAF6; --card:#FFFFFF; --ink:#33322E; --ink-soft:#6E6B63;
    --line:#E4DED2; --line-in:#DED8CC; --blue:#6E8496; --blue-soft:#EEF1F3;
    --sage:#7F9A82; --sage-bg:#EDF2ED; --focus:#9DB0BC;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
    background:var(--cream); color:var(--ink);
    -webkit-font-smoothing:antialiased; padding:40px 18px 60px; line-height:1.7;
  }
  .sheet{
    max-width:600px; margin:0 auto; background:var(--card);
    border:1px solid var(--line); border-radius:4px; padding:48px 46px 44px;
    box-shadow:0 18px 50px -30px rgba(60,60,60,.35);
  }
  .masthead{text-align:center;position:relative;}
  .backlink{position:absolute;left:0;top:6px;font-size:12px;letter-spacing:.1em;color:var(--blue);text-decoration:none;}
  .backlink:hover{opacity:.7;}
  .logo{width:186px;max-width:60%;height:auto;opacity:.92;}
  .title-wrap{text-align:center;margin:22px 0 4px;}
  .divider{display:flex;align-items:center;justify-content:center;gap:16px;color:#C8BFAE;margin:6px auto 4px;}
  .divider svg{width:120px;height:16px;}
  h1{font-weight:500;font-size:26px;letter-spacing:.34em;padding-left:.34em;}
  .subtitle{font-size:12.5px;color:var(--ink-soft);letter-spacing:.16em;margin-top:6px;}
  .intro{margin:24px auto 30px;text-align:center;font-size:13.5px;color:var(--ink-soft);line-height:2;}
  form{display:flex;flex-direction:column;gap:22px;}
  .field{display:flex;flex-direction:column;gap:8px;}
  label{font-size:13px;letter-spacing:.08em;color:#4F5A62;}
  label .req{color:#B98A7A;font-size:11px;margin-left:8px;letter-spacing:.1em;}
  input[type=text], input[type=date], select, textarea{
    font-family:inherit; font-size:14.5px; color:var(--ink);
    background:#FCFBF8; border:1px solid var(--line-in); border-radius:3px;
    padding:11px 13px; width:100%; transition:border-color .15s, box-shadow .15s;
  }
  textarea{min-height:78px;resize:vertical;line-height:1.8;}
  input:focus, select:focus, textarea:focus{
    outline:none; border-color:var(--focus); box-shadow:0 0 0 3px rgba(157,176,188,.15);
  }
  select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236E8496' stroke-width='1.3'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:34px;}
  /* size options as pills */
  .sizes{display:flex;gap:10px;flex-wrap:wrap;}
  .size-opt{flex:1;min-width:120px;}
  .size-opt input{position:absolute;opacity:0;pointer-events:none;}
  .size-opt label{
    display:block;cursor:pointer;text-align:center;border:1px solid var(--line-in);
    border-radius:3px;padding:12px 8px;background:#FCFBF8;transition:all .15s;
  }
  .size-opt .sz{font-size:16px;letter-spacing:.1em;color:var(--ink);display:block;}
  .size-opt .pr{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .size-opt input:checked + label{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 2px rgba(110,132,150,.12);}
  .row2{display:flex;gap:16px;}
  .row2 .field{flex:1;}
  .note{font-size:12px;color:var(--ink-soft);background:#FAF6EF;border:1px solid #EFE8DB;border-radius:3px;padding:12px 15px;line-height:1.9;letter-spacing:.03em;}
  .submit{
    margin-top:6px;border:none;cursor:pointer;font-family:inherit;
    background:#4F5A62;color:#fff;font-size:15px;letter-spacing:.22em;padding:15px;border-radius:3px;
    transition:background .2s;
  }
  .submit:hover{background:#3E474D;}
  .sign{text-align:center;margin-top:30px;}
  .sign img{width:110px;height:auto;opacity:.32;}
  /* thank you */
  .thanks{display:none;text-align:center;padding:24px 10px 6px;animation:fade .4s ease;}
  .thanks.show{display:block;}
  .thanks .mark{width:52px;height:52px;border-radius:50%;background:var(--sage-bg);color:var(--sage);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;}
  .thanks h2{font-weight:500;font-size:19px;letter-spacing:.14em;margin-bottom:10px;}
  .thanks p{font-size:13.5px;color:var(--ink-soft);line-height:2;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;}}
  @media(max-width:560px){.sheet{padding:34px 22px;}h1{font-size:22px;}.row2{flex-direction:column;gap:22px;}}
</style>
</head>

      <h1>ご予約フォーム</h1>
      <div class="subtitle">完全予約制チーズケーキ</div>
    </div>

    <p class="intro">
      下記をご入力ください。折り返し、こちらからご連絡いたします。<br>
      DMでのやり取りは不要になります。
    </p>

    <form id="resform" onsubmit="return submitForm(event)">
      <div class="field">
        <label>お名前<span class="req">必須</span></label>
        <input type="text" name="name" placeholder="山田 花子" required>
      </div>

      <div class="field">
        <label>ご連絡先（Instagram / LINE のお名前など）<span class="req">必須</span></label>
        <input type="text" name="contact" placeholder="@your_id または LINEのお名前" required>
      </div>

      <div class="row2">
        <div class="field">
          <label>電話番号<span class="req">必須</span></label>
          <input type="text" name="tel" inputmode="tel" placeholder="090-1234-5678" required>
        </div>
        <div class="field">
          <label>メールアドレス<span class="req">必須</span></label>
          <input type="text" name="email" inputmode="email" placeholder="example@mail.com" required>
        </div>
      </div>

      <div class="field">
        <label>サイズ<span class="req">必須</span></label>
        <div class="sizes">
          <div class="size-opt">
            <input type="radio" name="size" id="s4" value="4号" required>
            <label for="s4"><span class="sz">4号</span><span class="pr">¥4,200</span></label>
          </div>
          <div class="size-opt">
            <input type="radio" name="size" id="s5" value="5号">
            <label for="s5"><span class="sz">5号</span><span class="pr">¥5,800</span></label>
          </div>
          <div class="size-opt">
            <input type="radio" name="size" id="s6" value="6号">
            <label for="s6"><span class="sz">6号</span><span class="pr">¥7,800</span></label>
          </div>
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label>個数<span class="req">必須</span></label>
          <select name="qty" required>
            <option value="1">1台</option><option value="2">2台</option>
            <option value="3">3台</option><option value="4">4台以上</option>
          </select>
        </div>
        <div class="field">
          <label>ご希望の製造月<span class="req">必須</span></label>
          <select name="month" required>
            <option value="" disabled selected>お選びください</option>
            <option>2026年 9月</option><option>2026年 10月</option>
            <option>2026年 11月</option><option>2026年 12月</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>お届け先（都道府県・ご住所）<span class="req">必須</span></label>
        <input type="text" name="addr" placeholder="東京都◯◯区…" required>
      </div>

      <div class="field">
        <label>お届け希望日（目安）</label>
        <input type="date" name="date">
      </div>

      <div class="field">
        <label>ご要望（のし・メッセージカード・その他）</label>
        <textarea name="memo" placeholder="例）誕生日用にメッセージカードを添えてください"></textarea>
      </div>

      <div class="note">
        発送はクロネコ クール便・全国対応です。製造日当日に発送し、地域により1〜3日以内にお届けします。送料は別途、お届け先に応じて申し受けます。
      </div>

      <button type="submit" class="submit">予約を送信する</button>
    </form>
